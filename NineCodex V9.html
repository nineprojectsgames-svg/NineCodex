<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex — Creador de Historias</title>
<style>
:root{
  --bg:#0f0c09; --bg2:#171310; --paper:#1d1813; --paper2:#241d16;
  --line:#3a2f22; --line2:#4d3f2c;
  --ink:#e9dfcc; --ink-dim:#b7a68c; --muted:#8a7a63;
  --gold:#c9a227; --gold-soft:#8a6f1c;
  --red:#a8443a; --green:#5c8a4a; --blue:#4a6f8a;
  --body-font:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
  --radius:5px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(1200px 600px at 50% -10%, var(--paper2) 0%, var(--bg) 60%) fixed, var(--bg);
  color:var(--ink); font-family:var(--body-font); font-size:15px; overflow:hidden;
  transition:background .3s ease, color .3s ease;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--line2)}

.topbar{
  height:54px;display:flex;align-items:center;gap:14px;padding:0 16px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(var(--paper2),var(--bg2));
  box-shadow:0 2px 10px #0008; position:relative; z-index:50;
}
.brand{font-size:17px;letter-spacing:.5px;color:var(--gold);white-space:nowrap}
.brand b{color:var(--ink);font-weight:600}
#topProjName{flex:1;text-align:center;color:var(--ink-dim);font-style:italic;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 10px}
.top-actions{display:flex;gap:8px;align-items:center}
.savestate{font-size:12px;color:var(--muted);min-width:78px;text-align:right;font-style:italic}

.btn{
  background:linear-gradient(var(--paper2),var(--bg2));
  border:1px solid var(--line2); color:var(--ink);
  padding:6px 11px;border-radius:4px;cursor:pointer;font-size:13px;
  font-family:inherit; transition:.15s; white-space:nowrap;
}
.btn:hover{background:linear-gradient(var(--line),var(--paper2));border-color:var(--gold-soft);color:#fff}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(#6b5715,#4a3d10);border-color:var(--gold);color:#f5e9c8}
.btn.primary:hover{background:linear-gradient(#8a6f1c,#6b5715)}
.btn.danger{color:#e2a49c;border-color:#5a2f2a}
.btn.danger:hover{background:#3a1d19;border-color:var(--red);color:#ffd9d4}
.btn.small{padding:4px 8px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-dim)}
.btn.ghost:hover{background:var(--paper2);color:var(--ink)}

.layout{display:flex;height:calc(100vh - 54px)}
.sidebar{
  width:258px;flex:0 0 258px;border-right:1px solid var(--line);
  overflow-y:auto;padding:14px 10px;background:linear-gradient(180deg,var(--bg2),var(--bg));
  transition:width .18s ease, flex-basis .18s ease, padding .18s ease, border-color .18s ease;
}
body.sidebar-hidden .sidebar{
  width:0;flex-basis:0;padding:0;border-right-color:transparent;overflow:hidden;
}
body.sidebar-hidden #btnCollapseSidebar{ color:var(--gold); }

.navgroup{margin-bottom:14px}
.navgroup h4{
  margin:0 0 6px 10px;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--gold-soft);font-weight:600;
}
.navitem{
  display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:4px;
  cursor:pointer;color:var(--ink-dim);font-size:14px;transition:.12s;border-left:2px solid transparent;
}
.navitem:hover{background:var(--paper2);color:var(--ink)}
.navitem.active{background:linear-gradient(90deg,#33281a,var(--paper2));color:var(--gold);border-left-color:var(--gold)}
.navitem .ic{width:18px;text-align:center;font-size:14px}
.main{flex:1;overflow-y:auto;padding:26px 40px 80px}
.page{max-width:1400px;margin:0 auto}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
h1,h2,h3,h4{margin:0;font-weight:600}
.page-head h1{font-size:26px;color:var(--ink);letter-spacing:.3px}
.page-head h1:before{content:'❧ ';color:var(--gold-soft);font-size:20px}

.paper{
  background:linear-gradient(180deg,rgba(255,255,255,.022),rgba(0,0,0,.07)),var(--paper);
  border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 3px 0 #00000055, inset 0 0 70px rgba(0,0,0,.35);
  padding:20px 24px;position:relative;
}
.paper:before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:5px 0 0 5px;
  background:linear-gradient(180deg, rgba(201,162,39,.22), transparent 70%);
}
.paper + .paper{margin-top:16px}

.split{display:flex;gap:24px;align-items:flex-start;max-width:100%;margin:0 auto}
.pane-list{width:280px;flex:0 0 280px;position:sticky;top:0}
.pane-detail{flex:1;min-width:0}
.pane-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pane-head h3{font-size:14px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold-soft)}
.pane-actions{display:flex;gap:5px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:5px}
.list-item{
  display:flex;flex-direction:column;gap:2px;padding:9px 12px;border-radius:4px;cursor:pointer;
  border:1px solid transparent;background:var(--bg2);transition:.12s;position:relative;
}
.list-item:hover{background:var(--paper2);border-color:var(--line)}
.list-item.active{background:linear-gradient(90deg,#33281a,#211a13);border-color:var(--gold-soft)}
.list-item .li-title{font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .li-sub{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .li-thumb{width:100%;height:60px;background-size:cover;background-position:center;border-radius:3px;margin-bottom:5px;border:1px solid var(--line)}
.empty{color:var(--muted);font-style:italic;font-size:13px;padding:14px 10px;text-align:center}

.li-move{position:absolute; right:6px; top:50%; transform:translateY(-50%); display:flex; gap:2px; opacity:0; transition:.15s;}
.list-item:hover .li-move{ opacity:1; }
.li-move button{background:var(--paper2); border:1px solid var(--line); color:var(--ink-dim); cursor:pointer; font-size:9px; padding:1px 4px; border-radius:2px; height:16px; line-height:1;}
.li-move button:hover{ background:var(--line); color:var(--gold); border-color:var(--gold-soft); }

.pane-tools{ display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;}
.pane-tools .pt-search{ flex:1; min-width:120px; padding:6px 9px!important; font-size:12.5px!important; }
.pane-tools .pt-sort{ width:auto!important; padding:6px 6px!important; font-size:12px!important; }

.folder-header{
  display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:4px;
  background:linear-gradient(90deg,var(--paper2),var(--bg2)); border:1px solid var(--line);
  font-size:13px; color:var(--gold); cursor:pointer; user-select:none; margin-top:6px;
}
.folder-header:hover{ border-color:var(--gold-soft); }
.folder-header .caret{ font-size:9px; width:12px; text-align:center; color:var(--gold-soft); }
.folder-header .fname{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.folder-header .fcount{ color:var(--muted); font-size:11px; }
.folder-header .fbtns{ display:flex; gap:3px; opacity:0; transition:.15s; }
.folder-header:hover .fbtns{ opacity:1; }
.folder-header .fbtns button{ padding:0 5px; font-size:11px; min-width:0; height:20px; line-height:1; }
.folder-children{ margin-left:8px; padding-left:8px; border-left:1px dashed var(--line); margin-bottom:4px; }
.folder-empty{ color:var(--muted); font-size:11px; padding:4px 14px; font-style:italic; }

.collapse-card{ margin-bottom:14px; }
.collapse-head{
  display:flex; align-items:center; gap:10px; padding:12px 18px;
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.06)),var(--paper);
  border:1px solid var(--line); border-radius:var(--radius); cursor:pointer; user-select:none;
  transition:.15s;
}
.collapse-head:hover{ border-color:var(--gold-soft); }
.collapse-head .caret{ color:var(--gold); font-size:11px; width:14px; }
.collapse-head h2{ margin:0; font-size:19px; color:var(--gold); flex:1; }
.collapse-body{
  border:1px solid var(--line); border-top:none; border-radius:0 0 5px 5px;
  padding:18px 22px; background:var(--paper);
  box-shadow:0 3px 0 #00000055, inset 0 0 70px rgba(0,0,0,.35);
}

.tree-row .caret{ width:14px; flex:0 0 14px; text-align:center; font-size:9px; color:var(--gold-soft); cursor:pointer; }
.tree-row .caret:hover{ color:var(--gold); }

.field{display:block;margin-bottom:12px}
.field > span{display:block;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--gold-soft);margin-bottom:4px}
input[type=text],input[type=number],input:not([type]),textarea,select{
  width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);
  padding:8px 10px;border-radius:4px;font-family:inherit;font-size:14px;outline:none;transition:.15s;
}
input:focus,textarea:focus,select:focus{border-color:var(--gold-soft);background:var(--bg2)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
select{cursor:pointer}
.title-row{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.title-input{
  font-size:22px!important;font-weight:600;background:transparent!important;border:none!important;
  border-bottom:1px solid var(--line)!important;border-radius:0!important;padding:6px 2px!important;color:var(--ink)!important;
  flex:1;min-width:150px;
}
.title-input:focus{border-bottom-color:var(--gold)!important}
.row-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.hint{font-size:12px;color:var(--muted);font-style:italic;margin:-6px 0 12px}

/* EDITOR */
.editor{border:1px solid var(--line);border-radius:var(--radius);background:#191410;overflow:hidden;margin-bottom:12px;position:relative;}
.ed-toolbar{
  display:flex;flex-wrap:wrap;gap:3px;padding:6px;border-bottom:1px solid var(--line);
  background:linear-gradient(var(--paper2),var(--bg2));position:sticky;top:0;z-index:5;
}
.ed-toolbar button{
  background:var(--paper2);border:1px solid var(--line);color:var(--ink-dim);border-radius:3px;
  min-width:28px;height:26px;padding:0 6px;cursor:pointer;font-size:12.5px;font-family:inherit;transition:.12s;
}
.ed-toolbar button:hover{background:var(--line);color:#fff;border-color:var(--gold-soft)}
.ed-sel{width:auto!important;padding:3px 5px!important;font-size:12px!important;height:26px}
.ed-color{
  display:inline-flex;align-items:center;gap:2px;background:var(--paper2);border:1px solid var(--line);
  border-radius:3px;height:26px;padding:0 5px;cursor:pointer;font-size:12px;color:var(--ink-dim);
}
.ed-color input{width:18px;height:18px;padding:0;border:none;background:none;cursor:pointer}
.editor-area{
  padding:16px 20px;min-height:170px;outline:none;line-height:1.7;color:var(--ink);
  font-size:16px;word-wrap:break-word;
}
.editor-area:focus{background:#1c1611}
.editor-area h1{font-size:1.7em;border-bottom:1px solid var(--line);padding-bottom:.15em;margin:.4em 0}
.editor-area h2{font-size:1.4em;margin:.5em 0 .3em}
.editor-area h3{font-size:1.18em;margin:.5em 0 .3em}
.editor-area blockquote{border-left:3px solid var(--gold);margin:.6em 0;padding:2px 0 2px 14px;color:var(--ink-dim);font-style:italic}
.editor-area pre{background:#0e0b08;padding:10px;border-radius:4px;border:1px solid var(--line);overflow:auto}
.editor-area ul,.editor-area ol{padding-left:26px;margin:.5em 0}
.editor-area img{max-width:100%;border-radius:4px;border:1px solid var(--line);margin:4px 0}
.editor-area a{color:var(--gold);text-decoration:underline;cursor:pointer}
.editor-area a[data-internal]{background:#3a2f2255;padding:1px 5px;border-radius:3px;border:1px dashed var(--gold-soft);text-decoration:none}
.editor-area table{border-collapse:collapse;width:100%;margin:.7em 0}
.editor-area td,.editor-area th{border:1px solid var(--line2);padding:6px 9px;min-width:40px}
.editor-area th{background:var(--paper2)}

/* Fullscreen editor */
.editor.editor-fullscreen{
  position:fixed; inset:0; z-index:100; background:var(--bg);
  border-radius:0; border:none; display:flex; flex-direction:column; margin:0;
}
.editor.editor-fullscreen .ed-toolbar{ position:sticky; top:0; z-index:2; }
.editor.editor-fullscreen .editor-area{
  flex:1; overflow:auto; max-width:900px; width:100%; margin:0 auto;
  font-size:18px; padding:32px 24px 80px; min-height:0;
}

/* IMG */
.imgpick{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap}
.imgprev{
  width:150px;height:110px;flex:0 0 150px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--bg) center/cover no-repeat;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:11px;font-style:italic;
}
.imgbtns{display:flex;flex-direction:column;gap:6px}

/* TARJETAS */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(0,0,0,.08)),var(--paper);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:.15s;
  box-shadow:0 2px 0 #00000055;
}
.card:hover{border-color:var(--gold-soft);transform:translateY(-2px)}
.projcover{height:120px;background:var(--bg) center/cover no-repeat;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--line);font-size:30px}
.projbody{padding:12px 14px}
.projbody h3{font-size:16px;margin-bottom:5px;color:var(--gold)}
.projbody p{margin:0;font-size:12.5px;color:var(--ink-dim);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cardactions{display:flex;gap:6px;padding:0 14px 14px;flex-wrap:wrap}

.tree-row{
  display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:4px;cursor:pointer;
  font-size:13.5px;color:var(--ink-dim);transition:.12s;border:1px solid transparent;
}
.tree-row:hover{background:var(--paper2);color:var(--ink)}
.tree-row.active{background:linear-gradient(90deg,#33281a,#1f1913);color:var(--gold);border-color:var(--gold-soft)}
.tree-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mapbox{
  position:relative;width:100%;min-height:340px;border:1px solid var(--line);border-radius:var(--radius);
  background:#0d0a07 center/contain no-repeat;overflow:hidden;cursor:crosshair;
}
.pin{
  position:absolute;transform:translate(-50%,-100%);cursor:grab;
  background:linear-gradient(#6b5715,#4a3d10);border:1px solid var(--gold);color:#f5e9c8;
  font-size:11px;padding:2px 7px;border-radius:10px;white-space:nowrap;user-select:none;
  box-shadow:0 2px 6px #000a;z-index:3;
}
.pin:before{content:'▼';position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);color:var(--gold);font-size:9px}
.pinlist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.pinrow{display:flex;gap:8px;align-items:center;background:var(--bg2);padding:6px 8px;border-radius:4px;border:1px solid var(--line);flex-wrap:wrap}
.pinrow input{flex:1;min-width:80px}
.pinrow select{flex:1;min-width:100px}

/* Canvas (redes + genealogía) */
.nc-wrap{ position:relative; }
.nc-toolbar{
  position:absolute; top:10px; right:10px; z-index:6; display:flex; gap:4px; align-items:center;
  background:linear-gradient(var(--paper2),var(--bg2)); border:1px solid var(--line2); border-radius:7px;
  padding:5px 6px; box-shadow:0 4px 14px #000a; flex-wrap:wrap; max-width:calc(100% - 20px);
}
.nc-toolbar button{ min-width:0 }
.nc-zoomval{
  font-size:11.5px;color:var(--gold);min-width:40px;text-align:center;
  font-variant-numeric:tabular-nums;user-select:none;
}
.nc-viewport{
  position:relative;width:100%;height:min(64vh,640px);min-height:340px;overflow:hidden;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);
  background-image:radial-gradient(var(--paper2) 1.4px, transparent 1.4px);
  background-size:24px 24px; touch-action:none; cursor:grab;
  -webkit-user-select:none;user-select:none;
}
.nc-viewport.panning{ cursor:grabbing; }
.nc-world{ position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }
.netsvg{ position:absolute; left:0; top:0; width:1px; height:1px; overflow:visible; pointer-events:none; }
.node{
  position:absolute;transform:translate(-50%,-50%);
  background:linear-gradient(var(--paper2),#1b1610);border:1px solid var(--line2);color:var(--ink);
  padding:8px 12px;border-radius:6px;font-size:13px;cursor:grab;user-select:none;touch-action:none;
  box-shadow:0 3px 10px #000a;max-width:150px;text-align:center;z-index:2;transition:border-color .15s, opacity .2s;
}
.node:hover{border-color:var(--gold)}
.node .nimg{width:38px;height:38px;border-radius:50%;background:var(--bg) center/cover;margin:0 auto 5px;border:1px solid var(--line2)}
.nodename{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.relrow{display:flex;gap:8px;align-items:center;background:var(--bg2);padding:7px 10px;border-radius:4px;border:1px solid var(--line);margin-bottom:6px;flex-wrap:wrap}
.relrow .rel-txt{flex:1;font-size:13.5px;min-width:120px}
.relrow .rel-txt b{color:var(--gold)}

/* CHIPS / LINKS / GENRES */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--paper2);border:1px solid var(--line2);
  border-radius:14px;padding:3px 6px 3px 10px;font-size:12.5px;color:var(--ink-dim);
}
.chip:hover{border-color:var(--gold-soft);color:var(--ink)}
.chip .x{cursor:pointer;color:var(--red);font-weight:bold;padding:0 4px;border-radius:50%}
.chip .x:hover{background:#3a1d19}
.chip.chip-add{cursor:pointer;color:var(--gold);border-style:dashed}
.chip.chip-add:hover{background:var(--paper2)}

/* MODAL */
.modal-back{
  position:fixed;inset:0;background:#000000bb;backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:200;padding:20px;
}
.modal-back.show{display:flex}
.modal{
  background:linear-gradient(180deg,var(--paper2),var(--bg2));border:1px solid var(--line2);
  border-radius:8px;padding:22px 24px;max-width:520px;width:100%;max-height:85vh;overflow:auto;
  box-shadow:0 20px 60px #000c;
}
.modal h3{color:var(--gold);margin-bottom:12px;font-size:18px}
.modal p{margin:0 0 14px;color:var(--ink-dim);line-height:1.6}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.picklist{max-height:280px;overflow:auto;margin-top:8px}
.pickitem{padding:8px 12px;border-radius:4px;cursor:pointer;font-size:14px;color:var(--ink-dim);display:flex;gap:8px;align-items:center}
.pickitem:hover{background:var(--paper2);color:var(--ink)}

/* TOAST */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,80px);
  background:linear-gradient(var(--line),var(--paper2));border:1px solid var(--gold-soft);color:var(--ink);
  padding:10px 20px;border-radius:20px;font-size:13.5px;opacity:0;transition:.3s;z-index:300;
  box-shadow:0 8px 24px #000a;pointer-events:none;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:14px}
.stat{
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:center;
  cursor:pointer;transition:.12s;
}
.stat:hover{border-color:var(--gold-soft);background:var(--paper2);transform:translateY(-2px)}
.stat b{display:block;font-size:24px;color:var(--gold)}
.stat span{font-size:11.5px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}

.tl{position:relative;padding-left:34px;margin-top:10px}
.tl:before{content:'';position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--gold-soft),var(--paper2))}
.tl-item{position:relative;margin-bottom:14px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.tl-item:before{
  content:'';position:absolute;left:-29px;top:18px;width:11px;height:11px;border-radius:50%;
  background:var(--gold);border:2px solid var(--bg);box-shadow:0 0 0 2px var(--line);
}

/* ============================================================
   3.1 MIGRACIÓN
============================================================ */
function migrateProject(p){
  if(!p || typeof p !== 'object') return;
  if(!p.story) p.story = {};
  if(!Array.isArray(p.characters)) p.characters = [];
  if(!Array.isArray(p.world)) p.world = [];
  if(!Array.isArray(p.notes)) p.notes = [];
  if(!Array.isArray(p.charFolders)) p.charFolders = [];
  if(!Array.isArray(p.noteFolders)) p.noteFolders = [];
  if(!Array.isArray(p.genres)) p.genres = [];
  if(!Array.isArray(p.subgenres)) p.subgenres = [];

  // ---- story.acts (antes chapterFolders como strings) ----
  if(!Array.isArray(p.story.acts)) p.story.acts = [];
  if(Array.isArray(p.story.chapterFolders) && p.story.chapterFolders.length){
    p.story.chapterFolders.forEach(name => {
      p.story.acts.push({ id: uid(), name, description:'', start:'', end:'' });
    });
  }
  // Migrar chapter.folder → chapter.actId
  if(!Array.isArray(p.story.chapters)) p.story.chapters = [];
  p.story.chapters.forEach(c => {
    if(typeof c.actId === 'undefined') c.actId = '';
    if(c.folder){
      const act = p.story.acts.find(a => a.name === c.folder);
      if(act) c.actId = act.id;
      delete c.folder;
    }
    if(!Array.isArray(c.characterIds)) c.characterIds = [];
    if(!Array.isArray(c.eventIds)) c.eventIds = [];
    if(typeof c.start !== 'string') c.start = '';
    if(typeof c.end !== 'string') c.end = '';
  });
  delete p.story.chapterFolders;

  // ---- story.events ----
  if(!Array.isArray(p.story.events)) p.story.events = [];
  p.story.events.forEach(e => {
    if(typeof e.type !== 'string') e.type = '';
    if(typeof e.image !== 'string') e.image = '';
    if(typeof e.start !== 'string') e.start = '';
    if(typeof e.end !== 'string') e.end = '';
    if(!Array.isArray(e.characterIds)) e.characterIds = [];
  });

  // ---- story.timelines ----
  if(!Array.isArray(p.story.timelines)) p.story.timelines = [];
  if(Array.isArray(p.story.timeline) && p.story.timeline.length && !p.story.timelines.length){
    p.story.timelines.push({
      id: uid(), name:'Cronología principal', description:'',
      hitos: p.story.timeline, view:{ mode:'vertical', zoom:1 },
      calendar: { yearLabel:'Año', months: [], daysPerMonth: 30, startYear: 1 }
    });
  }
  delete p.story.timeline;
  p.story.timelines.forEach(t => {
    if(!Array.isArray(t.hitos)) t.hitos = [];
    if(!t.view) t.view = { mode:'vertical', zoom:1 };
    if(typeof t.description !== 'string') t.description = '';
    if(!t.calendar) t.calendar = {};
    const cal = t.calendar;
    if(typeof cal.yearLabel !== 'string') cal.yearLabel = 'Año';
    if(!Array.isArray(cal.months)) cal.months = [];
    if(typeof cal.daysPerMonth !== 'number' || cal.daysPerMonth < 1) cal.daysPerMonth = 30;
    if(!Array.isArray(cal.weekdays) || !cal.weekdays.length) cal.weekdays = ['L','M','X','J','V','S','D'];
    if(typeof cal.currentYear !== 'number') cal.currentYear = 1;
    // Migrar months de string[] a [{name, days}]
    cal.months = cal.months.map(m => {
      if(typeof m === 'string') return { name: m, days: cal.daysPerMonth || 30 };
      if(!m || typeof m !== 'object') return { name: '', days: cal.daysPerMonth || 30 };
      if(typeof m.name !== 'string') m.name = '';
      if(typeof m.days !== 'number' || m.days < 1) m.days = cal.daysPerMonth || 30;
      return m;
    });
    // Migrar hitos: añadir campos calendario
    t.hitos.forEach(h => {
      if(h.calStart === undefined) h.calStart = null;
      if(h.calEnd === undefined) h.calEnd = null;
      if(!h.calColor) h.calColor = '#c9a227';
    });
  });

  if(!p.story.timelines.length){
    p.story.timelines.push({
      id: uid(), name:'Cronología principal', description:'',
      hitos: [], view:{ mode:'vertical', zoom:1 },
      calendar: { yearLabel:'Año', months: [], daysPerMonth: 30, startYear: 1 }
    });
  }

  // ---- story.ideas ----
  if(!Array.isArray(p.story.ideas)) p.story.ideas = [];
  if(!Array.isArray(p.story.ideaFolders)) p.story.ideaFolders = [];
  p.story.ideas.forEach(i => {
    if(typeof i.type !== 'string') i.type = '';
    if(typeof i.folder !== 'string') i.folder = '';
  });

  // ---- charnets ----
  const hadOldCharnet = p.charnetView !== undefined || Array.isArray(p.relations);
  const hadOldPositions = p.characters.some(c => c && typeof c.nx === 'number' && typeof c.ny === 'number');
  if(!Array.isArray(p.charnets)) p.charnets = [];
  if(!p.charnets.length && (hadOldCharnet || hadOldPositions)){
    const net = {
      id: uid(), name:'Red principal',
      members: p.characters.map(c=>c.id).filter(Boolean),
      relations: Array.isArray(p.relations) ? p.relations.map(r=>({ ...r, mutual: r.mutual !== false })) : [],
      positions: {},
      view: p.charnetView ? { ...p.charnetView } : { x:0, y:0, zoom:1, fitted:false }
    };
    p.characters.forEach(c => {
      if(c && typeof c.nx === 'number' && typeof c.ny === 'number'){
        net.positions[c.id] = { x: c.nx, y: c.ny };
        delete c.nx; delete c.ny;
      }
    });
    p.charnets.push(net);
  }
  delete p.relations;
  delete p.charnetView;
  p.charnets.forEach(net => {
    if(!net) return;
    if(!Array.isArray(net.members)) net.members = [];
    if(!Array.isArray(net.relations)) net.relations = [];
    if(!net.positions || typeof net.positions !== 'object') net.positions = {};
    if(!net.view) net.view = { x:0, y:0, zoom:1, fitted:false };
    const validIds = new Set(p.characters.map(c => c.id));
    net.members = net.members.filter(id => validIds.has(id));
    net.relations = net.relations.filter(r => r && validIds.has(r.a) && validIds.has(r.b) && r.a !== r.b);
    net.relations.forEach(r => { if(typeof r.mutual !== 'boolean') r.mutual = true; });
  });

  // ---- Genealogías ----
  if(!Array.isArray(p.genealogies)) p.genealogies = [];

  // ---- Height groups ----
  if(!Array.isArray(p.heightGroups)) p.heightGroups = [];

  // ---- Bestiary ----
  if(!Array.isArray(p.bestiary)) p.bestiary = [];
  if(!Array.isArray(p.bestiaryFolders)) p.bestiaryFolders = [];
  p.bestiary.forEach(b => {
    if(!Array.isArray(b.fields)) b.fields = [];
    if(!Array.isArray(b.sections)) b.sections = [];
    if(!Array.isArray(b.stats)) b.stats = [];
    if(typeof b.folder !== 'string') b.folder = '';
    if(typeof b.species !== 'string') b.species = '';
    if(typeof b.personality !== 'string') b.personality = '';
    if(typeof b.danger !== 'string') b.danger = '';
  });

  // ---- Razas ----
  if(!Array.isArray(p.races)) p.races = [];
  if(!Array.isArray(p.raceFolders)) p.raceFolders = [];
  p.races.forEach(r => {
    if(!Array.isArray(r.fields)) r.fields = [];
    if(!Array.isArray(r.sections)) r.sections = [];
    if(!Array.isArray(r.stats)) r.stats = [];
    if(typeof r.folder !== 'string') r.folder = '';
    if(typeof r.classification !== 'string') r.classification = '';
    if(typeof r.lifespan !== 'string') r.lifespan = '';
  });

  // ---- Lore ----
  if(!Array.isArray(p.lore)) p.lore = [];
  if(!Array.isArray(p.loreFolders)) p.loreFolders = [];
  p.lore.forEach(l => {
    if(!Array.isArray(l.fields)) l.fields = [];
    if(!Array.isArray(l.sections)) l.sections = [];
    if(typeof l.folder !== 'string') l.folder = '';
    if(typeof l.type !== 'string') l.type = '';
  });

  // ---- Personajes: campos nuevos + migrar gustos/disgustos/extra → sections ----
  p.characters.forEach(c => {
    if(!c) return;
    if(!Array.isArray(c.stats)) c.stats = [];
    if(typeof c.nickname !== 'string') c.nickname = '';
    if(typeof c.age !== 'string') c.age = '';
    if(typeof c.gender !== 'string') c.gender = '';
    if(typeof c.height !== 'string') c.height = '';
    if(typeof c.weight !== 'string') c.weight = '';
    if(typeof c.roll !== 'string') c.roll = '';
    if(typeof c.storyRole !== 'string') c.storyRole = '';
    if(typeof c.extra !== 'string') c.extra = '';
    if(!Array.isArray(c.fields)) c.fields = [];
    if(!Array.isArray(c.sections)) c.sections = [];
    if(!Array.isArray(c.timeline)) c.timeline = [];
    if(typeof c.history !== 'string') c.history = '';
    if(typeof c.keyEvents !== 'string') c.keyEvents = '';
    if(typeof c.likes !== 'string') c.likes = '';
    if(typeof c.dislikes !== 'string') c.dislikes = '';
    if(typeof c.folder !== 'string') c.folder = '';
    if(!Array.isArray(c.tags)) c.tags = [];

    // Migrar antiguos fijos a secciones dinámicas (solo la primera vez)
    if(!c.sections.length){
      if(c.likes && String(c.likes).trim()){
        const s = newSection('half'); s.title = 'Gustos'; s.content = c.likes; c.sections.push(s);
      }
      if(c.dislikes && String(c.dislikes).trim()){
        const s = newSection('half'); s.title = 'Disgustos'; s.content = c.dislikes; c.sections.push(s);
      }
      if(c.extra && String(c.extra).trim()){
        const s = newSection('full'); s.title = 'Extras / Otros datos'; s.content = c.extra; c.sections.push(s);
      }
    }
    delete c.likes; delete c.dislikes; delete c.extra;
  });

  // Settings
  if(!p.settings) p.settings = { theme:'codex', accent:'#c9a227', bodyFont:'', hiddenSections: [] };
  if(!p.settings.theme) p.settings.theme = 'codex';
  if(!Array.isArray(p.settings.hiddenSections)) p.settings.hiddenSections = [];

  // Zonas: characterIds
  (function walkZones(arr){
    (arr||[]).forEach(z => {
      if(!Array.isArray(z.characterIds)) z.characterIds = [];
      walkZones(z.children);
    });
  })(p.world);
}

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 2300);
}
function openModal(html, onMount){
  const back = $('#modalBack'), m = $('#modal');
  m.innerHTML = html; back.classList.add('show');
  if(onMount) onMount(m);
  const f = m.querySelector('[autofocus]'); if(f) setTimeout(()=>f.focus(),50);
  return m;
}
function closeModal(){ $('#modalBack').classList.remove('show'); $('#modal').innerHTML=''; }
$('#modalBack').addEventListener('mousedown', e => { if(e.target.id==='modalBack') closeModal(); });

function confirmar(msg, btnTxt){
  return new Promise(res=>{
    openModal(`<h3>⚠ Confirmar</h3><p>${esc(msg)}</p>
      <div class="modal-actions">
        <button class="btn" data-no>Cancelar</button>
        <button class="btn danger" data-yes>${esc(btnTxt||'Sí, borrar')}</button>
      </div>`,
      m=>{
        m.querySelector('[data-no]').onclick  = ()=>{ closeModal(); res(false); };
        m.querySelector('[data-yes]').onclick = ()=>{ closeModal(); res(true);  };
      });
  });
}
function pedir(titulo, campos){
  return new Promise(res=>{
    const body = campos.map(c=>`
      <label class="field"><span>${esc(c.label)}</span>
      <input data-k="${esc(c.key)}" value="${esc(c.value||'')}" placeholder="${esc(c.ph||'')}" ${c.autofocus?'autofocus':''}></label>`).join('');
    openModal(`<h3>${esc(titulo)}</h3>${body}
      <div class="modal-actions">
        <button class="btn" data-no>Cancelar</button>
        <button class="btn primary" data-yes>Aceptar</button>
      </div>`,
      m=>{
        const done = ()=>{
          const o = {};
          campos.forEach(c => { o[c.key] = ''; });
          $$('[data-k]', m).forEach(i => {
            const k = i.dataset.k;
            if(k) o[k] = i.value != null ? String(i.value) : '';
          });
          closeModal();
          res(o);
        };
        m.querySelector('[data-no]').onclick = ()=>{ closeModal(); res(null); };
        m.querySelector('[data-yes]').onclick = done;
        m.addEventListener('keydown', e=>{
          if(e.key==='Enter' && e.target.tagName==='INPUT') done();
        });
      });
  });
}

function saveRange(area){
  const s = window.getSelection();
  if(s.rangeCount){
    const r = s.getRangeAt(0);
    if(area.contains(r.commonAncestorContainer)) savedRange = r.cloneRange();
  }
}
function restoreRange(area){
  if(savedRange){
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(savedRange);
  }
  area.focus();
}

  $$('button[data-cmd]', bar).forEach(b=>{
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', ()=>{
      area.focus();
      document.execCommand(b.dataset.cmd, false, null);
      saveRange(area); fire();
    });
  });

  const selBlock = bar.querySelector('[data-block]');
  selBlock.addEventListener('change', ()=>{ restoreRange(area); document.execCommand('formatBlock', false, selBlock.value); fire(); });

  const selSize = bar.querySelector('[data-size]');
  selSize.addEventListener('change', ()=>{
    if(!selSize.value) return;
    restoreRange(area);
    document.execCommand('fontSize', false, selSize.value);
    fire(); selSize.value = '';
  });

  const cColor = bar.querySelector('[data-color]');
  cColor.addEventListener('change', ()=>{
    restoreRange(area);
    document.execCommand('styleWithCSS', false, true);
    document.execCommand('foreColor', false, cColor.value);
    fire();
  });
  const cHilite = bar.querySelector('[data-hilite]');
  cHilite.addEventListener('change', ()=>{
    restoreRange(area);
    document.execCommand('styleWithCSS', false, true);
    document.execCommand('hiliteColor', false, cHilite.value);
    fire();
  });

  function insertHTML(html){
    restoreRange(area);
    document.execCommand('insertHTML', false, html);
    fire();
  }

  bar.querySelector('[data-img]').addEventListener('click', ()=>{
    saveRange(area);
    const inp = document.createElement('input');
    inp.type='file'; inp.accept='image/*';
    inp.onchange = ()=>{
      const f = inp.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ()=> insertHTML(`<img src="${r.result}"><p><br></p>`);
      r.readAsDataURL(f);
    };
    openModal(`<h3>🖼 Insertar imagen</h3>
      <label class="field"><span>URL de imagen</span><input data-u placeholder="https://..." autofocus></label>
      <div class="modal-actions">
        <button class="btn" data-file>📁 Subir archivo</button>
        <button class="btn primary" data-ok>Insertar URL</button>
        <button class="btn" data-cancel>Cancelar</button>
      </div>`,
      m=>{
        m.querySelector('[data-file]').onclick = ()=>{ closeModal(); inp.click(); };
        m.querySelector('[data-cancel]').onclick = closeModal;
        m.querySelector('[data-ok]').onclick = ()=>{
          const u = m.querySelector('[data-u]').value.trim();
          closeModal();
          if(u) insertHTML(`<img src="${esc(u)}"><p><br></p>`);
        };
      });
  });

  bar.querySelector('[data-table]').addEventListener('click', ()=>{
    saveRange(area);
    pedir('▦ Insertar tabla', [
      {key:'rows', label:'Filas', value:'3'},
      {key:'cols', label:'Columnas', value:'3'}
    ]).then(v=>{
      if(!v) return;
      const r = Math.max(1, Math.min(30, parseInt(v.rows)||3));
      const c = Math.max(1, Math.min(15, parseInt(v.cols)||3));
      let html = '<table>';
      for(let i=0;i<r;i++){
        html += '<tr>';
        for(let j=0;j<c;j++) html += (i===0 ? '<th>&nbsp;</th>' : '<td>&nbsp;</td>');
        html += '</tr>';
      }
      html += '</table><p><br></p>';
      insertHTML(html);
    });
  });

  bar.querySelector('[data-url]').addEventListener('click', ()=>{
    saveRange(area);
    pedir('🔗 Insertar enlace', [
      {key:'url', label:'URL', value:'https://'},
      {key:'txt', label:'Texto (opcional)', value:''}
    ]).then(v=>{
      if(!v || !v.url) return;
      if(v.txt) insertHTML(`<a href="${esc(v.url)}" target="_blank">${esc(v.txt)}</a>`);
      else insertHTML(`<a href="${esc(v.url)}" target="_blank">${esc(v.url)}</a>`);
    });
  });

  bar.querySelector('[data-internal]').addEventListener('click', ()=>{
    saveRange(area);
    const ents = indexEntities();
    openModal(`<h3>🔗✦ Enlazar a algo del proyecto</h3>
      <label class="field"><span>Buscar</span><input data-q placeholder="Filtra por nombre..." autofocus></label>
      <div class="picklist" data-list></div>
      <div class="modal-actions"><button class="btn" data-cancel>Cerrar</button></div>`,
      m=>{
        const list = m.querySelector('[data-list]');
        const draw = (q='')=>{
          list.innerHTML = '';
          const f = ents.filter(e => (e.name||'').toLowerCase().includes(q.toLowerCase()));
          if(!f.length) list.innerHTML = '<div class="empty">Sin resultados</div>';
          f.forEach(e=>{
            const it = make(`<div class="pickitem">${esc(ICON[e.type]||'•')} <span>${esc(e.name)}</span>
              <small style="color:var(--muted);margin-left:auto">${esc(LABEL[e.type]||'')}</small></div>`);
            it.onclick = ()=>{ closeModal(); insertHTML(`<a data-internal="${e.id}" title="Ir a ${esc(e.name)}">${esc(e.name)}</a>&nbsp;`); };
            list.appendChild(it);
          });
        };
        draw();
        m.querySelector('[data-q]').addEventListener('input', e => draw(e.target.value));
        m.querySelector('[data-cancel]').onclick = closeModal;
      });
  });

  bar.querySelector('[data-bgblock]').addEventListener('click', ()=>{
    saveRange(area);
    pedir('🎨 Color de fondo del bloque', [{key:'c', label:'Color (hex)', value:'#241d16'}]).then(v=>{
      if(!v || !v.c) return;
      restoreRange(area);
      const s = window.getSelection();
      if(!s.rangeCount) return;
      let node = s.anchorNode;
      while(node && node.parentNode && node.parentNode !== area) node = node.parentNode;
      if(node && node !== area && node.style) node.style.backgroundColor = v.c;
      else area.style.backgroundColor = v.c;
      fire();
    });
  });

  area.addEventListener('click', e=>{
    const a = e.target.closest('[data-internal]');
    if(a){ e.preventDefault(); goTo(a.dataset.internal); }
    const ext = e.target.closest('a[href]');
    if(ext && !ext.dataset.internal && e.ctrlKey){ window.open(ext.href,'_blank'); }
  });
  area.addEventListener('keyup', ()=> saveRange(area));
  area.addEventListener('mouseup', ()=> saveRange(area));
  area.addEventListener('input', ()=> fire());
  area.addEventListener('paste', e=>{
    const items = e.clipboardData && e.clipboardData.items;
    if(items){
      for(const it of items){
        if(it.type.indexOf('image') === 0){
          e.preventDefault();
          const f = it.getAsFile();
          const r = new FileReader();
          r.onload = ()=> insertHTML(`<img src="${r.result}"><p><br></p>`);
          r.readAsDataURL(f);
          return;
        }
      }
    }
  });

  return wrap;
}

const ICON = {
  chapter:'📜', act:'🎬', event:'⚡', timeline:'🧭', hito:'⏳', idea:'💡',
  character:'🧝', zone:'🌍', note:'📝',
  genealogy:'🌳', bestiary:'🐉', race:'🧬', lore:'📚',
  heightGroup:'📏', charnet:'🕸'
};
const LABEL = {
  chapter:'Capítulo', act:'Acto', event:'Evento', timeline:'Cronología', hito:'Hito',
  idea:'Idea', character:'Personaje', zone:'Zona', note:'Nota',
  genealogy:'Genealogía', bestiary:'Bestia', race:'Raza', lore:'Lore',
  heightGroup:'Alturas', charnet:'Red'
};

function indexEntities(){
  const list = [];
  if(!P) return list;
  (P.story.acts||[]).forEach(a => list.push({id:a.id, type:'act', name:a.name||'Acto sin título'}));
  (P.story.chapters||[]).forEach(c=>list.push({id:c.id, type:'chapter', name:c.title||'Capítulo sin título'}));
  (P.story.events||[]).forEach(e=>list.push({id:e.id, type:'event', name:e.title||'Evento sin título'}));
  (P.story.ideas||[]).forEach(i=>list.push({id:i.id, type:'idea', name:i.title||'Idea sin título'}));
  (P.story.timelines||[]).forEach(tl=>{
    list.push({id:tl.id, type:'timeline', name:tl.name||'Cronología sin nombre'});
    (tl.hitos||[]).forEach(h=>{
      list.push({id:h.id, type:'hito', name:h.title||'Hito sin título', parentTimeline: tl.id});
    });
  });
  (P.characters||[]).forEach(c=>list.push({id:c.id, type:'character', name:c.name||'Personaje sin nombre'}));
  (P.notes||[]).forEach(n=>list.push({id:n.id, type:'note', name:n.title||'Nota sin título'}));
  (P.bestiary||[]).forEach(b=>list.push({id:b.id, type:'bestiary', name:b.name||'Bestia sin nombre'}));
  (P.races||[]).forEach(r=>list.push({id:r.id, type:'race', name:r.name||'Raza sin nombre'}));
  (P.lore||[]).forEach(l=>list.push({id:l.id, type:'lore', name:l.name||'Lore sin nombre'}));
  (P.genealogies||[]).forEach(g=>list.push({id:g.id, type:'genealogy', name:g.name||'Genealogía sin nombre'}));
  (P.heightGroups||[]).forEach(h=>list.push({id:h.id, type:'heightGroup', name:h.name||'Grupo sin nombre'}));
  (function walk(arr){ (arr||[]).forEach(z=>{ list.push({id:z.id, type:'zone', name:z.name||'Zona sin nombre'}); walk(z.children); }); })(P.world);
  return list;
}

function goTo(id){
  const e = indexEntities().find(x=>x.id===id);
  if(!e){ toast('No se encontró el enlace'); return; }
  if(e.type==='character'){ view='characters'; sel.characters = id; }
  else if(e.type==='chapter'){ view='chapters'; sel.chapters = id; }
  else if(e.type==='act'){ view='chapters'; sel.acts = id; }
  else if(e.type==='event'){ view='events'; sel.events = id; }
  else if(e.type==='idea'){ view='ideas'; sel.ideas = id; }
  else if(e.type==='note'){ view='notes'; sel.notes = id; }
  else if(e.type==='zone'){ view='world'; worldSel = id; ui.worldOpen[id] = true; }
  else if(e.type==='timeline'){ view='timeline'; ui.timeline.sel = id; }
  else if(e.type==='hito'){
    view='timeline';
    ui.timeline.sel = e.parentTimeline;
    ui.timeline.highlight = id;
  }
  else if(e.type==='bestiary'){ view='bestiary'; sel.bestiary = id; }
  else if(e.type==='race'){ view='races'; sel.races = id; }
  else if(e.type==='lore'){ view='lore'; sel.lore = id; }
  else if(e.type==='genealogy'){ view='genealogy'; ui.genealogy.sel = id; }
  else if(e.type==='heightGroup'){ view='heights'; ui.heights.sel = id; }
  render();
  window.scrollTo(0,0);
  $('#main').scrollTop = 0;
}

let cmdkActiveIdx = -1;
let cmdkResults = [];
function openCmdk(){
  if(!P){ toast('Abre un proyecto primero'); return; }
  closeSidebarMobile();
  $('#cmdkBack').classList.add('show');
  const input = $('#cmdkInput');
  input.value = '';
  renderCmdk('');
  setTimeout(()=>input.focus(), 30);
}
function closeCmdk(){ $('#cmdkBack').classList.remove('show'); }
function renderCmdk(q){
  const list = $('#cmdkList');
  const all = indexEntities();
  const qq = q.trim().toLowerCase();
  cmdkResults = (qq ? all.filter(e=>e.name.toLowerCase().includes(qq)) : all).slice(0,60);
  cmdkActiveIdx = cmdkResults.length ? 0 : -1;
  list.innerHTML = '';
  if(!cmdkResults.length){
    list.innerHTML = `<div class="empty">${qq ? 'Sin resultados.' : 'Escribe para buscar en todo el proyecto.'}</div>`;
    return;
  }
  cmdkResults.forEach((e,i)=>{
    const row = make(`<div class="cmdk-item ${i===0?'active':''}">
      <span class="ci-icon">${ICON[e.type]||'•'}</span>
      <span class="ci-name">${esc(e.name)}</span>
      <span class="ci-type">${esc(LABEL[e.type]||'')}</span>
    </div>`);
    row.onclick = ()=>{ closeCmdk(); goTo(e.id); };
    list.appendChild(row);
  });
}
function cmdkMove(dir){
  if(!cmdkResults.length) return;
  cmdkActiveIdx = (cmdkActiveIdx + dir + cmdkResults.length) % cmdkResults.length;
  $$('.cmdk-item', $('#cmdkList')).forEach((el,i)=> el.classList.toggle('active', i===cmdkActiveIdx));
  const active = $('.cmdk-item.active', $('#cmdkList'));
  if(active) active.scrollIntoView({block:'nearest'});
}
function cmdkOpenActive(){
  if(cmdkActiveIdx>=0 && cmdkResults[cmdkActiveIdx]){
    const e = cmdkResults[cmdkActiveIdx];
    closeCmdk(); goTo(e.id);
  }
}
$('#cmdkInput').addEventListener('input', e=>renderCmdk(e.target.value));
$('#cmdkInput').addEventListener('keydown', e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); cmdkMove(1); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); cmdkMove(-1); }
  else if(e.key==='Enter'){ e.preventDefault(); cmdkOpenActive(); }
});
$('#cmdkBack').addEventListener('mousedown', e=>{ if(e.target.id==='cmdkBack') closeCmdk(); });
$('#btnSearch').onclick = openCmdk;

function fieldInput(label, value, onInput, ph){

  w.querySelector('input').addEventListener('input', e => onInput(e.target.value));

function selectInput(label, value, options, onSelect, customLabel){
  const w = make(`<label class="field"><span>${esc(label)}</span><select></select></label>`);
  const s = w.querySelector('select');
  const oNone = document.createElement('option'); oNone.value=''; oNone.textContent='— Sin definir —'; s.appendChild(oNone);
  options.forEach(o=>{ const op = document.createElement('option'); op.value = o; op.textContent = o; s.appendChild(op); });
  const oCustom = document.createElement('option'); oCustom.value = '__custom__'; oCustom.textContent = customLabel||'+ Otro…'; s.appendChild(oCustom);
  s.value = value || '';
  if(value && !options.includes(value)){ s.value = value; /* custom stored */ 
    // Reemplazar el option "custom" por el valor para que se vea
    oCustom.value = value; oCustom.textContent = value;
  }
  s.onchange = ()=>{
    if(s.value === '__custom__' || s.value === value && !options.includes(value)){
      // ya es un custom
    }
    if(s.value === '__custom__'){
      pedir('Otro valor', [{key:'v', label:'Escribe el valor', value:''}]).then(r=>{
        if(r && r.v.trim()){ onSelect(r.v.trim()); }
      });
      return;
    }
    onSelect(s.value);
  };
  return w;
}

function applySort(arr, mode, keyFn){
  const a = arr.slice();
  if(mode === 'name-asc') a.sort((x,y)=> (keyFn(x)||'').localeCompare(keyFn(y)||'','es',{sensitivity:'base'}));
  else if(mode === 'name-desc') a.sort((x,y)=> (keyFn(y)||'').localeCompare(keyFn(x)||'','es',{sensitivity:'base'}));
  return a;
}
function applyFilter(arr, q, keyFns){
  if(!q) return arr.slice();
  const s = q.toLowerCase();
  return arr.filter(x => keyFns.some(fn => (fn(x)||'').toLowerCase().includes(s)));
}

/* ============================================================
   LIGHTBOX (imágenes a pantalla completa)
============================================================ */
const Lightbox = { scale:1, x:0, y:0, natW:1, natH:1, dragging:false };
function openLightbox(src){
  const back = $('#lightboxBack'), img = $('#lightboxImg');
  if(!back || !img) return;
  back.classList.add('show');
  img.src = src;
  Lightbox.scale = 1; Lightbox.x = 0; Lightbox.y = 0;
  const fit = ()=>{
    const vw = window.innerWidth, vh = window.innerHeight;
    const scale = Math.min(vw / Lightbox.natW, vh / Lightbox.natH, 1);
    Lightbox.scale = scale;
    Lightbox.x = (vw - Lightbox.natW * scale) / 2;
    Lightbox.y = (vh - Lightbox.natH * scale) / 2;
    applyLightbox();
  };
  img.onload = ()=>{
    Lightbox.natW = img.naturalWidth || img.width;
    Lightbox.natH = img.naturalHeight || img.height;
    fit();
  };
  if(img.complete && img.naturalWidth){ Lightbox.natW = img.naturalWidth; Lightbox.natH = img.naturalHeight; fit(); }
}
function closeLightbox(){
  $('#lightboxBack').classList.remove('show');
  $('#lightboxImg').src = '';
}
function applyLightbox(){
  const img = $('#lightboxImg');
  if(!img) return;
  img.style.transform = `translate(${Lightbox.x}px, ${Lightbox.y}px) scale(${Lightbox.scale})`;
  const v = $('#lightboxZoomVal');
  if(v) v.textContent = Math.round(Lightbox.scale*100) + '%';
}
(function initLightbox(){
  const back = $('#lightboxBack'); if(!back) return;
  const img  = $('#lightboxImg');
  const close = $('#lightboxClose');
  const zin   = $('#lightboxZoomIn');
  const zout  = $('#lightboxZoomOut');
  const zrst  = $('#lightboxReset');
  const pointers = new Map();
  let panStart = null, pinchStart = null;
  function zoomAround(mx, my, factor){
    const nz = Math.max(0.1, Math.min(10, Lightbox.scale * factor));
    const wx = (mx - Lightbox.x) / Lightbox.scale;
    const wy = (my - Lightbox.y) / Lightbox.scale;
    Lightbox.scale = nz;
    Lightbox.x = mx - wx * nz;
    Lightbox.y = my - wy * nz;
    applyLightbox();
  }
  back.addEventListener('pointerdown', e=>{
    if(e.target.closest('.lightbox-toolbar') || e.target.closest('.lightbox-close')) return;
    back.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if(pointers.size === 1){
      panStart = { sx:e.clientX, sy:e.clientY, ox:Lightbox.x, oy:Lightbox.y };
      img.classList.add('grabbing');
    } else if(pointers.size === 2){
      panStart = null;
      const pts = [...pointers.values()];
      const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1;
      const mid = { x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2 };
      pinchStart = { startDist:dist, startScale:Lightbox.scale, startX:Lightbox.x, startY:Lightbox.y, mid };
    }
  });
  back.addEventListener('pointermove', e=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if(pointers.size === 1 && panStart){
      Lightbox.x = panStart.ox + (e.clientX - panStart.sx);
      Lightbox.y = panStart.oy + (e.clientY - panStart.sy);
      applyLightbox();
    } else if(pointers.size === 2 && pinchStart){
      const pts = [...pointers.values()];
      const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1;
      const mid = { x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2 };
      const factor = dist / pinchStart.startDist;
      const nz = Math.max(0.1, Math.min(10, pinchStart.startScale * factor));
      const wx = (pinchStart.mid.x - pinchStart.startX) / pinchStart.startScale;
      const wy = (pinchStart.mid.y - pinchStart.startY) / pinchStart.startScale;
      const shiftX = mid.x - pinchStart.mid.x, shiftY = mid.y - pinchStart.mid.y;
      Lightbox.scale = nz;
      Lightbox.x = pinchStart.mid.x - wx * nz + shiftX;
      Lightbox.y = pinchStart.mid.y - wy * nz + shiftY;
      applyLightbox();
    }
  });
  function up(e){
    pointers.delete(e.pointerId);
    if(pointers.size === 0){ panStart = null; pinchStart = null; img.classList.remove('grabbing'); }
  }
  back.addEventListener('pointerup', up);
  back.addEventListener('pointercancel', up);
  back.addEventListener('wheel', e=>{
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.002);
    zoomAround(e.clientX, e.clientY, factor);
  }, { passive:false });
  close.onclick = closeLightbox;
  back.addEventListener('dblclick', e=>{ if(!e.target.closest('.lightbox-toolbar')) closeLightbox(); });
  zin.onclick  = ()=> zoomAround(window.innerWidth/2, window.innerHeight/2, 1.25);
  zout.onclick = ()=> zoomAround(window.innerWidth/2, window.innerHeight/2, 1/1.25);
  zrst.onclick = ()=>{ openLightbox(img.src); };

  /* Doble clic en cualquier imagen del documento */
  document.addEventListener('dblclick', e=>{
    const imgEl = e.target.closest('img');
    if(imgEl && imgEl.src && !imgEl.closest('.lightbox-back') && !imgEl.closest('.editor-area [data-nozoom]')){
      e.preventDefault();
      openLightbox(imgEl.src);
      return;
    }
    const bgEl = e.target.closest('.imgprev, .li-thumb, .projcover, .node .nimg, .height-chart, .cal-month-wrap');
    if(bgEl){
      const bg = getComputedStyle(bgEl).backgroundImage;
      const m = bg && bg.match(/url\(["']?([^"')]+)["']?\)/);
      if(m && m[1]){ e.preventDefault(); openLightbox(m[1]); }
    }
  });

  /* ESC cierra el lightbox y el editor a pantalla completa */
  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape' && $('#lightboxBack').classList.contains('show')){
      e.stopPropagation();
      closeLightbox();
    }
  }, true);
})();

function newStatsBlock(){

function newStatEntry(){
  return { id: uid(), label:'', value:5, max:10, color:'#c9a227' };
}
function renderStatsChart(blk){
  if(blk.type === 'spider') return renderStatsSpider(blk);
  return renderStatsBars(blk);
}
function renderStatsBars(blk){
  const wrap = make('<div class="stat-chart-bars"></div>');
  if(!blk.entries.length){ wrap.appendChild(make('<div class="stat-empty-hint">Sin estadísticas. Añade al menos una abajo.</div>')); return wrap; }
  blk.entries.forEach(e=>{
    const max = Math.max(1, parseNumber(e.max) || 10);
    const val = Math.max(0, parseNumber(e.value) || 0);
    const pct = Math.max(0, Math.min(100, (val / max) * 100));
    const row = make(`<div class="stat-bar-row">
      <span class="stat-bar-label">${esc(e.label||'?')}</span>
      <div class="stat-bar-track">
        <div class="stat-bar-fill" style="width:${pct}%;background:${esc(e.color||'#c9a227')}"></div>
      </div>
      <span class="stat-bar-value">${val}/${max}</span>
    </div>`);
    wrap.appendChild(row);
  });
  return wrap;
}
function renderStatsSpider(blk){
  const n = blk.entries.length;
  if(n < 3) return make('<div class="stat-empty-hint">Necesitas al menos 3 estadísticas para la telaraña.</div>');
  const size = 280, cx = size/2, cy = size/2, radius = 95;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
  svg.setAttribute('class', 'stat-chart-spider');
  svg.style.width = size+'px'; svg.style.height = size+'px';
  for(let r=1; r<=5; r++){
    const rr = (radius * r) / 5;
    const pts = [];
    for(let i=0;i<n;i++){
      const a = -Math.PI/2 + (i*2*Math.PI)/n;
      pts.push([cx + Math.cos(a)*rr, cy + Math.sin(a)*rr]);
    }
    const poly = document.createElementNS(ns, 'polygon');
    poly.setAttribute('points', pts.map(p=>p.join(',')).join(' '));
    poly.setAttribute('fill', 'none');
    poly.setAttribute('stroke', '#3a2f22');
    poly.setAttribute('stroke-width', '1');
    svg.appendChild(poly);
  }
  for(let i=0;i<n;i++){
    const a = -Math.PI/2 + (i*2*Math.PI)/n;
    const x = cx + Math.cos(a)*radius, y = cy + Math.sin(a)*radius;
    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', cx); line.setAttribute('y1', cy);
    line.setAttribute('x2', x); line.setAttribute('y2', y);
    line.setAttribute('stroke', '#3a2f22');
    svg.appendChild(line);
  }
  const pts = blk.entries.map((e,i)=>{
    const a = -Math.PI/2 + (i*2*Math.PI)/n;
    const max = Math.max(1, parseNumber(e.max) || 10);
    const v = Math.max(0, Math.min(1, (parseNumber(e.value) || 0) / max));
    return [cx + Math.cos(a)*radius*v, cy + Math.sin(a)*radius*v];
  });
  const poly = document.createElementNS(ns, 'polygon');
  poly.setAttribute('points', pts.map(p=>p.join(',')).join(' '));
  poly.setAttribute('fill', 'rgba(201,162,39,0.35)');
  poly.setAttribute('stroke', '#c9a227');
  poly.setAttribute('stroke-width', '2');
  svg.appendChild(poly);
  blk.entries.forEach((e,i)=>{
    const a = -Math.PI/2 + (i*2*Math.PI)/n;
    const x = cx + Math.cos(a)*(radius+20), y = cy + Math.sin(a)*(radius+20);
    const text = document.createElementNS(ns, 'text');
    text.setAttribute('x', x); text.setAttribute('y', y);
    text.setAttribute('fill', '#e9dfcc');
    text.setAttribute('font-size', '11');
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dominant-baseline', 'middle');
    text.setAttribute('font-family', 'Georgia, serif');
    text.textContent = (e.label||'?').slice(0, 14);
    svg.appendChild(text);
    const valText = document.createElementNS(ns, 'text');
    valText.setAttribute('x', x); valText.setAttribute('y', y+11);
    valText.setAttribute('fill', '#c9a227');
    valText.setAttribute('font-size', '10');
    valText.setAttribute('text-anchor', 'middle');
    valText.textContent = (parseNumber(e.value)||0) + '/' + (parseNumber(e.max)||10);
    svg.appendChild(valText);
  });
  return svg;
}
function makeStatsUI(item, onChange){
  const wrap = make('<div></div>');
  const list = make('<div class="stats-blocks"></div>');
  const toolbar = make(`<div class="sections-toolbar">
    <button class="btn small" data-add>+ Bloque de estadísticas</button>

  function draw(){
    list.innerHTML = '';
    if(!item.stats) item.stats = [];
    item.stats.forEach((blk, idx)=>{
      const div = make(`<div class="dyn-section ${blk.collapsed?'collapsed':''}">
        <div class="dyn-section-head">
          <span class="caret">${blk.collapsed?'▶':'▼'}</span>
          <input class="dyn-title" value="${esc(blk.title||'Estadísticas')}" placeholder="Título">

            <option value="bar" ${blk.type==='bar'?'selected':''}>📊 Barras</option>
            <option value="spider" ${blk.type==='spider'?'selected':''}>🕸 Telaraña</option>
          </select>
          <button class="btn small danger" data-del title="Eliminar bloque">✕</button>
        </div>
        <div class="dyn-section-body"></div>
      </div>`);
      const head = div.querySelector('.dyn-section-head');
      const body = div.querySelector('.dyn-section-body');
      head.querySelector('.caret').onclick = ()=>{ blk.collapsed = !blk.collapsed; draw(); onChange&&onChange(); };
      head.querySelector('.dyn-title').oninput = e => { blk.title = e.target.value; onChange&&onChange(); };
      head.querySelector('[data-type]').onchange = e => { blk.type = e.target.value; draw(); onChange&&onChange(); };
      head.querySelector('[data-del]').onclick = async ()=>{
        if(await confirmar('¿Eliminar este bloque de estadísticas?')){ item.stats.splice(idx, 1); draw(); onChange&&onChange(); }
      };
      if(!blk.collapsed){
        // Preview del chart
        body.appendChild(renderStatsChart(blk));
        // Editor de entradas
        const entriesBox = make('<div style="margin-top:12px"></div>');
        function drawEntries(){
          entriesBox.innerHTML = '';
          blk.entries.forEach((en, i)=>{
            const row = make(`<div class="stat-entry-row">
              <input type="text" data-l value="${esc(en.label||'')}" placeholder="Nombre (Fuerza, Vida...)">
              <input type="number" data-v value="${en.value}" title="Valor actual">
              <span style="color:var(--muted);font-size:12px">/</span>
              <input type="number" data-m value="${en.max}" title="Valor máximo">
              <input type="color" data-c value="${esc(en.color||'#c9a227')}" title="Color">
              <button class="btn small" data-up title="Subir">▲</button>
              <button class="btn small" data-dn title="Bajar">▼</button>
              <button class="btn small danger" data-x>✕</button>
            </div>`);
            row.querySelector('[data-l]').oninput = e => { en.label = e.target.value; redrawPreview(); onChange&&onChange(); };
            row.querySelector('[data-v]').oninput = e => { en.value = parseFloat(e.target.value)||0; redrawPreview(); onChange&&onChange(); };
            row.querySelector('[data-m]').oninput = e => { en.max = parseFloat(e.target.value)||10; redrawPreview(); onChange&&onChange(); };
            row.querySelector('[data-c]').oninput = e => { en.color = e.target.value; redrawPreview(); onChange&&onChange(); };
            row.querySelector('[data-up]').onclick = ()=>{ if(moveInArray(blk.entries, i, -1)){ draw(); onChange&&onChange(); } };
            row.querySelector('[data-dn]').onclick = ()=>{ if(moveInArray(blk.entries, i, +1)){ draw(); onChange&&onChange(); } };
            row.querySelector('[data-x]').onclick = ()=>{ blk.entries.splice(i, 1); draw(); onChange&&onChange(); };
            entriesBox.appendChild(row);
          });
        }
        let previewNode = null;
        function redrawPreview(){
          if(!previewNode) return;
          const newPreview = renderStatsChart(blk);
          previewNode.parentNode.replaceChild(newPreview, previewNode);
          previewNode = newPreview;
        }
        drawEntries();
        body.appendChild(entriesBox);
        const addEntry = make('<button class="btn small" style="margin-top:6px">+ Añadir estadística</button>');
        addEntry.onclick = ()=>{ blk.entries.push(newStatEntry()); draw(); onChange&&onChange(); };
        body.appendChild(addEntry);
        // Guardamos referencia al preview para redibujar
        previewNode = body.querySelector('.stat-chart-bars, .stat-chart-spider, .stat-empty-hint');
      }
      list.appendChild(div);
    });
  }
  toolbar.querySelector('[data-add]').onclick = ()=>{ item.stats.push(newStatsBlock()); draw(); onChange&&onChange(); };
  draw();
  wrap.appendChild(list);
  wrap.appendChild(toolbar);
  return wrap;
}

/* ============================================================
   7.1 DRAG & DROP
============================================================ */
const DragDrop = { active: null };
function clearDropHighlights(){
  $$('.folder-header.drop-target').forEach(h=>h.classList.remove('drop-target'));
  $$('.list-item.drop-before,.list-item.drop-after').forEach(h=>h.classList.remove('drop-before','drop-after'));
}
function finishDrag(){
  const d = DragDrop.active; DragDrop.active = null;
  if(!d) return;
  if(d.overIsFolder){ d.moveToFolder(d.ids, d.overFolder); }
  else if(d.overItemId){
    const items = d.items;
    const draggedIds = new Set(d.ids);
    const moving = items.filter(it=>draggedIds.has(it.id));
    const rest   = items.filter(it=>!draggedIds.has(it.id));
    let insertAt = rest.findIndex(it=>it.id===d.overItemId);
    if(insertAt < 0) insertAt = rest.length;
    if(!d.overBefore) insertAt += 1;
    rest.splice(insertAt, 0, ...moving);
    items.length = 0; items.push(...rest);
    d.onReorder();
  }
}
function makeDragHandle(handleEl, rowEl, ctx){
  if(!handleEl) return;
  handleEl.addEventListener('pointerdown', e=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    e.preventDefault(); e.stopPropagation();
    DragDrop.active = { ids: ctx.getIds(), items: ctx.items, moveToFolder: ctx.moveToFolder, onReorder: ctx.onReorder,
      overIsFolder:false, overFolder:'', overItemId:null, overBefore:true };
    rowEl.classList.add('dragging');
    document.body.style.userSelect = 'none';
    const move = ev=>{
      const d = DragDrop.active; if(!d) return;
      clearDropHighlights();
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const header = el && el.closest('.folder-header');
      const item = el && el.closest('.list-item');
      if(header){
        header.classList.add('drop-target');
        d.overIsFolder = true; d.overFolder = header.dataset.folder || ''; d.overItemId = null;
      } else if(item && item !== rowEl){
        const r = item.getBoundingClientRect();
        const before = ev.clientY < r.top + r.height/2;
        item.classList.add(before ? 'drop-before' : 'drop-after');
        d.overIsFolder = false; d.overItemId = item.dataset.id; d.overBefore = before;
      } else { d.overIsFolder = false; d.overItemId = null; }
    };
    const up = ()=>{
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', up);
      document.body.style.userSelect = '';
      rowEl.classList.remove('dragging');
      clearDropHighlights();
      finishDrag();
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
  });
}

  if(!DB.projects.length){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">No hay proyectos todavía.</div>`;
  }
  DB.projects.forEach(p=>{
    const card = make(`<div class="card">
      <div class="projcover">📖</div>
      <div class="projbody">
        <h3>${esc(p.name)}</h3>
        <p>${esc(stripHtml(p.description).slice(0,140) || 'Sin descripción')}</p>
      </div>
      <div class="cardactions">
        <button class="btn small primary" data-open>Abrir</button>
        <button class="btn small" data-dup>⧉</button>
        <button class="btn small danger" data-del>🗑</button>
      </div>
    </div>`);
    if(p.image){
      const c = card.querySelector('.projcover');
      c.style.backgroundImage = `url("${p.image}")`; c.textContent='';
    }
    card.querySelector('[data-open]').onclick = ()=>{ migrateProject(p); P = p; DB.currentId = p.id; saveDB(); applyTheme(); view='home'; render(); };
    card.querySelector('[data-dup]').onclick = ()=>{
      const c = dupeItem(p); c.name = p.name + ' (copia)';
      migrateProject(c); DB.projects.push(c); saveDB(); render(); toast('Proyecto duplicado ✓');
    };
    card.querySelector('[data-del]').onclick = async ()=>{
      if(await pedirBorrado(p.name)){
        DB.projects = DB.projects.filter(x=>x.id!==p.id);
        if(DB.currentId === p.id){ DB.currentId = null; P = null; }
        saveDB(); render(); toast('Proyecto borrado');
      }
    };
    grid.appendChild(card);
  });
  w.querySelector('[data-new]').onclick = crearProyecto;
  return w;
}

function crearProyecto(){
  pedir('📖 Nuevo proyecto', [
    {key:'n', label:'Nombre', value:'', autofocus:true},
    {key:'d', label:'Descripción breve', value:''}
  ]).then(v=>{
    if(!v || !v.n.trim()) return;
    const p = newProject(v.n.trim(), v.d.trim());
    DB.projects.push(p); DB.currentId = p.id; P = p;
    saveDB(); applyTheme(); view='home'; render(); toast('Proyecto creado ✓');
  });
}

     {label:'🗑 Borrar proyecto', cls:'danger', onClick: async ()=>{

  w.querySelector('[data-subgenres]').appendChild(makeChipsEditor(P.subgenres, null, 'Subgénero'));

  const stats = w.querySelector('[data-stats]');

  const cnt = [
    ['Actos / Temporadas', (P.story.acts||[]).length, 'chapters'],
    ['Capítulos',          (P.story.chapters||[]).length, 'chapters'],

    ['Personajes',         (P.characters||[]).length, 'characters'],

    ['Genealogías',        (P.genealogies||[]).length, 'genealogy'],
    ['Bestiario',          (P.bestiary||[]).length, 'bestiary'],
    ['Razas',              (P.races||[]).length, 'races'],
    ['Lore',               (P.lore||[]).length, 'lore'],
    ['Zonas',              countZones(P.world), 'world'],
    ['Notas',              (P.notes||[]).length, 'notes']
  ];
  cnt.forEach(([l,n,vw])=>{

function countZones(arr){ let n=0; (arr||[]).forEach(z=>{ n += 1 + countZones(z.children); }); return n; }

/* ==== 8.3 Capítulos + Actos ==== */
function viewChapters(){
  if(!P.story.acts) P.story.acts = [];
  if(!ui.chapters.sel) ui.chapters.sel = [];
  if(!ui.acts) ui.acts = { q:'', sort:'custom' };

  // Layout: dos paneles anidados: izquierda lista de Actos, centro lista de Capítulos, derecha detalle
  const wrap = make(`<div class="split" style="gap:18px">
    <div class="pane-list" style="width:210px;flex:0 0 210px">
      <div class="pane-head">
        <h3>Actos</h3>
        <div class="pane-actions">
          <button class="btn small primary" data-newact title="Nuevo acto">+</button>
        </div>
      </div>
      <div class="list" data-actlist></div>
    </div>
    <div class="pane-list" style="width:270px;flex:0 0 270px">
      <div class="pane-head">
        <h3>Capítulos</h3>
        <div class="pane-actions">
          <button class="btn small" data-paste title="Pegar">📥</button>
          <button class="btn small primary" data-new>+</button>
        </div>
      </div>
      <div data-tools></div>
      <div class="list" data-list></div>
    </div>
    <div class="pane-detail" data-detail></div>
  </div>`);

  const actList = wrap.querySelector('[data-actlist]');
  const list = wrap.querySelector('[data-list]');
  const detail = wrap.querySelector('[data-detail]');
  const toolsBox = wrap.querySelector('[data-tools]');

  function drawActs(){
    actList.innerHTML = '';
    if(!P.story.acts.length){
      actList.innerHTML = '<div class="empty">Sin actos.</div>';
      return;
    }
    const allItem = make(`<div class="list-item ${!sel.acts?'active':''}">
      <span class="li-title">📚 Todos</span>
      <span class="li-sub">${P.story.chapters.length} capítulo${P.story.chapters.length===1?'':'s'}</span>
    </div>`);
    allItem.onclick = ()=>{ sel.acts = null; drawActs(); drawList(); drawDetail(); };
    actList.appendChild(allItem);

    P.story.acts.forEach(a=>{
      const cnt = P.story.chapters.filter(c=>c.actId === a.id).length;
      const it = make(`<div class="list-item ${a.id===sel.acts?'active':''}">
        <span class="li-title">🎬 ${esc(a.name||'Acto sin título')}</span>
        <span class="li-sub">${cnt} capítulo${cnt===1?'':'s'}</span>
        <div class="li-move">
          <button data-up title="Subir">▲</button>
          <button data-dn title="Bajar">▼</button>
        </div>
      </div>`);
      it.onclick = (e)=>{ if(e.target.closest('.li-move')) return; sel.acts = a.id; drawActs(); drawList(); drawDetail(); };
      const idx = P.story.acts.indexOf(a);
      it.querySelector('[data-up]').onclick = (e)=>{ e.stopPropagation(); if(moveInArray(P.story.acts, idx, -1)){ touch(); drawActs(); } };
      it.querySelector('[data-dn]').onclick = (e)=>{ e.stopPropagation(); if(moveInArray(P.story.acts, idx, +1)){ touch(); drawActs(); } };
      actList.appendChild(it);
    });
  }

  function drawList(){
    list.innerHTML = '';
    let arr = P.story.chapters.slice();
    if(sel.acts) arr = arr.filter(c => c.actId === sel.acts);
    arr = applyFilter(arr, ui.chapters.q, [c=>c.title, c=>c.season]);
    const mode = ui.chapters.sort || 'custom';
    if(mode !== 'custom') arr = applySort(arr, mode, c=>c.title);
    const showMove = mode === 'custom' && !ui.chapters.q && !sel.acts;
    if(!arr.length){ list.innerHTML = '<div class="empty">Sin capítulos en esta vista.</div>'; return; }
    arr.forEach(c=>{
      const idx = P.story.chapters.indexOf(c);
      list.appendChild(makeListItem({
        title: c.title || 'Capítulo sin título',
        sub: c.season || 'Sin temporada',
        active: c.id === sel.chapters,
        showMove,
        onUp: ()=>{ if(moveInArray(P.story.chapters, idx, -1)){ touch(); drawList(); } },
        onDown: ()=>{ if(moveInArray(P.story.chapters, idx, +1)){ touch(); drawList(); } },
        onClick: ()=>{ sel.chapters = c.id; drawList(); drawDetail(); }
      }));
    });
  }

  function drawDetail(){
    detail.innerHTML = '';

    // Si hay un acto seleccionado y ningún capítulo seleccionado, mostramos detalle del acto
    let c = P.story.chapters.find(x => x.id === sel.chapters);
    if(!c && P.story.chapters.length && !sel.acts){ c = P.story.chapters[0]; sel.chapters = c.id; }
    if(!c && sel.acts) { drawActDetail(); return; }
    if(!c){ detail.appendChild(make('<div class="paper empty">Selecciona o crea un capítulo.</div>')); return; }

    const box = make('<div class="paper"></div>');
    box.appendChild(titleRow(c.title, v=>{ c.title = v; touch(); drawList(); }, [
      {label:'📋 Copiar', onClick:()=>{ clipboard = {kind:'chapter', data:deepClone(c)}; toast('Copiado ✓'); }},
      {label:'⧉ Duplicar', onClick:()=>{
          const d = dupeItem(c); d.title = (c.title||'Capítulo') + ' (copia)';
          const i = P.story.chapters.indexOf(c); P.story.chapters.splice(i+1,0,d);
          sel.chapters = d.id; touch(); drawList(); drawDetail();
        }},
      {label:'🗑 Borrar', cls:'danger', onClick: async ()=>{
          if(await pedirBorrado(c.title||'este capítulo')){
            P.story.chapters = P.story.chapters.filter(x=>x.id!==c.id);
            sel.chapters = null; touch(); drawList(); drawDetail();
          }
        }}
    ], 'Título del capítulo'));

    // Acto (antes carpeta)
    const actWrap = make(`<label class="field"><span>Acto / Temporada</span>
      <select>
        <option value="">— Sin asignar —</option>
        ${P.story.acts.map(a=>`<option value="${a.id}" ${c.actId===a.id?'selected':''}>${esc(a.name||'Sin título')}</option>`).join('')}
      </select></label>`);
    actWrap.querySelector('select').onchange = e=>{ c.actId = e.target.value; touch(); drawList(); };
    box.appendChild(actWrap);

    box.appendChild(fieldInput('Temporada / Arco (etiqueta libre)', c.season, v=>{ c.season = v; touch(); drawList(); }, 'Temporada 1'));
    const dates = make('<div class="grid2"></div>');
    dates.appendChild(fieldInput('Inicio', c.start, v=>{ c.start = v; touch(); }, '01/01/2024'));
    dates.appendChild(fieldInput('Fin', c.end, v=>{ c.end = v; touch(); }, '15/02/2024'));
    box.appendChild(dates);

    // Personajes que aparecen
    const charsBox = make('<div style="margin:12px 0"></div>');
    charsBox.appendChild(make('<div style="font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--gold-soft);margin-bottom:6px">Personajes que aparecen</h6>'));
    const chipsBox = make('<div class="chips"></div>');
    function drawChars(){
      chipsBox.innerHTML = '';
      (c.characterIds||[]).forEach((id, i)=>{
        const ch = P.characters.find(x=>x.id===id);
        if(!ch) return;
        const chip = make(`<span class="chip">🧝 ${esc(ch.name||'Sin nombre')}<span class="x" title="Quitar">✕</span></span>`);
        chip.querySelector('.x').onclick = ()=>{ c.characterIds.splice(i,1); touch(); drawChars(); };
        chip.onclick = (e)=>{ if(e.target.classList.contains('x')) return; goTo(ch.id); };
        chip.style.cursor = 'pointer';
        chipsBox.appendChild(chip);
      });
      const addChip = make(`<span class="chip chip-add" title="Añadir personaje">+ Añadir</span>`);
      addChip.onclick = ()=> pickCharactersModal(c.characterIds, drawChars, touch);
      chipsBox.appendChild(addChip);
    }
    drawChars();
    charsBox.appendChild(chipsBox);
    box.appendChild(charsBox);

    // Eventos importantes
    const evBox = make('<div style="margin:12px 0"></div>');
    evBox.appendChild(make('<div style="font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--gold-soft);margin-bottom:6px">Eventos importantes</div>'));
    const evChips = make('<div class="chips"></div>');
    function drawEv(){
      evChips.innerHTML = '';
      (c.eventIds||[]).forEach((id, i)=>{
        const ev = P.story.events.find(x=>x.id===id);
        if(!ev) return;
        const chip = make(`<span class="chip">⚡ ${esc(ev.title||'Sin título')}<span class="x" title="Quitar">✕</span></span>`);
        chip.querySelector('.x').onclick = ()=>{ c.eventIds.splice(i,1); touch(); drawEv(); };
        chip.onclick = (e)=>{ if(e.target.classList.contains('x')) return; goTo(ev.id); };
        chip.style.cursor = 'pointer';
        evChips.appendChild(chip);
      });
      const addChip = make(`<span class="chip chip-add">+ Añadir</span>`);
      addChip.onclick = ()=> pickEventsModal(c.eventIds, drawEv, touch);
      evChips.appendChild(addChip);
    }
    drawEv();
    evBox.appendChild(evChips);
    box.appendChild(evBox);

    box.appendChild(make('<div style="height:8px"></div>'));
    box.appendChild(createEditor(c.content, v=>{ c.content = v; touch(); }));

    detail.appendChild(box);
  }

  function drawActDetail(){
    const a = P.story.acts.find(x=>x.id===sel.acts);
    if(!a){ detail.appendChild(make('<div class="paper empty">Acto no encontrado.</div>')); return; }
    const box = make('<div class="paper"></div>');
    box.appendChild(titleRow(a.name, v=>{ a.name = v; touch(); drawActs(); }, [
      {label:'⧉ Duplicar', onClick:()=>{
          const d = dupeItem(a); d.name = (a.name||'Acto') + ' (copia)';
          P.story.acts.splice(P.story.acts.indexOf(a)+1, 0, d);
          sel.acts = d.id; touch(); drawActs(); drawDetail();
        }},
      {label:'🗑 Borrar', cls:'danger', onClick: async ()=>{
          if(await pedirBorrado(a.name||'este acto')){
            P.story.chapters.forEach(c => { if(c.actId===a.id) c.actId=''; });
            P.story.acts = P.story.acts.filter(x=>x.id!==a.id);
            sel.acts = null; touch(); drawActs(); drawList(); drawDetail();
          }
        }}
    ], 'Nombre del acto'));
    const dates = make('<div class="grid2"></div>');
    dates.appendChild(fieldInput('Inicio', a.start, v=>{ a.start = v; touch(); }, '01/01/2024'));
    dates.appendChild(fieldInput('Fin', a.end, v=>{ a.end = v; touch(); }, '15/02/2024'));
    box.appendChild(dates);
    box.appendChild(make('<div style="margin:10px 0 4px;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--gold-soft)">Descripción</div>'));
    box.appendChild(createEditor(a.description, v=>{ a.description = v; touch(); }));

    const listBox = make('<div style="margin-top:16px"></div>');
    listBox.appendChild(make('<div style="font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--gold-soft);margin-bottom:6px">Capítulos en este acto</div>'));
    const chapters = P.story.chapters.filter(c=>c.actId === a.id);
    if(!chapters.length) listBox.appendChild(make('<div class="empty">Sin capítulos asignados.</div>'));
    chapters.forEach(c=>{
      const it = make(`<div class="list-item"><span class="li-title">${esc(c.title||'Capítulo sin título')}</span></div>`);
      it.onclick = ()=>{ sel.chapters = c.id; drawList(); drawDetail(); };
      listBox.appendChild(it);
    });
    box.appendChild(listBox);

    detail.appendChild(box);
  }

  toolsBox.appendChild(makePaneTools('chapters', drawList, '🔍 Buscar capítulo...'));

  wrap.querySelector('[data-new]').onclick = ()=>{
    const c = { id: uid(), title:'', season:'', content:'', actId: sel.acts||'', characterIds:[], eventIds:[], start:'', end:'' };
    P.story.chapters.push(c); sel.chapters = c.id; touch(); drawList(); drawDetail();
  };
  wrap.querySelector('[data-newact]').onclick = async ()=>{
    const v = await pedir('🎬 Nuevo acto / temporada', [{key:'n', label:'Nombre', value:'', autofocus:true}]);
    if(v && v.n.trim()){
      const a = newAct(); a.name = v.n.trim();
      P.story.acts.push(a); sel.acts = a.id; touch(); drawActs(); drawList(); drawDetail();
    }
  };
  wrap.querySelector('[data-paste]').onclick = ()=>{
    if(!clipboard || clipboard.kind!=='chapter'){ toast('Nada que pegar'); return; }
    const d = dupeItem(clipboard.data);
    P.story.chapters.push(d); sel.chapters = d.id; touch(); drawList(); drawDetail(); toast('Pegado ✓');
  };

  drawActs(); drawList(); drawDetail();
  return wrap;
}

function pickCharactersModal(ids, redraw, onChange){
  openModal(`<h3>🧝 Seleccionar personajes</h3>
    <label class="field"><span>Buscar</span><input data-q placeholder="Filtra por nombre..." autofocus></label>
    <div class="picklist" data-list></div>
    <div class="modal-actions">
      <button class="btn" data-new>+ Crear nuevo</button>
      <button class="btn primary" data-cancel>Cerrar</button>
    </div>`,
    m=>{
      const list = m.querySelector('[data-list]');
      const input = m.querySelector('[data-q]');
      const draw = (q='')=>{
        list.innerHTML = '';
        const qq = q.toLowerCase();
        const f = P.characters.filter(c => (c.name||'').toLowerCase().includes(qq));
        if(!f.length) list.innerHTML = '<div class="empty">Sin resultados.</div>';
        f.forEach(ch=>{
          const checked = ids.includes(ch.id);
          const it = make(`<label class="pickitem" style="cursor:pointer">
            <input type="checkbox" ${checked?'checked':''} style="accent-color:var(--gold)">
            <span>🧝 ${esc(ch.name||'Sin nombre')}</span>
          </label>`);
          const cb = it.querySelector('input');
          cb.onchange = ()=>{
            if(cb.checked){ if(!ids.includes(ch.id)) ids.push(ch.id); }
            else { const i = ids.indexOf(ch.id); if(i>=0) ids.splice(i,1); }
            onChange && onChange();
          };
          list.appendChild(it);
        });
      };
      draw();
      input.oninput = e => draw(e.target.value);
      m.querySelector('[data-new]').onclick = ()=>{ const c = newCharacter(); P.characters.push(c); ids.push(c.id); draw(input.value); onChange && onChange(); };
      m.querySelector('[data-cancel]').onclick = ()=>{ closeModal(); redraw && redraw(); };
    });
}
