function applyTheme(){
  const t = (P && P.settings && P.settings.theme) || 'codex';
  const theme = THEMES[t] || THEMES.codex;
  const root = document.documentElement;
  Object.entries(theme.vars).forEach(([k,v]) => root.style.setProperty(k, v));
  // Accent override
  if(P && P.settings && P.settings.accent){
    root.style.setProperty('--gold', P.settings.accent);
  }
  if(P && P.settings && P.settings.bodyFont){
    root.style.setProperty('--body-font', P.settings.bodyFont);
  }
}

function viewSettings(){
  if(!P.settings) P.settings = { theme:'codex', accent:'#c9a227', bodyFont:'' };
  const w = make(`<div class="page">
    <div class="page-head"><h1>Ajustes</h1></div>
    <div class="paper">
      <h3 style="margin-bottom:10px">🎨 Tema</h3>
      <p class="hint" style="margin-bottom:12px">Elige un tema base. Se guarda por proyecto.</p>
      <div class="theme-preview" data-themes></div>
    </div>
    <div class="paper">
      <h3 style="margin-bottom:10px">✨ Color de acento</h3>
      <div class="settings-row">
        <label>Color de acento (sobrescribe el del tema)</label>
        <input type="color" data-accent value="${esc(P.settings.accent||'#c9a227')}">
        <button class="btn small" data-accent-reset>Restablecer del tema</button>
      </div>
    </div>
    <div class="paper">
      <h3 style="margin-bottom:10px">🔤 Tipografía</h3>
      <div class="settings-row">
        <label>Fuente del cuerpo</label>
        <select data-font>
          <option value="">Por defecto (serif)</option>
          <option value="Georgia, serif" ${P.settings.bodyFont==='Georgia, serif'?'selected':''}>Georgia</option>
          <option value="'Times New Roman', serif" ${P.settings.bodyFont==="'Times New Roman', serif"?'selected':''}>Times New Roman</option>
          <option value="system-ui, sans-serif" ${P.settings.bodyFont==='system-ui, sans-serif'?'selected':''}>Sans-serif moderna</option>
          <option value="'Courier New', monospace" ${P.settings.bodyFont==="'Courier New', monospace"?'selected':''}>Courier New</option>
        </select>
      </div>
    </div>
    <div class="paper">
      <h3 style="margin-bottom:10px">🧩 Secciones visibles</h3>
      <p class="hint" style="margin-bottom:10px">Desmarca las secciones que no uses en este proyecto para ocultarlas del menú lateral.</p>
      <div data-sections></div>
    </div>
    <div class="paper">
      <h3 style="margin-bottom:10px">🛠 Avanzado</h3>
      <div class="settings-row">
        <label>Reiniciar todos los ajustes visuales</label>
        <button class="btn danger" data-reset-visual>Restablecer tema</button>
      </div>
      <div class="settings-row">
        <label>Exportar este proyecto (JSON)</label>
        <button class="btn" data-export>Exportar</button>
      </div>
    </div>
  </div>`);

  const themesBox = w.querySelector('[data-themes]');
  Object.entries(THEMES).forEach(([key, theme])=>{
    const card = make(`<div class="theme-card ${P.settings.theme===key?'active':''}" data-theme="${key}">
      <div class="tc-swatch">
        <span style="background:${theme.vars['--bg']}"></span>
        <span style="background:${theme.vars['--paper']}"></span>
        <span style="background:${theme.vars['--gold']}"></span>
        <span style="background:${theme.vars['--ink']}"></span>
      </div>
      <div class="tc-label">${esc(theme.label)}</div>
    </div>`);
    card.onclick = ()=>{
      P.settings.theme = key;
      applyTheme(); touch();
      themesBox.querySelectorAll('.theme-card').forEach(c => c.classList.toggle('active', c.dataset.theme === key));
      toast('Tema aplicado ✓');
    };
    themesBox.appendChild(card);
  });

  w.querySelector('[data-accent]').oninput = e => {
    P.settings.accent = e.target.value;
    applyTheme(); touch();
  };
  w.querySelector('[data-accent-reset]').onclick = ()=>{
    P.settings.accent = '';
    applyTheme(); touch();
    w.querySelector('[data-accent]').value = THEMES[P.settings.theme].vars['--gold'];
  };
  w.querySelector('[data-font]').onchange = e => {
    P.settings.bodyFont = e.target.value;
    applyTheme(); touch();
  };
  w.querySelector('[data-reset-visual]').onclick = ()=>{
    P.settings = { theme:'codex', accent:'#c9a227', bodyFont:'' };
    applyTheme(); touch(); render();
  };
  w.querySelector('[data-export]').onclick = ()=> $('#btnExport').click();

  // Secciones visibles / ocultas
  const sectionsBox = w.querySelector('[data-sections]');
  if(sectionsBox){
    const groups = {};
    SECTION_LIST.forEach(s => { if(!groups[s.group]) groups[s.group] = []; groups[s.group].push(s); });
    Object.entries(groups).forEach(([grpName, items])=>{
      sectionsBox.appendChild(make(`<div class="section-toggle-group-title">${esc(grpName)}</div>`));
      items.forEach(s=>{
        const locked = (s.id === 'home' || s.id === 'settings');
        const visible = !(P.settings.hiddenSections||[]).includes(s.id);
        const row = make(`<label class="section-toggle-row">
          <input type="checkbox" ${visible?'checked':''} ${locked?'disabled':''}>
          <span class="stg-name">${esc(s.icon)} ${esc(s.label)}${locked?' <small style="color:var(--muted)">(siempre visible)</small>':''}</span>
        </label>`);
        if(!locked){
          row.querySelector('input').onchange = e=>{
            if(e.target.checked){
              P.settings.hiddenSections = (P.settings.hiddenSections||[]).filter(x => x !== s.id);
            } else {
              if(!P.settings.hiddenSections) P.settings.hiddenSections = [];
              if(!P.settings.hiddenSections.includes(s.id)) P.settings.hiddenSections.push(s.id);
            }
            touch(); renderSidebar();
            if(view === s.id && !e.target.checked){ view = 'home'; render(); }
          };
        }
        sectionsBox.appendChild(row);
      });
    });
  }

  return w;
}

function renderSidebar(){
  const sb = $('#sidebar');
  sb.innerHTML = '';
  if(!P) return;
  NAV.forEach(g=>{
    const visibleItems = g.items.filter(it => isSectionVisible(it.id));
    if(!visibleItems.length) return;
    const grp = make(`<div class="navgroup"><h4>${esc(g.group)}</h4></div>`);
    visibleItems.forEach(it=>{
      const el = make(`<div class="navitem ${view===it.id?'active':''}">
        <span class="ic">${it.icon}</span><span>${esc(it.label)}</span></div>`);
      el.onclick = ()=>{ view = it.id; render(); $('#main').scrollTop = 0; closeSidebarMobile(); };
      grp.appendChild(el);
    });
    sb.appendChild(grp);
  });
}

const VIEWS = {
  library: viewLibrary, home: viewHome, chapters: viewChapters, events: viewEvents,
  timeline: viewTimeline, ideas: viewIdeas, characters: viewCharacters,
  charnet: viewCharNet, charhist: viewCharHist, genealogy: viewGenealogy,
  heights: viewHeights, bestiary: viewBestiary, races: viewRaces,
  world: viewWorld, lore: viewLore, notes: viewNotes, settings: viewSettings
};

function render(){
  if(!P) view = 'library';
  if(P && view !== 'library' && !isSectionVisible(view)) view = 'home';
  $('#topProjName').textContent = P ? (P.name || 'Sin nombre') : 'Sin proyecto';
  renderSidebar();
  const m = $('#main');
  m.innerHTML = '';
  const fn = VIEWS[view] || viewLibrary;
  try{
    m.appendChild(fn());
  }catch(err){
    console.error(err);
    m.appendChild(make(`<div class="paper"><h3>Error al mostrar la vista</h3><p>${esc(err.message)}</p></div>`));
  }
}

/* ============================================================
   10. TOPBAR
============================================================ */
$('#btnLibrary').onclick = ()=>{ view = 'library'; render(); };
$('#btnNew').onclick = crearProyecto;

$('#btnExport').onclick = ()=>{
  if(!P){ toast('No hay proyecto abierto'); return; }
  const data = JSON.stringify({ codex:true, version:2, project:P }, null, 2);
  const blob = new Blob([data], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (P.name || 'proyecto').replace(/[^\w\-]+/g,'_') + '.codex.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  toast('Proyecto exportado ✓');
};

$('#btnImport').onclick = ()=> $('#fileImport').click();
$('#fileImport').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      if(data.codex && data.project){
        const p = data.project;
        p.id = uid();
        migrateProject(p);
        DB.projects.push(p);
        DB.currentId = p.id; P = p;
        applyTheme();
        saveDB(); view = 'home'; render();
        toast('Proyecto importado ✓');
      } else if(data.projects && Array.isArray(data.projects)){
        data.projects.forEach(p=>{
          p.id = uid();
          migrateProject(p);
          DB.projects.push(p);
        });
        saveDB(); render();
        toast('Biblioteca importada ✓');
      } else {
        toast('Archivo no reconocido');
      }
    }catch(err){
      toast('Error al leer el archivo');
      console.error(err);
    }
  };
  r.readAsText(f);
  e.target.value = '';
};

/* ============================================================
   11. ARRANQUE
============================================================ */
function init(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) DB = JSON.parse(raw);
  }catch(e){ console.warn('DB corrupta'); }
  if(!DB || !Array.isArray(DB.projects)) DB = { projects: [], currentId: null };
  P = DB.projects.find(p=>p.id === DB.currentId) || null;
  if(!P && DB.projects.length){ P = DB.projects[0]; DB.currentId = P.id; }
  if(!P) view = 'library';
  DB.projects.forEach(p => migrateProject(p));
  applyTheme();

  try{ document.execCommand('defaultParagraphSeparator', false, 'p'); }catch(e){}
  render();
  setSaveState(P ? 'Guardado ✓' : '');
  if(DB.projects.length) saveDB();
}

window.addEventListener('beforeunload', ()=>{ if(P) saveDB(); });
init();
