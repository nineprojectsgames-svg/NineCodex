/* ==== 8.4 Eventos ==== */
function viewEvents(){
  if(!ui.events.sel) ui.events.sel = [];
  const wrap = make(`<div class="split">
    <div class="pane-list">
      <div class="pane-head">
        <h3>Eventos</h3>
        <div class="pane-actions">
          <button class="btn small" data-paste>📥</button>
          <button class="btn small primary" data-new>+</button>
        </div>
      </div>
      <div data-tools></div>
      <div class="list" data-list></div>
    </div>
    <div class="pane-detail" data-detail></div>
  </div>`);
  const list = wrap.querySelector('[data-list]');
  const detail = wrap.querySelector('[data-detail]');
  const toolsBox = wrap.querySelector('[data-tools]');

  function drawList(){
    list.innerHTML = '';
    const mode = ui.events.sort || 'custom';
    let arr = applyFilter(P.story.events, ui.events.q, [e=>e.title, e=>e.date, e=>e.type]);
    if(mode !== 'custom') arr = applySort(arr, mode, e=>e.title);
    const showMove = mode === 'custom' && !ui.events.q;
    if(!arr.length){ list.innerHTML = '<div class="empty">Sin eventos.</div>'; return; }
    arr.forEach(e=>{
      const idx = P.story.events.indexOf(e);

      e.type = ts.value; touch(); drawList();

    box.appendChild(typeWrap);

    box.appendChild(fieldInput('Fecha / Momento', e.date, v=>{ e.date = v; touch(); drawList(); }, 'Año 342, primavera...'));
    const dates = make('<div class="grid2"></div>');

    dates.appendChild(fieldInput('Fin', e.end, v=>{ e.end = v; touch(); }, '15/02/2024'));

    box.appendChild(imagePicker(e.image, v=>{ e.image = v; touch(); drawList(); }));

    // Personajes implicados
    const charsBox = make('<div style="margin:12px 0"></div>');

    function drawChars(){
      chipsBox.innerHTML = '';

        if(!ch) return;
        const chip = make(`<span class="chip">🧝 ${esc(ch.name||'Sin nombre')}<span class="x" title="Quitar">✕</span></span>`);
        chip.querySelector('.x').onclick = ()=>{ e.characterIds.splice(i,1); touch(); drawChars(); };
        chip.onclick = (ev)=>{ if(ev.target.classList.contains('x')) return; goTo(ch.id); };
        chip.style.cursor = 'pointer';

      });
      const addChip = make(`<span class="chip chip-add">+ Añadir</span>`);
      addChip.onclick = ()=> pickCharactersModal(e.characterIds, drawChars, touch);
      chipsBox.appendChild(addChip);
    }
    drawChars();
    charsBox.appendChild(chipsBox);
    box.appendChild(charsBox);

    box.appendChild(createEditor(e.content, v=>{ e.content = v; touch(); }));
    detail.appendChild(box);
  }

  toolsBox.appendChild(makePaneTools('events', drawList, '🔍 Buscar evento...'));

  wrap.querySelector('[data-new]').onclick = ()=>{
    const e = { id: uid(), title:'', date:'', content:'', type:'', image:'', start:'', end:'', characterIds:[] };
    P.story.events.push(e); sel.events = e.id; touch(); drawList(); drawDetail();
  };
  wrap.querySelector('[data-paste]').onclick = ()=>{
    if(!clipboard || clipboard.kind!=='event'){ toast('Nada que pegar'); return; }
    const d = dupeItem(clipboard.data);
    P.story.events.push(d); sel.events = d.id; touch(); drawList(); drawDetail(); toast('Pegado ✓');
  };
  drawList(); drawDetail();
  return wrap;
}

/* ---------- 8.5 Cronología ---------- */
function parseTimelineYear(str){
  if(!str) return null;
  const s = String(str);
  const m = s.match(/-?\d+/);
  if(!m) return null;
  let n = parseInt(m[0], 10);
  if(/\ba\.?\s*c\.?/i.test(s) || /\bBC\b/i.test(s) || /\bAEC\b/i.test(s)) n = -Math.abs(n);
  return n;
}

/* Helpers de calendario */
const DEFAULT_WEEKDAYS = ['L','M','X','J','V','S','D'];
function newTimeline(name){
  return {
    id: uid(), name: name || 'Cronología', description:'',
    hitos: [], view:{ mode:'vertical', zoom:1 },
    calendar: { yearLabel:'Año', months: [], daysPerMonth: 30, weekdays: DEFAULT_WEEKDAYS.slice(), currentYear: 1 }
  };
}
function newHito(){
  return { id: uid(), title:'', date:'', desc:'', eventId:null, calStart:null, calEnd:null, calColor:'#c9a227' };
}
function ensureTimeline(t){
  if(!t.view) t.view = { mode:'vertical', zoom:1 };
  if(!Array.isArray(t.hitos)) t.hitos = [];
  if(typeof t.description !== 'string') t.description = '';
  if(!t.calendar) t.calendar = {};
  const cal = t.calendar;
  if(typeof cal.yearLabel !== 'string') cal.yearLabel = 'Año';
  if(!Array.isArray(cal.months)) cal.months = [];
  if(typeof cal.daysPerMonth !== 'number' || cal.daysPerMonth < 1) cal.daysPerMonth = 30;
  if(!Array.isArray(cal.weekdays) || !cal.weekdays.length) cal.weekdays = DEFAULT_WEEKDAYS.slice();
  if(typeof cal.currentYear !== 'number') cal.currentYear = 1;
  cal.months = cal.months.map(m => {
    if(typeof m === 'string') return { name: m, days: cal.daysPerMonth || 30 };
    if(!m || typeof m !== 'object') return { name: '', days: cal.daysPerMonth || 30 };
    if(typeof m.name !== 'string') m.name = '';
    if(typeof m.days !== 'number' || m.days < 1) m.days = cal.daysPerMonth || 30;
    return m;
  });
  t.hitos.forEach(h => {
    if(h.calStart === undefined) h.calStart = null;
    if(h.calEnd === undefined) h.calEnd = null;
    if(!h.calColor) h.calColor = '#c9a227';
  });
}
function calcHitoDuration(h, cal){
  const s = h.calStart; if(!s) return 1;
  const e = h.calEnd || s;
  const dayOfYear = (yy) => {
    let days = 0;
    for(let i=0; i<yy.m; i++) days += (cal.months[i]?.days) || cal.daysPerMonth || 30;
    days += yy.d;
    return days;
  };
  let daysPerYear = 0;
  (cal.months||[]).forEach(m => daysPerYear += m.days || cal.daysPerMonth || 30);
  const yDiff = (e.y - s.y);
  if(yDiff === 0) return Math.max(1, dayOfYear(e) - dayOfYear(s) + 1);
  return Math.max(1, (yDiff - 1) * daysPerYear + (daysPerYear - dayOfYear(s) + 1) + dayOfYear(e));
}

/* UI de configuración del calendario (colapsable) */
function buildCalendarConfigUI(T, redraw){
  const cal = T.calendar;
  const box = make(`<div class="cal-editor">
    <h4 style="cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none">
      <span data-caret>▼</span> 📅 Configuración del calendario
    </h4>
    <div data-body>
      <div class="grid2" style="margin-bottom:8px">
        <label class="field"><span>Nombre del año</span><input data-yearlabel value="${esc(cal.yearLabel||'Año')}" placeholder="Año, Ciclo, Era..."></label>
        <label class="field"><span>Días por defecto al mes</span><input data-days type="number" min="1" value="${cal.daysPerMonth||30}"></label>
      </div>
      <label class="field"><span>Días de la semana (separados por coma)</span>
        <input data-weekdays value="${esc((cal.weekdays||DEFAULT_WEEKDAYS).join(','))}" placeholder="Lun,Mar,Mié,Jue,Vie,Sáb,Dom">
      </label>
      <div style="font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--gold-soft);margin:10px 0 6px">Meses / divisiones</div>
      <div data-months></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
        <button class="btn small" data-addmonth>+ Añadir mes</button>
        <button class="btn small" data-gen12>Generar 12 meses</button>
      </div>
      <p class="hint" style="margin:8px 0 0">Cada mes puede tener días distintos. Haz clic en cualquier casilla del calendario para crear un hito en ese día.</p>
    </div>
  </div>`);
  const head = box.querySelector('h4');
  const bodyEl = box.querySelector('[data-body]');
  const caret = box.querySelector('[data-caret]');
  const KEY = 'codex_calcfg_open';
  let open = localStorage.getItem(KEY) !== '0';
  const setOpen = (v)=>{
    open = v;
    bodyEl.style.display = v ? '' : 'none';
    caret.textContent = v ? '▼' : '▶';
    localStorage.setItem(KEY, v ? '1' : '0');
  };
  head.onclick = ()=> setOpen(!open);
  setOpen(open);

  const yearLabelInp = box.querySelector('[data-yearlabel]');
  const daysInp = box.querySelector('[data-days]');
  const weekdaysInp = box.querySelector('[data-weekdays]');
  yearLabelInp.oninput = ()=>{ cal.yearLabel = yearLabelInp.value; touch(); };
  daysInp.oninput = ()=>{ cal.daysPerMonth = Math.max(1, parseInt(daysInp.value)||30); touch(); };
  weekdaysInp.oninput = ()=>{
    const arr = weekdaysInp.value.split(',').map(s=>s.trim()).filter(Boolean);
    if(arr.length) cal.weekdays = arr;
    touch();
  };
  const monthsBox = box.querySelector('[data-months]');
  function drawMonths(){
    monthsBox.innerHTML = '';
    if(!cal.months.length) monthsBox.innerHTML = '<div class="hint" style="margin:0">Sin meses. Usa "Generar 12 meses" o añade uno manualmente.</div>';
    cal.months.forEach((m, i)=>{
      const row = make(`<div class="cal-row">
        <input data-n value="${esc(m.name||'')}" placeholder="Nombre del mes">
        <input data-d type="number" min="1" value="${m.days||cal.daysPerMonth||30}" style="max-width:80px" title="Días">
        <button class="btn small" data-up title="Subir">▲</button>
        <button class="btn small" data-dn title="Bajar">▼</button>
        <button class="btn small danger" data-x title="Eliminar">✕</button>
      </div>`);
      row.querySelector('[data-n]').oninput = e => { m.name = e.target.value; touch(); };
      row.querySelector('[data-d]').oninput = e => { m.days = Math.max(1, parseInt(e.target.value)||cal.daysPerMonth||30); touch(); };
      row.querySelector('[data-up]').onclick = ()=>{ if(moveInArray(cal.months, i, -1)){ touch(); drawMonths(); redraw&&redraw(); } };
      row.querySelector('[data-dn]').onclick = ()=>{ if(moveInArray(cal.months, i, +1)){ touch(); drawMonths(); redraw&&redraw(); } };
      row.querySelector('[data-x]').onclick = ()=>{ cal.months.splice(i,1); touch(); drawMonths(); redraw&&redraw(); };
      monthsBox.appendChild(row);
    });
  }
  drawMonths();
  box.querySelector('[data-addmonth]').onclick = ()=>{
    cal.months.push({ name:'Mes ' + (cal.months.length+1), days: cal.daysPerMonth||30 });
    touch(); drawMonths(); redraw&&redraw();
  };
  box.querySelector('[data-gen12]').onclick = ()=>{
    const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    if(cal.months.length && !confirm('Ya hay meses. ¿Añadir 12 más igualmente?')) return;
    months.forEach(n => cal.months.push({ name:n, days: cal.daysPerMonth||30 }));
    touch(); drawMonths(); redraw&&redraw();
    toast('12 meses añadidos ✓');
  };
  return box;
}

function viewTimeline(){
  if(!ui.timeline) ui.timeline = { sel:null, q:'', highlight:null };
  if(!ui.timeline.q) ui.timeline.q = '';
  if(!P.story.timelines) P.story.timelines = [];
  if(!P.story.timelines.length) P.story.timelines.push(newTimeline('Cronología principal'));
  let T = P.story.timelines.find(x => x.id === ui.timeline.sel);
  if(!T){ T = P.story.timelines[0]; ui.timeline.sel = T.id; }
  ensureTimeline(T);

  const wrap = make(`<div class="split">
    <div class="pane-list">
      <div class="pane-head">
        <h3>Cronologías</h3>
        <div class="pane-actions">
          <button class="btn small primary" data-new title="Nueva cronología">+</button>
        </div>
      </div>
      <div class="list" data-list></div>
    </div>
    <div class="pane-detail" data-detail></div>
  </div>`);
  const list = wrap.querySelector('[data-list]');
  const detail = wrap.querySelector('[data-detail]');

  function drawList(){
    list.innerHTML = '';
    P.story.timelines.forEach(t => {
      ensureTimeline(t);
      const it = make(`<div class="list-item ${t.id === T.id ? 'active' : ''}">
        <span class="li-title">${esc(t.name || 'Sin nombre')}</span>
        <span class="li-sub">${t.hitos.length} hito${t.hitos.length === 1 ? '' : 's'}</span>
      </div>`);
      it.onclick = ()=>{ ui.timeline.sel = t.id; ui.timeline.highlight = null; T = t; ensureTimeline(T); drawList(); drawDetail(); };
      list.appendChild(it);
    });
  }

  function drawDetail(){
    detail.innerHTML = '';
    ensureTimeline(T);
    const box = make('<div class="paper"></div>');
    box.appendChild(titleRow(T.name, v => { T.name = v; touch(); drawList(); }, [
      {label:'📋 Copiar', onClick:()=>{ clipboard = {kind:'timeline', data:deepClone(T)}; toast('Copiado ✓'); }},
      {label:'⧉ Duplicar', onClick:()=>{
        const d = dupeItem(T); d.name = (T.name || 'Cronología') + ' (copia)';
        P.story.timelines.push(d); ui.timeline.sel = d.id; T = d;
        ensureTimeline(T); touch(); drawList(); drawDetail();
      }},
      {label:'🗑 Borrar', cls:'danger', onClick: async ()=>{
        if(P.story.timelines.length === 1){ toast('Debe quedar al menos una cronología'); return; }
        if(await pedirBorrado(T.name || 'esta cronología')){
          P.story.timelines = P.story.timelines.filter(x => x.id !== T.id);
          T = P.story.timelines[0]; ensureTimeline(T);
          ui.timeline.sel = T.id; touch(); drawList(); drawDetail();
        }
      }}
    ], 'Nombre de la cronología'));

    // Descripción
    const descWrap = make('<div style="margin-bottom:12px"></div>');
    descWrap.appendChild(createEditor(T.description, v=>{ T.description = v; touch(); }));
    box.appendChild(descWrap);

    // Cuerpo (donde vive cada vista)
    const body = make('<div data-body></div>');

    // Configuración del calendario
    box.appendChild(buildCalendarConfigUI(T, ()=>{ if(T.view.mode==='calendar') drawBody(); }));

    // Toolbar de vistas
    const modes = [
      { id:'vertical',   label:'↕ Vertical' },
      { id:'horizontal', label:'↔ Horizontal' },
      { id:'calendar',   label:'📅 Calendario' }
    ];
    const toolbar = make(`<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:14px 0">
      <div style="display:inline-flex;gap:4px" data-modes>
        ${modes.map(m => `<button class="btn small ${T.view.mode===m.id?'primary':''}" data-mode="${m.id}">${m.label}</button>`).join('')}
      </div>
      <span data-zoom></span>
      <button class="btn small" data-sort>⇅ Ordenar por fecha</button>
      <button class="btn small primary" data-newhito>+ Hito</button>
      <div style="flex:1;min-width:150px">
        <input class="pt-search" placeholder="🔍 Buscar hito..." style="width:100%">
      </div>
    </div>`);
    box.appendChild(toolbar);
    box.appendChild(body);
    detail.appendChild(box);

    const zoomSpan = toolbar.querySelector('[data-zoom]');

    searchInp.oninput = ()=>{ ui.timeline.q = searchInp.value; drawBody(); };

    toolbar.querySelectorAll('[data-mode]').forEach(b => {
      b.onclick = ()=>{ T.view.mode = b.dataset.mode; touch(); drawDetail(); };
    });
    toolbar.querySelector('[data-sort]').onclick = ()=>{
      T.hitos.sort((a,b)=> String(a.date||'').localeCompare(String(b.date||''),'es',{numeric:true}));
      touch(); drawBody(); toast('Ordenado por fecha');
    };
    toolbar.querySelector('[data-newhito]').onclick = ()=>{
      const h = newHito();
      T.hitos.push(h);
      touch();
      if(T.view.mode === 'calendar'){
        h.calStart = { y: T.calendar.currentYear||1, m: 0, d: 1 };
      }
      editarHito(h, true);
    };

    function updateZoomCtrl(){
      zoomSpan.innerHTML = '';
      if(T.view.mode === 'horizontal'){
        const z = make(`<span class="tl-zoom">
          <button data-zo title="Alejar">➖</button>
          <span class="tl-zoom-val">${Math.round((T.view.zoom||1)*100)}%</span>
          <button data-zi title="Acercar">➕</button>
          <button data-zr title="Restablecer">↺</button>
        </span>`);
        z.querySelector('[data-zo]').onclick = ()=>{ T.view.zoom = Math.max(0.25, (T.view.zoom||1)/1.25); touch(); updateZoomCtrl(); drawBody(); };
        z.querySelector('[data-zi]').onclick = ()=>{ T.view.zoom = Math.min(8, (T.view.zoom||1)*1.25); touch(); updateZoomCtrl(); drawBody(); };
        z.querySelector('[data-zr]').onclick = ()=>{ T.view.zoom = 1; touch(); updateZoomCtrl(); drawBody(); };
        zoomSpan.appendChild(z);

    function getFiltered(){
      const q = (ui.timeline.q||'').toLowerCase();
      return T.hitos.filter(t =>
        !q || (t.title||'').toLowerCase().includes(q) ||
        (t.date||'').toLowerCase().includes(q)  ||
        (t.desc||'').toLowerCase().includes(q)
      );
    }
    function emptyState(){
      return make('<div class="empty">' + (T.hitos.length ? 'Sin resultados.' : 'Esta cronología está vacía.') + '</div>');
    }

    function drawVertical(){
      body.innerHTML = '';

      const tl = make('<div class="tl"></div>');

        mk('▲','Subir',()=>{ if(moveInArray(T.hitos, i, -1)){ touch(); drawBody(); }});

      card.querySelector('[data-del]').onclick = async (e)=>{
        e.stopPropagation();
        if(await pedirBorrado(t.title||'este hito')){ T.hitos = T.hitos.filter(x=>x.id!==t.id); touch(); drawBody(); }
      };
      return card;
    }
    function drawHorizontal(){
      body.innerHTML = '';
      const arr = getFiltered();
      if(!arr.length){ body.appendChild(emptyState()); return; }
      const parsed = arr.map(t => ({ t, year: parseTimelineYear(t.date) }));
      const validYears = parsed.filter(p => p.year !== null).map(p => p.year);
      if(!validYears.length){
        body.appendChild(make('<div class="empty">Los hitos no tienen fechas numéricas.<br><small>Usa "342", "342 d.C." o "1500 a.C."</small></div>'));
        return;
      }
      const minYear = Math.min(...validYears);
      const maxYear = Math.max(...validYears);
      let lastYear = minYear;
      parsed.forEach(p => { if(p.year === null) p.year = lastYear; else lastYear = p.year; });
      parsed.sort((a,b) => a.year - b.year);
      const groups = [];
      parsed.forEach(p => {
        const last = groups[groups.length - 1];
        if(last && last.year === p.year) last.items.push(p.t);
        else groups.push({ year: p.year, items: [p.t], pos: 0 });
      });
      const zoom = T.view.zoom || 1;
      const PADDING = 160, COL_W = 250, MIN_GAP = COL_W + 30;
      const range = maxYear - minYear;
      const naturalWidth = Math.max(groups.length * 300, range * 5);
      const innerWidth = Math.max(900, naturalWidth * zoom);
      let prevPos = -Infinity;
      groups.forEach(g => {
        let pos;
        if(range === 0) pos = PADDING + innerWidth / 2;
        else pos = PADDING + ((g.year - minYear) / range) * innerWidth;
        if(pos < prevPos + MIN_GAP) pos = prevPos + MIN_GAP;
        g.pos = pos; prevPos = pos;
      });
      const railWidth = (groups.length ? groups[groups.length-1].pos : PADDING) + PADDING + COL_W/2;
      const wrapEl = make('<div class="tl-h-wrap"></div>');
      const rail = make(`<div class="tl-h-rail" style="width:${railWidth}px"></div>`);
      rail.appendChild(make('<div class="tl-h-axis"></div>'));
      groups.forEach((g, gi) => {
        const up = gi % 2 === 0;
        const col = make(`<div class="tl-h-col" style="left:${g.pos}px"></div>`);
        const topArea = make('<div class="tl-h-area top"></div>');
        const bottomArea = make('<div class="tl-h-area bottom"></div>');
        const center = make(`<div class="tl-h-center">
          <div class="tl-h-year">${esc(g.year)}</div>
          <div class="tl-h-dot"></div>
        </div>`);
        const stack = make('<div class="tl-h-stack"></div>');
        g.items.forEach(t => {
          const i = T.hitos.indexOf(t);
          stack.appendChild(makeHCard(t, i));
        });
        if(up) topArea.appendChild(stack); else bottomArea.appendChild(stack);
        col.appendChild(topArea); col.appendChild(center); col.appendChild(bottomArea);
        rail.appendChild(col);
      });
      wrapEl.appendChild(rail);
      body.appendChild(wrapEl);
    }

    /* ---------- Vista calendario ---------- */
    function drawCalendar(){
      body.innerHTML = '';
      const cal = T.calendar;
      const months = cal.months || [];
      if(!months.length){
        body.appendChild(make(`<div class="empty">
          Configura los meses del calendario arriba para usarlo.<br>
          <button class="btn small primary" style="margin-top:10px" data-quickgen>Generar 12 meses</button>
        </div>`));
        const qb = body.querySelector('[data-quickgen]');
        if(qb) qb.onclick = ()=>{
          const names = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
          names.forEach(n => cal.months.push({ name:n, days: cal.daysPerMonth||30 }));
          touch(); drawDetail();
        };
        return;
      }

      const year = cal.currentYear || 1;
      const weekdays = (cal.weekdays && cal.weekdays.length) ? cal.weekdays : DEFAULT_WEEKDAYS;
      const daysPerWeek = weekdays.length;

      const nav = make(`<div class="cal-nav">
        <button class="btn small" data-prev>◀ ${esc(cal.yearLabel||'Año')} ${year-1}</button>
        <span class="cal-year-label">${esc(cal.yearLabel||'Año')} ${year}</span>
        <button class="btn small" data-next>${esc(cal.yearLabel||'Año')} ${year+1} ▶</button>
      </div>`);
      nav.querySelector('[data-prev]').onclick = ()=>{ cal.currentYear = year - 1; touch(); drawCalendar(); };
      nav.querySelector('[data-next]').onclick = ()=>{ cal.currentYear = year + 1; touch(); drawCalendar(); };
      body.appendChild(nav);

      const monthsWrap = make('<div class="cal-months"></div>');
      body.appendChild(monthsWrap);

      const hitosWithCal = T.hitos.filter(h => h.calStart);
      const hitosInYear = hitosWithCal.filter(h => {
        const s = h.calStart, e = h.calEnd || s;
        return s.y === year || e.y === year ||
               (s.y < year && e.y > year);
      });

      let cumulativeDays = 0;
      months.forEach((m, mi)=>{
        const monthDays = m.days || cal.daysPerMonth || 30;
        const startOffset = cumulativeDays % daysPerWeek;

        const monthWrap = make(`<div class="cal-month-wrap">
          <div class="cal-month-title">${esc(m.name||('Mes '+(mi+1)))}</div>
          <div class="cal-grid"></div>
        </div>`);
        const grid = monthWrap.querySelector('.cal-grid');
        grid.style.gridTemplateColumns = `repeat(${daysPerWeek}, 1fr)`;

        weekdays.forEach(w => grid.appendChild(make(`<div class="cal-weekday">${esc(w)}</div>`)));
        for(let i=0;i<startOffset;i++) grid.appendChild(make('<div class="cal-cell cal-empty"></div>'));

        for(let d=1; d<=monthDays; d++){
          const cell = make(`<div class="cal-cell" data-day="${d}">
            <div class="cal-day-num">${d}</div>
            <div class="cal-chips" data-chips></div>
          </div>`);
          grid.appendChild(cell);
        }
        const totalCells = startOffset + monthDays;
        const rem = totalCells % daysPerWeek;
        if(rem){
          for(let i=0; i<daysPerWeek - rem; i++) grid.appendChild(make('<div class="cal-cell cal-empty"></div>'));
        }

        // Hitos
        hitosInYear.forEach(h => {
          const s = h.calStart;
          const e = h.calEnd || s;
          let startDay, endDay;
          if(s.y === year && e.y === year){
            if(s.m === mi && e.m === mi){ startDay = s.d; endDay = e.d; }
            else if(s.m === mi && e.m > mi){ startDay = s.d; endDay = monthDays; }
            else if(s.m < mi && e.m === mi){ startDay = 1; endDay = e.d; }
            else if(s.m < mi && e.m > mi){ startDay = 1; endDay = monthDays; }
            else return;
          } else if(s.y < year && e.y === year){
            if(e.m === mi){ startDay = 1; endDay = e.d; }
            else if(e.m > mi){ startDay = 1; endDay = monthDays; }
            else return;
          } else if(s.y === year && e.y > year){
            if(s.m === mi){ startDay = s.d; endDay = monthDays; }
            else if(s.m < mi){ startDay = 1; endDay = monthDays; }
            else return;
          } else if(s.y < year && e.y > year){
            startDay = 1; endDay = monthDays;
          } else return;

          for(let d = startDay; d <= endDay; d++){
            const cell = grid.querySelector(`.cal-cell[data-day="${d}"]`);
            if(cell) cell.classList.add('cal-in-range');
          }

          const chipDay = (s.y === year && s.m === mi) ? s.d : 1;
          const cell = grid.querySelector(`.cal-cell[data-day="${chipDay}"]`);
          if(cell){
            const dur = calcHitoDuration(h, cal);
            const chip = make(`<div class="cal-chip" style="background:${esc(h.calColor||'#c9a227')}" title="${esc(h.title||'Hito')}">${esc((h.title||'Hito').slice(0, 18))}${dur>1?` · ${dur}d`:''}</div>`);
            chip.onclick = (ev)=>{ ev.stopPropagation(); editarHito(h); };
            cell.querySelector('[data-chips]').appendChild(chip);
          }
        });

        // Clic en celda → nuevo hito
        grid.querySelectorAll('.cal-cell:not(.cal-empty)').forEach(cell => {
          cell.onclick = (ev)=>{
            if(ev.target.closest('.cal-chip')) return;
            const d = parseInt(cell.dataset.day);
            const h = newHito();
            h.calStart = { y: year, m: mi, d };
            T.hitos.push(h);
            touch();
            editarHito(h, true);
          };
        });

        monthsWrap.appendChild(monthWrap);
        cumulativeDays += monthDays;
      });
    }

    /* ---------- Editor de hito ---------- */
    function editarHito(t, isNew){
      const cal = T.calendar;
      const hasMonths = cal.months && cal.months.length;
      const evOpts = P.story.events.map(e => `<option value="${e.id}" ${t.eventId===e.id?'selected':''}>${esc(e.title||'Sin título')}</option>`).join('');
      const monthsOpts = hasMonths
        ? cal.months.map((m,i) => `<option value="${i}">${esc(m.name||('Mes '+(i+1)))}</option>`).join('')
        : '';
      const s = t.calStart || { y: cal.currentYear || 1, m: 0, d: 1 };
      const en = t.calEnd;

      openModal(`<h3>⏳ ${t.title?'Editar':'Nuevo'} hito</h3>
        <label class="field"><span>Título</span><input data-t value="${esc(t.title||'')}" autofocus></label>
        <label class="field"><span>Fecha (texto libre)</span><input data-f value="${esc(t.date||'')}" placeholder="Año 342 d.C."></label>
        ${hasMonths ? `
        <div style="border-top:1px solid var(--line);margin:10px 0;padding-top:10px">
          <div style="font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--gold-soft);margin-bottom:6px">📅 Fecha en el calendario</div>
          <div style="display:grid;grid-template-columns:1fr 2fr 1fr;gap:6px">
            <label class="field" style="margin:0"><span>Año</span><input data-sy type="number" value="${s.y||1}"></label>
            <label class="field" style="margin:0"><span>Mes</span><select data-sm>${monthsOpts}</select></label>
            <label class="field" style="margin:0"><span>Día</span><input data-sd type="number" min="1" value="${s.d||1}"></label>
          </div>
          <label class="field" style="margin-top:8px;display:flex;align-items:center;gap:8px">
            <input type="checkbox" data-has-end ${en?'checked':''} style="width:auto;margin:0;accent-color:var(--gold)">
            <span style="margin:0">Añadir fecha de fin (duración)</span>
          </label>
          <div data-end-fields style="display:${en?'block':'none'}">
            <div style="display:grid;grid-template-columns:1fr 2fr 1fr;gap:6px">
              <label class="field" style="margin:0"><span>Año fin</span><input data-ey type="number" value="${en?en.y:s.y}"></label>
              <label class="field" style="margin:0"><span>Mes fin</span><select data-em>${monthsOpts}</select></label>
              <label class="field" style="margin:0"><span>Día fin</span><input data-ed type="number" min="1" value="${en?en.d:s.d}"></label>
            </div>
          </div>
          <label class="field" style="margin-top:8px"><span>Color del hito</span><input data-color type="color" value="${t.calColor||'#c9a227'}"></label>
        </div>` : ''}
        <label class="field"><span>Descripción</span><textarea data-d>${esc(t.desc||'')}</textarea></label>
        <label class="field"><span>Evento vinculado</span>
          <select data-e><option value="">— Ninguno —</option>${evOpts}</select></label>
        <div class="modal-actions">
          <button class="btn" data-no>Cancelar</button>
          <button class="btn primary" data-yes>Guardar</button>
        </div>`,
        m=>{
          if(hasMonths){
            m.querySelector('[data-sm]').value = s.m || 0;
            if(en) m.querySelector('[data-em]').value = en.m || 0;
            const cb = m.querySelector('[data-has-end]');
            const ef = m.querySelector('[data-end-fields]');
            cb.onchange = ()=>{ ef.style.display = cb.checked ? 'block' : 'none'; };
          }
          m.querySelector('[data-no]').onclick = ()=>{
            closeModal();
            if(isNew){
              const idx = T.hitos.indexOf(t);
              if(idx >= 0) T.hitos.splice(idx, 1);
              touch(); drawBody();
            }
          };
          m.querySelector('[data-yes]').onclick = ()=>{
            t.title = m.querySelector('[data-t]').value;
            t.date = m.querySelector('[data-f]').value;
            t.desc = m.querySelector('[data-d]').value;
            t.eventId = m.querySelector('[data-e]').value || null;
            if(hasMonths){
              t.calColor = m.querySelector('[data-color]').value;
              t.calStart = {
                y: parseInt(m.querySelector('[data-sy]').value) || 1,
                m: parseInt(m.querySelector('[data-sm]').value) || 0,
                d: parseInt(m.querySelector('[data-sd]').value) || 1
              };
              if(m.querySelector('[data-has-end]').checked){
                t.calEnd = {
                  y: parseInt(m.querySelector('[data-ey]').value) || t.calStart.y,
                  m: parseInt(m.querySelector('[data-em]').value) || 0,
                  d: parseInt(m.querySelector('[data-ed]').value) || 1
                };
              } else {
                t.calEnd = null;
              }
            }
            closeModal(); touch(); drawBody();
          };
        });
    }

    function drawBody(){
      updateZoomCtrl();
      if(T.view.mode === 'horizontal') drawHorizontal();
      else if(T.view.mode === 'calendar') drawCalendar();
      else drawVertical();
    }

    drawBody();
  }

  wrap.querySelector('[data-new]').onclick = ()=>{
    const nt = newTimeline('Cronología ' + (P.story.timelines.length + 1));
    P.story.timelines.push(nt);
    ui.timeline.sel = nt.id; ui.timeline.q = ''; T = nt;
    ensureTimeline(T);
    touch(); drawList(); drawDetail(); toast('Cronología creada ✓');
  };
  drawList(); drawDetail();
  return wrap;
}

/* ==== 8.6 Ideas ==== */
function viewIdeas(){
  if(!P.story.ideaFolders) P.story.ideaFolders = [];
  if(!ui.ideas.sel) ui.ideas.sel = [];

  const wrap = make(`<div class="split">
    <div class="pane-list">
      <div class="pane-head">
        <h3>Ideas</h3>
        <div class="pane-actions">
          <button class="btn small" data-newfolder title="Nueva carpeta">📁+</button>
          <button class="btn small" data-paste title="Pegar">📥</button>
          <button class="btn small primary" data-new>+</button>
        </div>
      </div>
      <div data-tools></div>
      <div data-bulk></div>
      <div class="list" data-list></div>
    </div>
    <div class="pane-detail" data-detail></div>
  </div>`);
  const list = wrap.querySelector('[data-list]');
  const detail = wrap.querySelector('[data-detail]');
  const toolsBox = wrap.querySelector('[data-tools]');
  const bulkBox = wrap.querySelector('[data-bulk]');

  let drawDetailRef = null;

  const ctrl = makeFolderedList({
    listEl: list, bulkEl: bulkBox,
    getItems: () => P.story.ideas,
    getFolders: () => P.story.ideaFolders,
    getSel: () => ui.ideas.sel,
    setSel: v => { ui.ideas.sel = v; },
    foldersOpen: ui.ideaFoldersOpen,
    renderItemHTML: (i) =>
      `<span class="li-title">${esc(i.title||'Idea sin título')}</span>
       <span class="li-sub">${esc([i.type, i.status].filter(Boolean).join(' · ') || 'Sin definir')}</span>`,
    onSelect: id => { sel.ideas = id; drawDetailRef && drawDetailRef(); },
    onTouch: touch,
    emptyLabel: 'Sin ideas todavía.',
    allowMove: () => (ui.ideas.sort==='custom') && !ui.ideas.q,
    getSorted: () => {
      const mode = ui.ideas.sort || 'custom';
      let arr = applyFilter(P.story.ideas, ui.ideas.q, [i=>i.title, i=>i.status, i=>i.type]);
      if(mode !== 'custom') arr = applySort(arr, mode, i=>i.title);
      return arr;
    }
  });

  function drawDetail(){
    detail.innerHTML = '';
    if(!P.story.ideas.length){ detail.appendChild(make('<div class="paper empty">Selecciona o crea una idea.</div>')); return; }
    let it = P.story.ideas.find(x=>x.id===sel.ideas);
    if(!it){ it = P.story.ideas[0]; sel.ideas = it.id; }
    const box = make('<div class="paper"></div>');
    box.appendChild(titleRow(it.title, v=>{ it.title = v; touch(); ctrl.drawList(); }, [
      {label:'📋 Copiar', onClick:()=>{ clipboard = {kind:'idea', data:deepClone(it)}; toast('Copiado ✓'); }},
      {label:'⧉ Duplicar', onClick:()=>{
          const d = dupeItem(it); d.title = (it.title||'Idea') + ' (copia)';
          const idx = P.story.ideas.indexOf(it); P.story.ideas.splice(idx+1,0,d);
          sel.ideas = d.id; touch(); ctrl.drawList(); drawDetail();
        }},
      {label:'🗑 Borrar', cls:'danger', onClick: async ()=>{
          if(await pedirBorrado(it.title||'esta idea')){
            P.story.ideas = P.story.ideas.filter(x=>x.id!==it.id);
            ui.ideas.sel = ui.ideas.sel.filter(x=>x!==it.id);
            sel.ideas = null; touch(); ctrl.drawList(); drawDetail();
          }
        }}
    ], 'Título de la idea'));

    // Tipo
    const typeWrap = make(`<label class="field"><span>Tipo de idea</span><select></select></label>`);
    const ts = typeWrap.querySelector('select');
    const oNone = document.createElement('option'); oNone.value=''; oNone.textContent='— Sin definir —'; ts.appendChild(oNone);
    IDEA_TYPES.forEach(t=>{ const o = document.createElement('option'); o.value=t; o.textContent=t; ts.appendChild(o); });
    if(it.type && !IDEA_TYPES.includes(it.type)){ const o = document.createElement('option'); o.value=it.type; o.textContent=it.type; ts.appendChild(o); }
    const oCustom = document.createElement('option'); oCustom.value='__custom__'; oCustom.textContent='+ Otro…'; ts.appendChild(oCustom);
    ts.value = it.type || '';
    ts.onchange = ()=>{
      if(ts.value === '__custom__'){
        pedir('Otro tipo', [{key:'v', label:'Escribe el tipo', value:'', autofocus:true}]).then(r=>{
          if(r && r.v.trim()){ it.type = r.v.trim(); touch(); ctrl.drawList(); drawDetail(); }
        });
        return;
      }
      it.type = ts.value; touch(); ctrl.drawList();
    };
    box.appendChild(typeWrap);

    // Estado
    const estadoWrap = make(`<label class="field"><span>Estado</span><select></select></label>`);
    const es = estadoWrap.querySelector('select');
    IDEA_STATUS.forEach(e=>{ const o = document.createElement('option'); o.value=e; o.textContent=e; es.appendChild(o); });
    es.value = it.status || 'Sin definir';
    es.onchange = ()=>{ it.status = es.value; touch(); ctrl.drawList(); };
    box.appendChild(estadoWrap);

    // Carpeta
    const folderWrap = make(`<label class="field"><span>Carpeta</span>
      <select>
        <option value="">— Sin carpeta —</option>
        ${P.story.ideaFolders.map(f=>`<option value="${esc(f)}" ${it.folder===f?'selected':''}>${esc(f)}</option>`).join('')}
      </select></label>`);
    folderWrap.querySelector('select').onchange = e=>{ it.folder = e.target.value; touch(); ctrl.drawList(); };
    box.appendChild(folderWrap);

    box.appendChild(createEditor(it.content, v=>{ it.content = v; touch(); }));
    detail.appendChild(box);
  }
  drawDetailRef = drawDetail;

  toolsBox.appendChild(makePaneTools('ideas', ctrl.drawList, '🔍 Buscar idea...'));
  wrap.querySelector('[data-new]').onclick = ()=>{
    const i = { id: uid(), title:'', status:'Sin definir', type:'', content:'', folder:'' };
    P.story.ideas.push(i); sel.ideas = i.id; touch(); ctrl.drawList(); drawDetail();
  };
  wrap.querySelector('[data-paste]').onclick = ()=>{
    if(!clipboard || clipboard.kind!=='idea'){ toast('Nada que pegar'); return; }
    const d = dupeItem(clipboard.data);
    P.story.ideas.push(d); sel.ideas = d.id; touch(); ctrl.drawList(); drawDetail(); toast('Pegado ✓');
  };
  wrap.querySelector('[data-newfolder]').onclick = async ()=>{
    const v = await pedir('📁 Nueva carpeta', [{key:'n', label:'Nombre', value:'', autofocus:true}]);
    if(v && v.n.trim()){
      const name = v.n.trim();
      if(P.story.ideaFolders.includes(name)){ toast('Ya existe esa carpeta'); return; }
      P.story.ideaFolders.push(name); touch(); ctrl.drawList();
    }
  };
  ctrl.drawList(); drawDetail();
  return wrap;
}

/* ==== Helper makeFolderedList (compartido) ==== */
function makeFolderedList(cfg){
  const { listEl, bulkEl, getItems, getFolders, getSel, setSel,
          foldersOpen, renderItemHTML, onSelect, onTouch,
          emptyLabel, allowMove, getSorted } = cfg;
  let lastId = null;
  const isSelected = id => getSel().includes(id);

  function toggleSel(id, additive){
    const s = getSel().slice();
    if(additive){
      const i = s.indexOf(id);
      if(i>=0) s.splice(i,1); else s.push(id);
    } else {
      setSel(s.length===1 && s[0]===id ? [] : [id]);
      return;
    }
    setSel(s);
  }
  function selectRange(fromId, toId){
    const items = getItems();
    const a = items.findIndex(x=>x.id===fromId);
    const b = items.findIndex(x=>x.id===toId);
    if(a<0||b<0) return;
    const [x,y] = a<b ? [a,b] : [b,a];
    setSel(items.slice(x,y+1).map(z=>z.id));
  }
  function moveTo(ids, folder){
    getItems().forEach(it=>{ if(ids.includes(it.id)) it.folder = folder; });
    onTouch && onTouch();
    drawList();
  }
  function showFolderMenu(anchorEl, ids){
    document.querySelectorAll('.folder-quick-menu').forEach(m=>m.remove());
    const menu = make(`<div class="folder-quick-menu"></div>`);
    Object.assign(menu.style, { position:'fixed', zIndex:'500',
      background:'linear-gradient(180deg,var(--paper2),var(--bg2))',
      border:'1px solid var(--gold-soft)', borderRadius:'6px',
      padding:'6px', minWidth:'180px', boxShadow:'0 12px 30px #000c' });
    const mkItem = (label, folder)=>{
      const b = make(`<div class="pickitem">${esc(label)}</div>`);
      b.onclick = ()=>{ moveTo(ids, folder); menu.remove(); };
      menu.appendChild(b);
    };
    mkItem('📂 Sin carpeta', '');
    getFolders().forEach(f=> mkItem('📁 '+f, f));
    document.body.appendChild(menu);
    const r = anchorEl.getBoundingClientRect();
    const mw = menu.offsetWidth, mh = menu.offsetHeight;
    let left = r.left, top = r.bottom + 4;
    if(left + mw > window.innerWidth - 8) left = window.innerWidth - mw - 8;
    if(top + mh > window.innerHeight - 8) top = r.top - mh - 4;
    menu.style.left = left+'px'; menu.style.top = top+'px';
    const close = (e)=>{ if(!menu.contains(e.target)){ menu.remove(); document.removeEventListener('mousedown', close); } };
    setTimeout(()=> document.addEventListener('mousedown', close), 0);
  }
  function drawBulk(){
    if(!bulkEl) return;
    bulkEl.innerHTML = '';
    const sel = getSel();
    if(!sel.length) return;
    const bar = make(`<div class="char-bulk">
      <span class="info">${sel.length} seleccionado${sel.length>1?'s':''}</span>
      <select data-folder title="Mover a carpeta...">
        <option value="__pick__">Mover a →</option>
        <option value="">📂 Sin carpeta</option>
        ${getFolders().map(f=>`<option value="${esc(f)}">📁 ${esc(f)}</option>`).join('')}
      </select>
      <button class="btn small" data-clear title="Deseleccionar">✕</button>
    </div>`);
    const s = bar.querySelector('[data-folder]');
    s.onchange = ()=>{ if(s.value==='__pick__') return; moveTo(sel, s.value); s.value='__pick__'; };
    bar.querySelector('[data-clear]').onclick = ()=>{ setSel([]); drawList(); };
    bulkEl.appendChild(bar);
  }
  function wrapItem(item, showMove){
    const selected = isSelected(item.id);
    const el = make(`<div class="list-item has-check ${selected?'selected':''}">
      <input type="checkbox" class="li-check" ${selected?'checked':''}>
      ${renderItemHTML(item)}
      <div class="li-move">
        ${showMove ? '<button class="li-drag" data-drag>⠿</button><button data-up>▲</button><button data-dn>▼</button>' : ''}
        <button class="folder-btn" data-folder title="Mover a carpeta">📁</button>
      </div>
    </div>`);
    el.dataset.id = item.id;
    if(showMove){
      makeDragHandle(el.querySelector('[data-drag]'), el, {
        getIds: () => (isSelected(item.id) && getSel().length>1) ? getSel().slice() : [item.id],
        items: getItems(),
        moveToFolder: (ids, folder) => moveTo(ids, folder),
        onReorder: () => { onTouch && onTouch(); drawList(); }
      });
    }
    el.onclick = (e)=>{
      if(e.target.closest('.li-move') || e.target.classList.contains('li-check')) return;
      if(e.ctrlKey || e.metaKey){ toggleSel(item.id, true); lastId = item.id; drawList(); }
      else if(e.shiftKey && lastId){ selectRange(lastId, item.id); drawList(); }
      else { setSel([item.id]); lastId = item.id; onSelect && onSelect(item.id); drawList(); }
    };
    el.querySelector('.li-check').onclick = (e)=>{ e.stopPropagation(); toggleSel(item.id, true); if(!lastId) lastId = item.id; drawList(); };
    const items = getItems();
    const idx = items.indexOf(item);
    if(showMove){
      el.querySelector('[data-up]').onclick = (e)=>{ e.stopPropagation(); if(moveInArray(items, idx, -1)){ onTouch&&onTouch(); drawList(); } };
      el.querySelector('[data-dn]').onclick = (e)=>{ e.stopPropagation(); if(moveInArray(items, idx, +1)){ onTouch&&onTouch(); drawList(); } };
    }
    el.querySelector('[data-folder]').onclick = (e)=>{
      e.stopPropagation();
      const ids = (isSelected(item.id) && getSel().length>1) ? getSel().slice() : [item.id];
      showFolderMenu(e.currentTarget, ids);
    };
    return el;
  }
  function makeHeader(folder, count, open, isNoFolder){
    const header = make(`<div class="folder-header">
      <span class="caret">${open?'▼':'▶'}</span>
      <span class="fname">${isNoFolder?'📂 Sin carpeta':'📁 '+esc(folder)}</span>
      <span class="fcount">${count}</span>
      ${isNoFolder ? '' : `<span class="fbtns">
        <button class="btn small" data-ren>✎</button>
        <button class="btn small danger" data-delf>✕</button>
      </span>`}
    </div>`);
    header.dataset.folder = isNoFolder ? '' : folder;
    const key = isNoFolder ? '__nofolder__' : folder;
    const toggle = (e)=>{ if(e) e.stopPropagation(); foldersOpen[key] = !open; drawList(); };
    header.querySelector('.caret').onclick = toggle;
    header.querySelector('.fname').onclick = toggle;
    if(!isNoFolder){
      header.querySelector('[data-ren]').onclick = async (e)=>{
        e.stopPropagation();
        const v = await pedir('✎ Renombrar carpeta', [{key:'n', label:'Nuevo nombre', value:folder, autofocus:true}]);
        if(v && v.n.trim()){
          const nn = v.n.trim();
          getItems().forEach(it => { if(it.folder === folder) it.folder = nn; });
          const arr = getFolders();
          const i = arr.indexOf(folder);
          if(i>=0) arr[i] = nn;
          onTouch&&onTouch(); drawList();
        }
      };
      header.querySelector('[data-delf]').onclick = async (e)=>{
        e.stopPropagation();
        if(await confirmar('¿Eliminar la carpeta "'+folder+'"? Los elementos NO se borrarán.')){
          getItems().forEach(it => { if(it.folder === folder) it.folder = ''; });
          const arr = getFolders();
          const i = arr.indexOf(folder);
          if(i>=0) arr.splice(i,1);
          onTouch&&onTouch(); drawList();
        }
      };
    }
    return header;
  }
  function drawList(){
    listEl.innerHTML = '';
    const idSet = new Set(getItems().map(i=>i.id));
    setSel(getSel().filter(id => idSet.has(id)));
    drawBulk();
    const items = getItems();
    const folders = getFolders();
    if(!items.length && !folders.length){
      listEl.innerHTML = `<div class="empty">${esc(emptyLabel||'Sin elementos.')}</div>`;
      return;
    }
    const noFolder = [];
    const byFolder = {};
    folders.forEach(f => byFolder[f] = []);
    const sorted = getSorted ? getSorted() : items;
    sorted.forEach(it => {
      if(it.folder && folders.includes(it.folder)) byFolder[it.folder].push(it);
      else noFolder.push(it);
    });
    const showMove = !!(allowMove && allowMove());
    folders.forEach(folder => {
      const arr = byFolder[folder];
      const open = foldersOpen[folder] !== false;
      listEl.appendChild(makeHeader(folder, arr.length, open, false));
      if(open){
        const cont = make('<div class="folder-children"></div>');
        if(!arr.length) cont.appendChild(make('<div class="folder-empty">— vacía —</div>'));
        arr.forEach(it => cont.appendChild(wrapItem(it, showMove)));
        listEl.appendChild(cont);
      }
    });
    if(noFolder.length || !folders.length){
      if(folders.length){
        const open = foldersOpen['__nofolder__'] !== false;
        listEl.appendChild(makeHeader('', noFolder.length, open, true));
        if(open){
          const cont = make('<div class="folder-children"></div>');
          noFolder.forEach(it => cont.appendChild(wrapItem(it, showMove)));
          listEl.appendChild(cont);
        }
      } else {
        noFolder.forEach(it => listEl.appendChild(wrapItem(it, showMove)));
      }
    }
  }
  return { drawList, isSelected, toggleSel, moveTo, showFolderMenu };
}

  function moveToFolder(ids, folder){

  function showFolderMenu(anchorEl, ids){
    $$('.folder-quick-menu').forEach(m=>m.remove());
    const menu = make(`<div class="folder-quick-menu"></div>`);
    Object.assign(menu.style, { position:'fixed', zIndex:'500',
      background:'linear-gradient(180deg,var(--paper2),var(--bg2))', border:'1px solid var(--gold-soft)',
      borderRadius:'6px', padding:'6px', minWidth:'180px', boxShadow:'0 12px 30px #000c' });
    const mkItem = (label, folder)=>{
      const b = make(`<div class="pickitem">${esc(label)}</div>`);
      b.onclick = ()=>{ moveToFolder(ids, folder); menu.remove(); };
      menu.appendChild(b);
    };
    mkItem('📂 Sin carpeta', '');
    P.charFolders.forEach(f=> mkItem('📁 '+f, f));
    document.body.appendChild(menu);
    const r = anchorEl.getBoundingClientRect();
    const mw = menu.offsetWidth, mh = menu.offsetHeight;
    let left = r.left, top = r.bottom + 4;
    if(left + mw > window.innerWidth - 8) left = window.innerWidth - mw - 8;
    if(top + mh > window.innerHeight - 8) top = r.top - mh - 4;
    menu.style.left = left+'px'; menu.style.top = top+'px';
    const close = (e)=>{ if(!menu.contains(e.target)){ menu.remove(); document.removeEventListener('mousedown', close); } };

  function drawList(){
    list.innerHTML = '';
    ui.characters.sel = (ui.characters.sel||[]).filter(id => P.characters.some(c=>c.id===id));

    const q = (ui.characters.q||'').toLowerCase();
    const mode = ui.characters.sort || 'custom';
    const F = ui.characters.filters;
    let filtered = P.characters.filter(c => {
      if(q && !((c.name||'').toLowerCase().includes(q) || (c.nickname||'').toLowerCase().includes(q) || stripHtml(c.short).toLowerCase().includes(q))) return false;
      if(F.age && !((c.age||'').toLowerCase().includes(F.age.toLowerCase()))) return false;
      if(F.gender && c.gender !== F.gender) return false;
      if(F.roll && c.roll !== F.roll) return false;
      if(F.storyRole && c.storyRole !== F.storyRole) return false;
      return true;
    });
    let sorted = mode === 'custom' ? filtered.slice() : applySort(filtered, mode, c=>c.name);
    const showMove = mode === 'custom' && !q;

    if(!P.characters.length && !P.charFolders.length){
      list.innerHTML = '<div class="empty">Sin personajes todavía.</div>';

    const noFolder = [];

    sorted.forEach(c => {

      else noFolder.push(c);

    P.charFolders.forEach(folder => {

    const srWrap = make(`<label class="field"><span>Papel en la historia</span><select>
      <option value="">— Sin definir —</option>
      ${CHAR_STORY_ROLES.map(g=>`<option value="${esc(g)}" ${c.storyRole===g?'selected':''}>${esc(g)}</option>`).join('')}
    </select></label>`);
    srWrap.querySelector('select').onchange = (e)=>{ c.storyRole = e.target.value; touch(); drawList(); };
    rp.appendChild(srWrap);
    box.appendChild(rp);

    box.appendChild(fieldInput('Descripción breve', c.short, v=>{ c.short = v; touch(); drawList(); }, 'Una frase que lo defina...'));

    // Datos personalizados (key-value)
    const dBox = make('<div style="margin:16px 0"></div>');
    dBox.appendChild(make('<h3 style="font-size:14px;letter-spacing:1px;color:var(--gold-soft);text-transform:uppercase;margin-bottom:8px">Datos del personaje</h3>'));
    const dlist = make('<div></div>');
    function drawFields(){
      dlist.innerHTML = '';
      (c.fields||[]).forEach((f,i)=>{
        const row = make(`<div class="pinrow" style="margin-bottom:6px">
          <input data-l value="${esc(f.label||'')}" placeholder="Etiqueta" style="max-width:150px">
          <input data-v value="${esc(f.value||'')}" placeholder="Valor">
          <button class="btn small danger">✕</button>
        </div>`);
        row.querySelector('[data-l]').oninput = e => { f.label = e.target.value; touch(); };
        row.querySelector('[data-v]').oninput = e => { f.value = e.target.value; touch(); };
        row.querySelector('button').onclick = ()=>{ c.fields.splice(i,1); touch(); drawFields(); };
        dlist.appendChild(row);
      });
    }
    drawFields();
    dBox.appendChild(dlist);
    const addBtn = make('<button class="btn small" style="margin-top:6px">+ Añadir dato</button>');
    addBtn.onclick = ()=>{ c.fields = c.fields || []; c.fields.push(newField()); touch(); drawFields(); };
    dBox.appendChild(addBtn);
    box.appendChild(dBox);

    // Secciones dinámicas
        box.appendChild(make('<div style="font-size:13px;letter-spacing:1px;color:var(--gold-soft);text-transform:uppercase;margin-top:14px">Secciones de texto</div>'));
    box.appendChild(makeSectionsUI(c, ()=>{ touch(); }));

    box.appendChild(make('<div style="font-size:13px;letter-spacing:1px;color:var(--gold-soft);text-transform:uppercase;margin-top:18px">Estadísticas</div>'));
    box.appendChild(makeStatsUI(c, ()=>{ touch(); }));

    // Relaciones (todas las redes)
    const relBox = make('<div class="paper" style="margin-top:16px;padding:16px 18px"></div>');
    relBox.appendChild(make('<h3 style="font-size:13px;color:var(--gold-soft);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px">🕸 Relaciones</h3>'));
    const relList = make('<div></div>');
    function drawRels(){
      relList.innerHTML = '';
      const allRels = [];
      (P.charnets||[]).forEach(net=>{
        (net.relations||[]).forEach(r=>{
          if(r.a===c.id || r.b===c.id) allRels.push({ rel:r, net });
        });
      });
      if(!allRels.length){
        relList.innerHTML = '<div class="empty" style="padding:6px">Sin relaciones.</div>';
        return;
      }
      allRels.forEach(({ rel, net })=>{
        const otherId = rel.a === c.id ? rel.b : rel.a;
        const other = P.characters.find(x=>x.id===otherId);
        const dir = rel.mutual === false ? (rel.a === c.id ? ' → ' : ' ← ') : ' ↔ ';
        const row = make(`<div class="relrow">
          <span class="rel-txt"><b>${esc(other?other.name:'(desconocido)')}</b>${dir}${esc(rel.label||'relación')} <small style="color:var(--muted)">🕸 ${esc(net.name||'Red')}</small></span>
          <button class="btn small" data-go>→</button>
          <button class="btn small danger" data-del>✕</button>
        </div>`);
        row.querySelector('[data-go]').onclick = ()=>{ sel.characters = otherId; drawList(); drawDetail(); };
        row.querySelector('[data-del]').onclick = async ()=>{
          if(await confirmar('¿Borrar esta relación?')){
            net.relations = net.relations.filter(x=>x.id!==rel.id);
            touch(); drawRels();
          }
        };
        relList.appendChild(row);
      });
    }
    drawRels();
    relBox.appendChild(relList);
    const addRel = make('<button class="btn small" style="margin-top:8px">+ Añadir relación</button>');
    addRel.onclick = ()=> abrirModalRelacion(c.id);
    relBox.appendChild(addRel);
    box.appendChild(relBox);

    detail.appendChild(box);
  }

  toolsBox.appendChild(makePaneTools('characters', drawList, '🔍 Buscar personaje...'));
  filtersPanel.querySelector('[data-f-age]').oninput = e=>{ ui.characters.filters.age = e.target.value; drawList(); };
  filtersPanel.querySelector('[data-f-gender]').onchange = e=>{ ui.characters.filters.gender = e.target.value; drawList(); };
  filtersPanel.querySelector('[data-f-roll]').onchange = e=>{ ui.characters.filters.roll = e.target.value; drawList(); };
  filtersPanel.querySelector('[data-f-storyrole]').onchange = e=>{ ui.characters.filters.storyRole = e.target.value; drawList(); };
  wrap.querySelector('[data-toggle-filters]').onclick = ()=> filtersPanel.classList.toggle('open');

  wrap.querySelector('[data-new]').onclick = ()=>{
    const c = newCharacter();
    P.characters.push(c); sel.characters = c.id; touch(); drawList(); drawDetail();
  };
  wrap.querySelector('[data-paste]').onclick = ()=>{
    if(!clipboard || clipboard.kind!=='character'){ toast('Nada que pegar'); return; }
    const d = dupeItem(clipboard.data);
    P.characters.push(d); sel.characters = d.id; touch(); drawList(); drawDetail(); toast('Pegado ✓');
  };
  wrap.querySelector('[data-newfolder]').onclick = async ()=>{
    const v = await pedir('📁 Nueva carpeta', [{key:'n', label:'Nombre', value:'', autofocus:true}]);
    if(v && v.n.trim()){
      ensureCharFolders();
      const name = v.n.trim();
      if(P.charFolders.includes(name)){ toast('Ya existe esa carpeta'); return; }
      P.charFolders.push(name); touch(); drawList();
    }
  };
  drawList(); drawDetail();
  return wrap;
}

function abrirModalRelacion(desdeId){
  if(!P.charnets || !P.charnets.length){ toast('Primero crea una red de personajes'); return; }
  const validNets = P.charnets.filter(net =>
    (net.members||[]).includes(desdeId) &&
    (net.members||[]).some(id => id !== desdeId)
  );
  if(!validNets.length){ toast('Este personaje no está en ninguna red con otros'); return; }
  const netOpts = validNets.map(n=>`<option value="${n.id}">${esc(n.name||'Red')}</option>`).join('');
  openModal(`<h3>🕸 Nueva relación</h3>
    <label class="field"><span>Red</span><select data-net>${netOpts}</select></label>
    <label class="field"><span>Otro personaje</span><select data-o></select></label>
    <label class="field"><span>Tipo de relación</span><input data-l placeholder="Hermanos, amigos, rivales..." value=""></label>
    <label class="field"><span>Tipo de vínculo</span><select data-mutual>
      <option value="1">Mutua (↔)</option>
      <option value="0">Unilateral (→)</option>
    </select></label>
    <div class="modal-actions">
      <button class="btn" data-gonet>Ir a las redes</button>
      <button class="btn" data-no>Cancelar</button>
      <button class="btn primary" data-yes>Crear</button>
    </div>`,
    m=>{
      const netSel = m.querySelector('[data-net]');
      const oSel = m.querySelector('[data-o]');
      function refresh(){
        const net = P.charnets.find(n=>n.id===netSel.value);
        if(!net){ oSel.innerHTML=''; return; }
        const others = net.members.filter(id=>id!==desdeId).map(id=>P.characters.find(x=>x.id===id)).filter(Boolean);
        oSel.innerHTML = others.map(c=>`<option value="${c.id}">${esc(c.name||'Sin nombre')}</option>`).join('');
      }
      refresh();
      netSel.onchange = refresh;
      m.querySelector('[data-no]').onclick = closeModal;
      m.querySelector('[data-gonet]').onclick = ()=>{ closeModal(); view='charnet'; render(); };
      m.querySelector('[data-yes]').onclick = ()=>{
        const net = P.charnets.find(n=>n.id===netSel.value);
        const b = oSel.value;
        const l = m.querySelector('[data-l]').value.trim() || 'relación';
        const mutual = m.querySelector('[data-mutual]').value === '1';
        if(!net || !b) return;
        net.relations = net.relations || [];
        net.relations.push({ id: uid(), a: desdeId, b, label: l, mutual });
        closeModal(); touch();
        if(view==='characters') render(); else toast('Relación creada ✓');
      };
    });
}
