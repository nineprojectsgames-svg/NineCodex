function viewCharNet(){
  if(!P.charnets) P.charnets = [];
  if(!ui.charnet) ui.charnet = { q:'', sel:null };

  const wrap = make(`<div class="split">
    <div class="pane-list">
      <div class="pane-head">
        <h3>Redes</h3>
        <div class="pane-actions">
          <button class="btn small primary" data-new title="Nueva red">+</button>
        </div>
      </div>
      <div class="list" data-list></div>
    </div>
    <div class="pane-detail" data-detail></div>
  </div>`);
  const list = wrap.querySelector('[data-list]');
  const detail = wrap.querySelector('[data-detail]');

  function drawList(){
    list.innerHTML = '';
    if(!P.charnets.length){ list.innerHTML = '<div class="empty">Sin redes. Crea una con +.</div>'; return; }
    P.charnets.forEach(n=>{
      const it = make(`<div class="list-item ${n.id===ui.charnet.sel?'active':''}">
        <span class="li-title">🕸 ${esc(n.name||'Sin nombre')}</span>
        <span class="li-sub">${(n.members||[]).length} pers · ${(n.relations||[]).length} rel.</span>
      </div>`);
      it.onclick = ()=>{ ui.charnet.sel = n.id; drawList(); drawDetail(); };
      list.appendChild(it);
    });
  }
  function drawDetail(){
    detail.innerHTML = '';
    let net = P.charnets.find(x=>x.id===ui.charnet.sel);
    if(!net){
      if(P.charnets.length){ net = P.charnets[0]; ui.charnet.sel = net.id; }
      else { detail.appendChild(make('<div class="paper empty">No hay redes todavía.<br><small>Crea una con +</small></div>')); return; }
    }
    net.members = net.members || []; net.relations = net.relations || [];
    net.positions = net.positions || {}; net.view = net.view || { x:0, y:0, zoom:1, fitted:false };

    const box = make('<div class="paper"></div>');
    box.appendChild(titleRow(net.name, v=>{ net.name = v; touch(); drawList(); }, [
      {label:'⧉', onClick:()=>{
        const d = deepClone(net); d.id = uid();
        d.name = (net.name||'Red') + ' (copia)';
        d.view = { x:0, y:0, zoom:1, fitted:false };
        d.relations = (d.relations||[]).map(r=>({ ...r, id: uid() }));
        P.charnets.push(d); ui.charnet.sel = d.id;
        touch(); drawList(); drawDetail(); toast('Red duplicada ✓');
      }},
      {label:'🗑', cls:'danger', onClick: async ()=>{
        if(await pedirBorrado(net.name||'esta red')){
          P.charnets = P.charnets.filter(x=>x.id!==net.id);
          ui.charnet.sel = P.charnets[0] ? P.charnets[0].id : null;
          touch(); drawList(); drawDetail();
        }
      }}
    ], 'Nombre de la red'));

    const memberBox = make('<div style="margin:14px 0"></div>');
    memberBox.appendChild(make(`<h3 style="font-size:13px;color:var(--gold-soft);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">👥 Personajes en esta red</h3>`));
    const chips = make('<div class="chips"></div>');
    function drawMembers(){
      chips.innerHTML = '';
      const memberChars = net.members.map(id=>P.characters.find(c=>c.id===id)).filter(Boolean);
      if(!memberChars.length) chips.innerHTML = '<span class="hint" style="margin:0">Ningún personaje.</span>';
      memberChars.forEach(c=>{
        const chip = make(`<span class="chip">🧝 ${esc(c.name||'Sin nombre')}<span class="x">✕</span></span>`);
        chip.querySelector('.x').onclick = (e)=>{
          e.stopPropagation();
          net.members = net.members.filter(x=>x!==c.id);
          net.relations = net.relations.filter(r=>r.a!==c.id && r.b!==c.id);
          delete net.positions[c.id];
          touch(); drawMembers(); drawList(); drawDetail();
        };
        chips.appendChild(chip);
      });
    }
    drawMembers();
    memberBox.appendChild(chips);
    const manageBtn = make('<button class="btn small" style="margin-top:8px">👥 Gestionar personajes</button>');
    manageBtn.onclick = ()=> modalManageMembers(net, ()=>{ touch(); drawList(); drawDetail(); });
    memberBox.appendChild(manageBtn);
    box.appendChild(memberBox);

    const canvasWrap = make('<div class="nc-wrap" style="margin-top:14px"></div>');
    canvasWrap.appendChild(make(`<div class="nc-toolbar">
      <button class="btn small" data-zoomout>−</button>
      <span class="nc-zoomval" data-zoomval>100%</span>
      <button class="btn small" data-zoomin>+</button>
      <button class="btn small" data-fit>⤢ Encajar</button>
      <button class="btn small" data-organize>✺ Organizar</button>
    </div>`));
    const viewport = make('<div class="nc-viewport" data-viewport><div class="nc-world" data-world><svg class="netsvg" data-svg></svg></div></div>');
    canvasWrap.appendChild(viewport);
    const below = make(`<div class="pane-tools" style="max-width:420px;margin-top:10px">
      <input class="pt-search" placeholder="🔍 Resaltar personaje...">
      <button class="btn small primary" data-newrel>+ Relación</button>
    </div>`);
    canvasWrap.appendChild(below);
    box.appendChild(canvasWrap);

    const relBox = make('<div style="margin-top:16px"></div>');
    relBox.appendChild(make('<h3 style="font-size:13px;color:var(--gold-soft);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">🕸 Relaciones</h3>'));
    const relList = make('<div></div>');
    relBox.appendChild(relList);
    box.appendChild(relBox);
    detail.appendChild(box);

    const world = viewport.querySelector('[data-world]');
    const svg = viewport.querySelector('[data-svg]');
    const zoomVal = canvasWrap.querySelector('[data-zoomval]');
    const cam = net.view;
    const clampZoom = z => Math.max(0.2, Math.min(3, z));
    const memberChars = net.members.map(id=>P.characters.find(c=>c.id===id)).filter(Boolean);

    memberChars.forEach((c,i)=>{
      if(!net.positions[c.id]){
        const total = memberChars.length;
        const a = (i/Math.max(1,total))*Math.PI*2 - Math.PI/2;
        const rad = Math.min(420, 140 + total*32);
        net.positions[c.id] = { x: Math.cos(a)*rad, y: Math.sin(a)*rad*0.72 };
      }
    });

    function applyTransform(){
      world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.zoom})`;
      const grid = 24 * cam.zoom;
      viewport.style.backgroundSize = `${grid}px ${grid}px`;
      viewport.style.backgroundPosition = `${cam.x % grid}px ${cam.y % grid}px`;
      zoomVal.textContent = Math.round(cam.zoom*100) + '%';
    }
    function zoomAround(mx, my, factor){
      const wx = (mx - cam.x) / cam.zoom, wy = (my - cam.y) / cam.zoom;
      cam.zoom = clampZoom(cam.zoom * factor);
      cam.x = mx - wx * cam.zoom;
      cam.y = my - wy * cam.zoom;
      applyTransform(); touch();
    }
    function fitView(silent){
      if(!memberChars.length){ if(!silent) toast('No hay personajes'); return; }
      const xs = memberChars.map(c=>net.positions[c.id].x);
      const ys = memberChars.map(c=>net.positions[c.id].y);
      const pad = 100;
      const minX = Math.min(...xs)-pad, maxX = Math.max(...xs)+pad;
      const minY = Math.min(...ys)-pad, maxY = Math.max(...ys)+pad;
      const bw = Math.max(1, maxX-minX), bh = Math.max(1, maxY-minY);
      const rect = viewport.getBoundingClientRect();
      if(!rect.width || !rect.height) return;
      const z = clampZoom(Math.min(rect.width/bw, rect.height/bh, 1.4));
      cam.zoom = z;
      cam.x = rect.width/2 - (minX + bw/2) * z;
      cam.y = rect.height/2 - (minY + bh/2) * z;
      applyTransform(); touch();
    }

    const nodeEls = {};
    function applyHighlight(){
      const q = (ui.charnet.q||'').toLowerCase();
      Object.entries(nodeEls).forEach(([id, el])=>{
        const c = P.characters.find(x=>x.id===id);
        const match = !q || (c && (c.name||'').toLowerCase().includes(q));
        el.style.opacity = match ? '1' : '0.22';
      });
    }
    function drawLines(){
      svg.innerHTML = '';
      net.relations.forEach(r=>{
        const pa = net.positions[r.a], pb = net.positions[r.b];
        if(!pa || !pb) return;
        const line = document.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('x1', pa.x); line.setAttribute('y1', pa.y);
        line.setAttribute('x2', pb.x); line.setAttribute('y2', pb.y);
        line.setAttribute('stroke', '#8a6f1c');
        line.setAttribute('stroke-width', '2');
        if(r.mutual === false){ line.setAttribute('stroke-dasharray', '4 4'); }
        else { line.setAttribute('stroke-dasharray', '6 4'); }
        // Flecha para unilaterales
        if(r.mutual === false){
          line.setAttribute('marker-end','url(#arrowhead)');
        }
        svg.appendChild(line);
        const t = document.createElementNS('http://www.w3.org/2000/svg','text');
        t.setAttribute('x', (pa.x+pb.x)/2);
        t.setAttribute('y', (pa.y+pb.y)/2 - 6);
        t.setAttribute('fill', '#c9a227');
        t.setAttribute('font-size', '12');
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('font-family','Georgia, serif');
        t.textContent = (r.mutual === false ? '→ ' : '') + (r.label||'');
        svg.appendChild(t);
      });
    }
    memberChars.forEach(c=>{
      const pos = net.positions[c.id];
      const el = make(`<div class="node">
        ${c.image ? `<div class="nimg" style="background-image:url('${esc(c.image)}')"></div>` : ''}
        <div class="nodename">${esc(c.name||'Sin nombre')}</div>
      </div>`);
      el.style.left = pos.x + 'px'; el.style.top = pos.y + 'px';
      el.title = 'Clic para abrir la ficha';
      world.appendChild(el);
      nodeEls[c.id] = el;
      let dragging=false, moved=false, sx=0, sy=0, ox=0, oy=0;
      el.addEventListener('pointerdown', e=>{
        e.stopPropagation(); dragging=true; moved=false;
        sx=e.clientX; sy=e.clientY; ox=pos.x; oy=pos.y;
        el.setPointerCapture(e.pointerId); el.style.zIndex = 10;
      });
      el.addEventListener('pointermove', e=>{
        if(!dragging) return;
        e.stopPropagation();
        const dx = (e.clientX-sx)/cam.zoom, dy = (e.clientY-sy)/cam.zoom;
        if(Math.abs(dx)>3 || Math.abs(dy)>3) moved = true;
        pos.x = ox+dx; pos.y = oy+dy;
        el.style.left = pos.x+'px'; el.style.top = pos.y+'px';
        drawLines();
      });
      el.addEventListener('pointerup', e=>{
        e.stopPropagation(); dragging = false; el.style.zIndex = 2;
        if(moved){ touch(); } else { sel.characters = c.id; view='characters'; render(); }
      });
    });
    drawLines();
    applyTransform();
    if(!cam.fitted){ cam.fitted = true; setTimeout(()=>fitView(true), 40); }

    // SVG defs para flecha
    const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
    defs.innerHTML = `<marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c9a227"/></marker>`;
    svg.appendChild(defs);

    const pointers = new Map();
    let panState = null, pinchState = null;
    viewport.addEventListener('pointerdown', e=>{
      if(e.target.closest('.node')) return;
      viewport.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
      viewport.classList.add('panning');
      if(pointers.size === 1){ panState = { sx:e.clientX, sy:e.clientY, startX:cam.x, startY:cam.y }; pinchState = null; }
      else if(pointers.size === 2){
        panState = null;
        const pts = [...pointers.values()];
        const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1;
        const mid = { x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2 };
        pinchState = { startDist:dist, startZoom:cam.zoom, startMid:mid, startX:cam.x, startY:cam.y };
      }
    });
    viewport.addEventListener('pointermove', e=>{
      if(!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if(pointers.size === 1 && panState){
        cam.x = panState.startX + (e.clientX - panState.sx);
        cam.y = panState.startY + (e.clientY - panState.sy);
        applyTransform();
      } else if(pointers.size === 2 && pinchState){
        const pts = [...pointers.values()];
        const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1;
        const mid = { x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2 };
        const rect = viewport.getBoundingClientRect();
        const factor = dist / pinchState.startDist;
        const nz = clampZoom(pinchState.startZoom * factor);
        const mxRel = pinchState.startMid.x - rect.left, myRel = pinchState.startMid.y - rect.top;
        const wx = (mxRel - pinchState.startX) / pinchState.startZoom;
        const wy = (myRel - pinchState.startY) / pinchState.startZoom;
        const shiftX = mid.x - pinchState.startMid.x, shiftY = mid.y - pinchState.startMid.y;
        cam.zoom = nz;
        cam.x = mxRel - wx*nz + shiftX;
        cam.y = myRel - wy*nz + shiftY;
        applyTransform();
      }
    });
    function endPointer(e){
      pointers.delete(e.pointerId);
      if(pointers.size === 0){ panState = null; pinchState = null; viewport.classList.remove('panning'); touch(); }
      else if(pointers.size === 1){
        const [, p] = [...pointers.entries()][0];
        panState = { sx:p.x, sy:p.y, startX:cam.x, startY:cam.y }; pinchState = null;
      }
    }
    viewport.addEventListener('pointerup', endPointer);
    viewport.addEventListener('pointercancel', endPointer);
    viewport.addEventListener('wheel', e=>{
      e.preventDefault();
      const rect = viewport.getBoundingClientRect();
      const factor = Math.exp(-e.deltaY * 0.0015);
      zoomAround(e.clientX-rect.left, e.clientY-rect.top, factor);
    }, {passive:false});

    canvasWrap.querySelector('[data-zoomin]').onclick = ()=>{ const r=viewport.getBoundingClientRect(); zoomAround(r.width/2, r.height/2, 1.25); };
    canvasWrap.querySelector('[data-zoomout]').onclick = ()=>{ const r=viewport.getBoundingClientRect(); zoomAround(r.width/2, r.height/2, 1/1.25); };
    canvasWrap.querySelector('[data-fit]').onclick = ()=>fitView();
    canvasWrap.querySelector('[data-organize]').onclick = ()=>{
      const cn = memberChars.length;
      if(cn < 2){ toast('Necesitas 2+ personajes'); return; }
      const iterations = cn > 80 ? 60 : 200;
      const k = 170;
      const pos = {};
      memberChars.forEach(c=>{ pos[c.id] = { x: net.positions[c.id].x, y: net.positions[c.id].y }; });
      for(let iter=0; iter<iterations; iter++){
        const disp = {};
        memberChars.forEach(c=>{ disp[c.id] = { x:0, y:0 }; });
        for(let i=0;i<cn;i++) for(let j=i+1;j<cn;j++){
          const a = memberChars[i], b = memberChars[j];
          let dx = pos[a.id].x - pos[b.id].x, dy = pos[a.id].y - pos[b.id].y;
          let dist = Math.hypot(dx,dy) || 0.01;
          const force = (k*k)/dist;
          const ux=dx/dist, uy=dy/dist;
          disp[a.id].x += ux*force; disp[a.id].y += uy*force;
          disp[b.id].x -= ux*force; disp[b.id].y -= uy*force;
        }
        net.relations.forEach(r=>{
          const pa = pos[r.a], pb = pos[r.b];
          if(!pa || !pb) return;
          let dx = pa.x - pb.x, dy = pa.y - pb.y;
          let dist = Math.hypot(dx,dy) || 0.01;
          const force = (dist*dist)/k * 0.05;
          const ux=dx/dist, uy=dy/dist;
          disp[r.a].x -= ux*force; disp[r.a].y -= uy*force;
          disp[r.b].x += ux*force; disp[r.b].y += uy*force;
        });
        const temp = Math.max(1, 14 * (1 - iter/iterations));
        memberChars.forEach(c=>{
          const d = Math.hypot(disp[c.id].x, disp[c.id].y) || 0.01;
          pos[c.id].x += (disp[c.id].x/d) * Math.min(d, temp);
          pos[c.id].y += (disp[c.id].y/d) * Math.min(d, temp);
        });
      }
      memberChars.forEach(c=>{ net.positions[c.id] = pos[c.id]; });
      Object.entries(nodeEls).forEach(([id, el])=>{
        const p = net.positions[id];
        if(p){ el.style.left = p.x+'px'; el.style.top = p.y+'px'; }
      });
      drawLines(); fitView(true); touch(); toast('Organizado ✓');
    };

    const searchInp = below.querySelector('.pt-search');
    searchInp.value = ui.charnet.q || '';
    searchInp.oninput = e=>{ ui.charnet.q = e.target.value; applyHighlight(); };
    below.querySelector('[data-newrel]').onclick = ()=> modalNewRelation(net, ()=>{ touch(); drawLines(); drawRels(); drawList(); });

    function drawRels(){
      relList.innerHTML = '';
      if(!net.relations.length){ relList.innerHTML = '<div class="empty">Sin relaciones.</div>'; return; }
      net.relations.forEach(r=>{
        const A = P.characters.find(x=>x.id===r.a);
        const B = P.characters.find(x=>x.id===r.b);
        if(!A || !B) return;
        const dir = r.mutual === false ? ' → ' : ' ↔ ';
        const row = make(`<div class="relrow">
          <span class="rel-txt"><b>${esc(A.name||'?')}</b>${dir}${esc(r.label||'relación')}<b> ${esc(B.name||'?')}</b></span>
          <button class="btn small" data-edit>✎</button>
          <button class="btn small danger" data-del>🗑</button>
        </div>`);
        row.querySelector('[data-edit]').onclick = ()=>{
          openModal(`<h3>✎ Editar relación</h3>
            <label class="field"><span>Tipo</span><input data-l value="${esc(r.label||'')}" autofocus></label>
            <label class="field"><span>Vínculo</span><select data-m>
              <option value="1" ${r.mutual!==false?'selected':''}>Mutua ↔</option>
              <option value="0" ${r.mutual===false?'selected':''}>Unilateral →</option>
            </select></label>
            <div class="modal-actions">
              <button class="btn" data-no>Cancelar</button>
              <button class="btn primary" data-yes>Guardar</button>
            </div>`,
            m=>{
              m.querySelector('[data-no]').onclick = closeModal;
              m.querySelector('[data-yes]').onclick = ()=>{
                r.label = m.querySelector('[data-l]').value;
                r.mutual = m.querySelector('[data-m]').value === '1';
                closeModal(); touch(); drawLines(); drawRels();
              };
            });
        };
        row.querySelector('[data-del]').onclick = async ()=>{
          if(await confirmar('¿Borrar esta relación?')){
            net.relations = net.relations.filter(x=>x.id!==r.id);
            touch(); drawLines(); drawRels(); drawList();
          }
        };
        relList.appendChild(row);
      });
    }
    drawRels();
  }

  function modalManageMembers(net, onDone){
    openModal(`<h3>👥 Gestionar personajes</h3>
      <label class="field"><span>Buscar</span><input data-q placeholder="Filtra por nombre..." autofocus></label>
      <div class="picklist" data-list></div>
      <div class="modal-actions" style="justify-content:space-between">
        <button class="btn" data-newchar>+ Crear personaje</button>
        <button class="btn primary" data-cancel>Cerrar</button>
      </div>`,
      m=>{
        const listEl = m.querySelector('[data-list]');
        const qInp = m.querySelector('[data-q]');
        const draw = (q='')=>{
          listEl.innerHTML = '';
          if(!P.characters.length){ listEl.innerHTML = '<div class="empty">No hay personajes.</div>'; return; }
          const f = P.characters.filter(c => (c.name||'').toLowerCase().includes(q.toLowerCase()));
          if(!f.length){ listEl.innerHTML = '<div class="empty">Sin resultados.</div>'; return; }
          f.forEach(c=>{
            const checked = net.members.includes(c.id);
            const item = make(`<label class="pickitem" style="cursor:pointer">
              <input type="checkbox" ${checked?'checked':''} style="accent-color:var(--gold)">
              <span>🧝 ${esc(c.name||'Sin nombre')}</span>
            </label>`);
            const cb = item.querySelector('input');
            cb.onchange = ()=>{
              if(cb.checked){
                if(!net.members.includes(c.id)){
                  net.members.push(c.id);
                  if(!net.positions[c.id]){
                    const total = net.members.length;
                    const a = ((total-1)/Math.max(1,total))*Math.PI*2 - Math.PI/2;
                    const rad = 140 + total*20;
                    net.positions[c.id] = { x: Math.cos(a)*rad, y: Math.sin(a)*rad*0.72 };
                  }
                }
              } else {
                net.members = net.members.filter(x=>x!==c.id);
                net.relations = net.relations.filter(r=>r.a!==c.id && r.b!==c.id);
                delete net.positions[c.id];
              }
              touch();
            };
            listEl.appendChild(item);
          });
        };
        draw();
        qInp.oninput = ()=> draw(qInp.value);
        m.querySelector('[data-newchar]').onclick = ()=>{
          const c = newCharacter(); P.characters.push(c); net.members.push(c.id);
          const total = net.members.length;
          const a = ((total-1)/Math.max(1,total))*Math.PI*2 - Math.PI/2;
          const rad = 140 + total*20;
          net.positions[c.id] = { x: Math.cos(a)*rad, y: Math.sin(a)*rad*0.72 };
          touch(); draw(qInp.value);
        };
        m.querySelector('[data-cancel]').onclick = ()=>{ closeModal(); onDone(); };
      });
  }
  function modalNewRelation(net, onDone){
    const members = net.members.map(id=>P.characters.find(c=>c.id===id)).filter(Boolean);
    if(members.length < 2){ toast('Necesitas 2+ personajes'); return; }
    const opts = members.map(c=>`<option value="${c.id}">${esc(c.name||'Sin nombre')}</option>`).join('');
    openModal(`<h3>🕸 Nueva relación</h3>
      <label class="field"><span>Personaje A</span><select data-a>${opts}</select></label>
      <label class="field"><span>Personaje B</span><select data-b>${opts}</select></label>
      <label class="field"><span>Relación</span><input data-l placeholder="Hermanos, amigos, rivales..."></label>
      <label class="field"><span>Vínculo</span><select data-m>
        <option value="1">Mutua ↔</option>
        <option value="0">Unilateral (A → B)</option>
      </select></label>
      <div class="modal-actions">
        <button class="btn" data-no>Cancelar</button>
        <button class="btn primary" data-yes>Crear</button>
      </div>`,
      m=>{
        m.querySelector('[data-b]').selectedIndex = Math.min(1, members.length-1);
        m.querySelector('[data-no]').onclick = closeModal;
        m.querySelector('[data-yes]').onclick = ()=>{
          const a = m.querySelector('[data-a]').value;
          const b = m.querySelector('[data-b]').value;
          const l = m.querySelector('[data-l]').value.trim() || 'relación';
          const mutual = m.querySelector('[data-m]').value === '1';
          if(a === b){ toast('Elige dos distintos'); return; }
          net.relations.push({ id: uid(), a, b, label: l, mutual });
          closeModal(); touch(); onDone && onDone();
        };
      });
  }

  wrap.querySelector('[data-new]').onclick = ()=>{
    const newNet = { id: uid(), name: 'Red ' + (P.charnets.length + 1), members: [], relations: [], positions: {}, view: { x:0, y:0, zoom:1, fitted:false } };
    P.charnets.push(newNet); ui.charnet.sel = newNet.id;
    touch(); drawList(); drawDetail(); toast('Red creada ✓');
  };
  drawList(); drawDetail();
  return wrap;
}

/* ==== 8.9 Historia de Personajes (split pane, con timeline) ==== */
function viewCharHist(){
  if(!ui.charhist) ui.charhist = { q:'', sel:null, highlight:null, viewMode:'vertical' };
  if(!ui.charhist.q) ui.charhist.q = '';

  const wrap = make(`<div class="split">
    <div class="pane-list">
      <div class="pane-head">
        <h3>Personajes</h3>
        <div class="pane-actions">
          <button class="btn small primary" data-new>+</button>
        </div>
      </div>
      <div class="pane-tools">
        <input class="pt-search" placeholder="🔍 Buscar...">
      </div>
      <div class="list" data-list></div>
    </div>
    <div class="pane-detail" data-detail></div>
  </div>`);
  const list = wrap.querySelector('[data-list]');
  const detail = wrap.querySelector('[data-detail]');
  const searchInp = wrap.querySelector('.pt-search');
  searchInp.value = ui.charhist.q || '';
  searchInp.oninput = ()=>{ ui.charhist.q = searchInp.value; drawList(); };

  function drawList(){
    list.innerHTML = '';
    if(!P.characters.length){ list.innerHTML = '<div class="empty">Sin personajes.</div>'; return; }
    const q = (ui.charhist.q||'').toLowerCase();
    const filtered = P.characters.filter(c => !q || (c.name||'').toLowerCase().includes(q));
    if(!filtered.length){ list.innerHTML = '<div class="empty">Sin resultados.</div>'; return; }
    filtered.forEach(c=>{
      const it = make(`<div class="list-item ${c.id===ui.charhist.sel?'active':''}">
        ${c.image ? `<div class="li-thumb" style="background-image:url('${esc(c.image)}')"></div>` : ''}
        <span class="li-title">📖 ${esc(c.name||'Sin nombre')}</span>
        <span class="li-sub">${(c.timeline||[]).length} hito${(c.timeline||[]).length===1?'':'s'}</span>
      </div>`);
      it.onclick = ()=>{ ui.charhist.sel = c.id; drawList(); drawDetail(); };
      list.appendChild(it);
    });
  }
  function drawDetail(){
    detail.innerHTML = '';
    if(!P.characters.length){ detail.appendChild(make('<div class="paper empty">Sin personajes.</div>')); return; }
    let c = P.characters.find(x => x.id === ui.charhist.sel);
    if(!c){ c = P.characters[0]; ui.charhist.sel = c.id; }
    if(!Array.isArray(c.timeline)) c.timeline = [];

    const box = make('<div class="paper"></div>');
    box.appendChild(titleRow(c.name, v=>{ c.name = v; touch(); drawList(); }, [
      {label:'🧝 Ficha', onClick:()=>{ view='characters'; sel.characters = c.id; render(); }},
      {label:'+ Hito', onClick:()=>{
        c.timeline.push({ id: uid(), date:'', title:'', desc:'' });
        touch(); drawDetail();
      }}
    ], 'Nombre del personaje'));

    const descWrap = make('<div style="margin-bottom:12px"></div>');
    descWrap.appendChild(make('<div style="font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--gold-soft);margin-bottom:6px">Historia</div>'));
    descWrap.appendChild(createEditor(c.history, v=>{ c.history = v; touch(); }));
    box.appendChild(descWrap);

    // Vista: vertical / horizontal
    const mode = ui.charhist.viewMode || 'vertical';
    const toolbar = make(`<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:14px">
      <button class="btn small" data-mode>${mode==='vertical'?'↔ Ver horizontal':'↕ Ver vertical'}</button>
      <button class="btn small" data-sort>⇅ Ordenar por fecha</button>
    </div>`);
    box.appendChild(toolbar);
    toolbar.querySelector('[data-mode]').onclick = ()=>{ ui.charhist.viewMode = mode==='vertical'?'horizontal':'vertical'; drawDetail(); };
    toolbar.querySelector('[data-sort]').onclick = ()=>{
      c.timeline.sort((a,b)=> String(a.date||'').localeCompare(String(b.date||''),'es',{numeric:true}));
      touch(); drawDetail(); toast('Ordenado');
    };

    const body = make('<div data-body></div>');
    box.appendChild(body);
    detail.appendChild(box);

    if(mode === 'vertical'){
      const tl = make('<div class="tl"></div>');
      if(!c.timeline.length) body.appendChild(make('<div class="empty">Sin hitos.</div>'));
      c.timeline.forEach((t,i)=>{
        const item = make(`<div class="tl-item">
          <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap">
            <div style="flex:1;min-width:0">
              <div class="tl-date">${esc(t.date||'Sin fecha')}</div>
              <div class="tl-title">${esc(t.title||'Hito sin título')}</div>
            </div>
            <div class="row-actions"></div>
          </div>
          <div data-desc style="margin-top:8px"></div>
        </div>`);
        const acts = item.querySelector('.row-actions');
        const mk = (label, fn, cls)=>{
          const b = make(`<button class="btn small ${cls||''}">${label}</button>`);
          b.onclick = fn; acts.appendChild(b);
        };
        mk('▲', ()=>{ if(moveInArray(c.timeline, i, -1)){ touch(); drawDetail(); }});
        mk('▼', ()=>{ if(moveInArray(c.timeline, i, +1)){ touch(); drawDetail(); }});
        mk('✎', ()=> editHito(t, drawDetail));
        mk('🗑', async ()=>{ if(await pedirBorrado(t.title||'este hito')){ c.timeline.splice(i,1); touch(); drawDetail(); } }, 'danger');
        item.querySelector('[data-desc]').innerHTML = `<div style="color:var(--ink-dim);font-size:14px;line-height:1.6">${t.desc||'<i>Sin descripción</i>'}</div>`;
        tl.appendChild(item);
      });
      if(c.timeline.length) body.appendChild(tl);
    } else {
      // horizontal simple
      const arr = c.timeline.slice().map(t=>({ t, year: parseTimelineYear(t.date) })).sort((a,b)=>{
        if(a.year === null && b.year === null) return 0;
        if(a.year === null) return 1;
        if(b.year === null) return -1;
        return a.year - b.year;
      });
      if(!arr.length){ body.appendChild(make('<div class="empty">Sin hitos.</div>')); }
      else {
        const wrapEl = make('<div class="tl-h-wrap"></div>');
        const rail = make(`<div class="tl-h-rail" style="width:${Math.max(900, arr.length*300)}px"></div>`);
        rail.appendChild(make('<div class="tl-h-axis"></div>'));
        arr.forEach((p, gi)=>{
          const up = gi%2 === 0;
          const pos = 160 + gi * 300;
          const col = make(`<div class="tl-h-col" style="left:${pos}px"></div>`);
          const topArea = make('<div class="tl-h-area top"></div>');
          const bottomArea = make('<div class="tl-h-area bottom"></div>');
          const center = make(`<div class="tl-h-center">
            <div class="tl-h-year">${esc(p.t.date||p.year||'—')}</div>
            <div class="tl-h-dot"></div>
          </div>`);
          const stack = make('<div class="tl-h-stack"></div>');
          const card = make(`<div class="tl-h-card">
            <div class="tl-date">${esc(p.t.date||'Sin fecha')}</div>
            <div class="tl-title">${esc(p.t.title||'Hito sin título')}</div>
            ${p.t.desc ? `<div class="tl-h-desc">${esc(stripHtml(p.t.desc))}</div>` : ''}
          </div>`);
          card.onclick = ()=> editHito(p.t, drawDetail);
          stack.appendChild(card);
          if(up) topArea.appendChild(stack); else bottomArea.appendChild(stack);
          col.appendChild(topArea); col.appendChild(center); col.appendChild(bottomArea);
          rail.appendChild(col);
        });
        wrapEl.appendChild(rail);
        body.appendChild(wrapEl);
      }
    }
  }
  function editHito(t, redraw){
    openModal(`<h3>⏳ Hito</h3>
      <label class="field"><span>Fecha</span><input data-d value="${esc(t.date||'')}" placeholder="Año 342"></label>
      <label class="field"><span>Título</span><input data-t value="${esc(t.title||'')}" autofocus></label>
      <label class="field"><span>Descripción</span><textarea data-desc>${esc(t.desc||'')}</textarea></label>
      <div class="modal-actions">
        <button class="btn" data-no>Cancelar</button>
        <button class="btn primary" data-yes>Guardar</button>
      </div>`,
      m=>{
        m.querySelector('[data-no]').onclick = closeModal;
        m.querySelector('[data-yes]').onclick = ()=>{
          t.date = m.querySelector('[data-d]').value;
          t.title = m.querySelector('[data-t]').value;
          t.desc = m.querySelector('[data-desc]').value;
          closeModal(); touch(); redraw();
        };
      });
  }

  wrap.querySelector('[data-new]').onclick = ()=>{
    const c = newCharacter(); P.characters.push(c); ui.charhist.sel = c.id;
    touch(); drawList(); drawDetail();
  };
  drawList(); drawDetail();
  return wrap;
}

      <button class="btn small" data-fit>⤢ Encajar</button>
      <button class="btn small" data-organize>✺ Organizar</button>
    </div>`));
    const viewport = make('<div class="nc-viewport" data-viewport><div class="nc-world" data-world><svg class="netsvg" data-svg></svg></div></div>');
    canvasWrap.appendChild(viewport);
    canvasWrap.appendChild(layoutBtn);
    const below = make(`<div class="pane-tools" style="max-width:420px;margin-top:10px">
      <input class="pt-search" placeholder="🔍 Resaltar personaje...">
      <button class="btn small primary" data-newrel>+ Relación</button>
    </div>`);
    canvasWrap.appendChild(below);
    box.appendChild(canvasWrap);

    const relBox = make('<div style="margin-top:16px"></div>');
    relBox.appendChild(make('<h3 style="font-size:13px;color:var(--gold-soft);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">🌳 Relaciones familiares</h3>'));
    const relList = make('<div></div>');
    relBox.appendChild(relList);
    box.appendChild(relBox);
    detail.appendChild(box);

    const world = viewport.querySelector('[data-world]');
    const svg = viewport.querySelector('[data-svg]');
    const zoomVal = canvasWrap.querySelector('[data-zoomval]');
    const cam = g.view;
    const clampZoom = z => Math.max(0.2, Math.min(3, z));
    const memberChars = g.members.map(id=>P.characters.find(c=>c.id===id)).filter(Boolean);

    memberChars.forEach((c,i)=>{
      if(!g.positions[c.id]){
        const total = memberChars.length;
        const a = (i/Math.max(1,total))*Math.PI*2 - Math.PI/2;
        const rad = Math.min(420, 140 + total*32);
        g.positions[c.id] = { x: Math.cos(a)*rad, y: Math.sin(a)*rad*0.72 };
      }
    });

    function applyTransform(){
      world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.zoom})`;
      const grid = 24 * cam.zoom;
      viewport.style.backgroundSize = `${grid}px ${grid}px`;
      viewport.style.backgroundPosition = `${cam.x % grid}px ${cam.y % grid}px`;
      zoomVal.textContent = Math.round(cam.zoom*100) + '%';
    }
    function zoomAround(mx, my, factor){
      const wx = (mx - cam.x) / cam.zoom, wy = (my - cam.y) / cam.zoom;
      cam.zoom = clampZoom(cam.zoom * factor);
      cam.x = mx - wx * cam.zoom;
      cam.y = my - wy * cam.zoom;
      applyTransform(); touch();
    }
    function fitView(silent){
      if(!memberChars.length){ if(!silent) toast('Sin personajes'); return; }
      const xs = memberChars.map(c=>g.positions[c.id].x);
      const ys = memberChars.map(c=>g.positions[c.id].y);
      const pad = 100;
      const minX = Math.min(...xs)-pad, maxX = Math.max(...xs)+pad;
      const minY = Math.min(...ys)-pad, maxY = Math.max(...ys)+pad;
      const bw = Math.max(1, maxX-minX), bh = Math.max(1, maxY-minY);
      const rect = viewport.getBoundingClientRect();
      if(!rect.width || !rect.height) return;
      const z = clampZoom(Math.min(rect.width/bw, rect.height/bh, 1.4));
      cam.zoom = z;
      cam.x = rect.width/2 - (minX + bw/2) * z;
      cam.y = rect.height/2 - (minY + bh/2) * z;
      applyTransform(); touch();
    }

    const nodeEls = {};
    function drawLines(){
      svg.innerHTML = '';
      const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
      defs.innerHTML = `<marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#c9a227"/></marker>`;
      svg.appendChild(defs);
      g.relations.forEach(r=>{
        const pa = g.positions[r.a], pb = g.positions[r.b];
        if(!pa || !pb) return;
        const line = document.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('x1', pa.x); line.setAttribute('y1', pa.y);
        line.setAttribute('x2', pb.x); line.setAttribute('y2', pb.y);
        line.setAttribute('stroke', '#8a6f1c');
        line.setAttribute('stroke-width', '2');
        if(r.type === 'parent') line.setAttribute('stroke-dasharray', '6 4');
        else if(r.type === 'sibling') line.setAttribute('stroke-dasharray', '3 3');
        else if(r.type === 'partner') line.setAttribute('stroke', '#c9a227');
        svg.appendChild(line);
        const t = document.createElementNS('http://www.w3.org/2000/svg','text');
        t.setAttribute('x', (pa.x+pb.x)/2);
        t.setAttribute('y', (pa.y+pb.y)/2 - 6);
        t.setAttribute('fill', '#c9a227');
        t.setAttribute('font-size', '11');
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('font-family','Georgia, serif');
        t.textContent = r.type === 'parent' ? '↧' : (r.type === 'sibling' ? '~' : (r.type === 'partner' ? '♥' : ''));
        svg.appendChild(t);
      });
    }
    memberChars.forEach(c=>{
      const pos = g.positions[c.id];
      const el = make(`<div class="node">
        ${c.image ? `<div class="nimg" style="background-image:url('${esc(c.image)}')"></div>` : ''}
        <div class="nodename">${esc(c.name||'Sin nombre')}</div>
      </div>`);
      el.style.left = pos.x + 'px'; el.style.top = pos.y + 'px';
      world.appendChild(el);
      nodeEls[c.id] = el;
      let dragging=false, moved=false, sx=0, sy=0, ox=0, oy=0;
      el.addEventListener('pointerdown', e=>{
        e.stopPropagation(); dragging=true; moved=false;
        sx=e.clientX; sy=e.clientY; ox=pos.x; oy=pos.y;
        el.setPointerCapture(e.pointerId); el.style.zIndex = 10;
      });
      el.addEventListener('pointermove', e=>{
        if(!dragging) return;
        e.stopPropagation();
        const dx = (e.clientX-sx)/cam.zoom, dy = (e.clientY-sy)/cam.zoom;
        if(Math.abs(dx)>3 || Math.abs(dy)>3) moved = true;
        pos.x = ox+dx; pos.y = oy+dy;
        el.style.left = pos.x+'px'; el.style.top = pos.y+'px';
        drawLines();
      });
      el.addEventListener('pointerup', e=>{
        e.stopPropagation(); dragging = false; el.style.zIndex = 2;
        if(moved){ touch(); } else { sel.characters = c.id; view='characters'; render(); }
      });
    });
    drawLines();
    applyTransform();
    if(!cam.fitted){ cam.fitted = true; setTimeout(()=>fitView(true), 40); }

    const pointers = new Map();
    let panState = null, pinchState = null;
    viewport.addEventListener('pointerdown', e=>{
      if(e.target.closest('.node')) return;
      viewport.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
      viewport.classList.add('panning');
      if(pointers.size === 1){ panState = { sx:e.clientX, sy:e.clientY, startX:cam.x, startY:cam.y }; pinchState = null; }
      else if(pointers.size === 2){
        panState = null;
        const pts = [...pointers.values()];
        const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1;
        const mid = { x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2 };
        pinchState = { startDist:dist, startZoom:cam.zoom, startMid:mid, startX:cam.x, startY:cam.y };
      }
    });
    viewport.addEventListener('pointermove', e=>{
      if(!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if(pointers.size === 1 && panState){
        cam.x = panState.startX + (e.clientX - panState.sx);
        cam.y = panState.startY + (e.clientY - panState.sy);
        applyTransform();
      } else if(pointers.size === 2 && pinchState){
        const pts = [...pointers.values()];
        const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1;
        const mid = { x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2 };
        const rect = viewport.getBoundingClientRect();
        const factor = dist / pinchState.startDist;
        const nz = clampZoom(pinchState.startZoom * factor);
        const mxRel = pinchState.startMid.x - rect.left, myRel = pinchState.startMid.y - rect.top;
        const wx = (mxRel - pinchState.startX) / pinchState.startZoom;
        const wy = (myRel - pinchState.startY) / pinchState.startZoom;
        const shiftX = mid.x - pinchState.startMid.x, shiftY = mid.y - pinchState.startMid.y;
        cam.zoom = nz;
        cam.x = mxRel - wx*nz + shiftX;
        cam.y = myRel - wy*nz + shiftY;
        applyTransform();
      }
    });
    function endPointer(e){
      pointers.delete(e.pointerId);
      if(pointers.size === 0){ panState = null; pinchState = null; viewport.classList.remove('panning'); touch(); }
      else if(pointers.size === 1){
        const [, p] = [...pointers.entries()][0];
        panState = { sx:p.x, sy:p.y, startX:cam.x, startY:cam.y }; pinchState = null;
      }
    }
    viewport.addEventListener('pointerup', endPointer);
    viewport.addEventListener('pointercancel', endPointer);
    viewport.addEventListener('wheel', e=>{
      e.preventDefault();
      const rect = viewport.getBoundingClientRect();
      const factor = Math.exp(-e.deltaY * 0.0015);
      zoomAround(e.clientX-rect.left, e.clientY-rect.top, factor);
    }, {passive:false});

    canvasWrap.querySelector('[data-zoomin]').onclick = ()=>{ const r=viewport.getBoundingClientRect(); zoomAround(r.width/2, r.height/2, 1.25); };
    canvasWrap.querySelector('[data-zoomout]').onclick = ()=>{ const r=viewport.getBoundingClientRect(); zoomAround(r.width/2, r.height/2, 1/1.25); };
    canvasWrap.querySelector('[data-fit]').onclick = ()=>fitView();
    canvasWrap.querySelector('[data-organize]').onclick = ()=>{ autoLayoutGenealogy(g); drawLines(); applyTransform(); Object.entries(nodeEls).forEach(([id, el])=>{ const p = g.positions[id]; if(p){ el.style.left = p.x+'px'; el.style.top = p.y+'px'; } }); touch(); toast('Organizado ✓'); };

    const searchInp = below.querySelector('.pt-search');
    searchInp.value = ui.genealogy.q || '';
    searchInp.oninput = e => {
      ui.genealogy.q = e.target.value;
      const q = e.target.value.toLowerCase();
      Object.entries(nodeEls).forEach(([id, el])=>{
        const c = P.characters.find(x=>x.id===id);
        const match = !q || (c && (c.name||'').toLowerCase().includes(q));
        el.style.opacity = match ? '1' : '0.22';
      });
    };
    below.querySelector('[data-newrel]').onclick = ()=> modalNewRelationGen(g, ()=>{ touch(); drawLines(); drawRels(); drawList(); });

    function drawRels(){
      relList.innerHTML = '';
      if(!g.relations.length){ relList.innerHTML = '<div class="empty">Sin relaciones.</div>'; return; }
      const typeLabels = { parent:'Padre/Madre/Tutor ↧', sibling:'Hermano/a ~', partner:'Pareja ♥', other:'Otra' };
      g.relations.forEach(r=>{
        const A = P.characters.find(x=>x.id===r.a);
        const B = P.characters.find(x=>x.id===r.b);
        if(!A || !B) return;
        const row = make(`<div class="relrow">
          <span class="rel-txt"><b>${esc(A.name||'?')}</b> → <b>${esc(B.name||'?')}</b> <small style="color:var(--muted)">${esc(typeLabels[r.type]||r.type||'')}</small></span>
          <button class="btn small" data-edit>✎</button>
          <button class="btn small danger" data-del>🗑</button>
        </div>`);
        row.querySelector('[data-edit]').onclick = ()=>{
          openModal(`<h3>✎ Editar relación</h3>
            <label class="field"><span>Tipo</span><select data-t>
              <option value="parent" ${r.type==='parent'?'selected':''}>Padre/Madre/Tutor ↧</option>
              <option value="sibling" ${r.type==='sibling'?'selected':''}>Hermano/a ~</option>
              <option value="partner" ${r.type==='partner'?'selected':''}>Pareja ♥</option>
              <option value="other" ${r.type==='other'?'selected':''}>Otra</option>
            </select></label>
            <label class="field"><span>Etiqueta libre (opcional)</span><input data-l value="${esc(r.label||'')}"></label>
            <div class="modal-actions">
              <button class="btn" data-no>Cancelar</button>
              <button class="btn primary" data-yes>Guardar</button>
            </div>`,
            m=>{
              m.querySelector('[data-no]').onclick = closeModal;
              m.querySelector('[data-yes]').onclick = ()=>{
                r.type = m.querySelector('[data-t]').value;
                r.label = m.querySelector('[data-l]').value;
                closeModal(); touch(); drawLines(); drawRels();
              };
            });
        };
        row.querySelector('[data-del]').onclick = async ()=>{
          if(await confirmar('¿Borrar esta relación?')){
            g.relations = g.relations.filter(x=>x.id!==r.id);
            touch(); drawLines(); drawRels(); drawList();
          }
        };
        relList.appendChild(row);
      });
    }
    drawRels();
  }

  function autoLayoutGenealogy(g){
    // Generaciones: BFS desde nodos sin padres
    const members = g.members.map(id=>P.characters.find(c=>c.id===id)).filter(Boolean);
    const parents = {}; // id → [parent ids]
    members.forEach(c=>{ parents[c.id] = []; });
    g.relations.forEach(r=>{
      if(r.type === 'parent' && parents[r.b]) parents[r.b].push(r.a);
    });
    const gen = {};
    const roots = members.filter(c => parents[c.id].length === 0);
    // BFS
    const queue = roots.map(c=>({ id:c.id, g:0 }));
    while(queue.length){
      const { id, g:genIdx } = queue.shift();
      if(gen[id] !== undefined && gen[id] <= genIdx) continue;
      gen[id] = genIdx;
      g.relations.forEach(r=>{
        if(r.type === 'parent' && r.a === id && g.members.includes(r.b)){
          queue.push({ id: r.b, g: genIdx+1 });
        }
      });
    }
    members.forEach(c=>{ if(gen[c.id] === undefined) gen[c.id] = 0; });
    // Agrupar por generación
    const byGen = {};
    members.forEach(c=>{ const k = gen[c.id]; if(!byGen[k]) byGen[k]=[]; byGen[k].push(c); });
    // Ordenar por posición del padre/madre si existe
    Object.keys(byGen).forEach(k=>{
      byGen[k].sort((a,b)=>{
        const pa = parents[a.id][0], pb = parents[b.id][0];
        if(!pa && !pb) return 0;
        if(!pa) return 1;
        if(!pb) return -1;
        return 0;
      });
    });
    // Posicionar
    const gapX = 160, gapY = 160;
    Object.keys(byGen).sort((a,b)=>a-b).forEach(k=>{
      const row = byGen[k];
      const total = row.length;
      row.forEach((c, i)=>{
        const x = (i - (total-1)/2) * gapX;
        const y = k * gapY;
        g.positions[c.id] = { x, y };
      });
    });
  }

  function modalManageMembersGen(g, onDone){
    openModal(`<h3>👥 Personajes en el árbol</h3>
      <label class="field"><span>Buscar</span><input data-q placeholder="Filtra..." autofocus></label>
      <div class="picklist" data-list></div>
      <div class="modal-actions" style="justify-content:space-between">
        <button class="btn" data-newchar>+ Crear personaje</button>
        <button class="btn primary" data-cancel>Cerrar</button>
      </div>`,
      m=>{
        const listEl = m.querySelector('[data-list]');
        const qInp = m.querySelector('[data-q]');
        const draw = (q='')=>{
          listEl.innerHTML = '';
          if(!P.characters.length){ listEl.innerHTML = '<div class="empty">Sin personajes.</div>'; return; }
          const f = P.characters.filter(c => (c.name||'').toLowerCase().includes(q.toLowerCase()));
          f.forEach(c=>{
            const checked = g.members.includes(c.id);
            const item = make(`<label class="pickitem" style="cursor:pointer">
              <input type="checkbox" ${checked?'checked':''} style="accent-color:var(--gold)">
              <span>🧝 ${esc(c.name||'Sin nombre')}</span>
            </label>`);
            const cb = item.querySelector('input');
            cb.onchange = ()=>{
              if(cb.checked){ if(!g.members.includes(c.id)){ g.members.push(c.id); if(!g.positions[c.id]) g.positions[c.id] = { x:0, y:0 }; } }
              else { g.members = g.members.filter(x=>x!==c.id); g.relations = g.relations.filter(r=>r.a!==c.id && r.b!==c.id); delete g.positions[c.id]; }
              touch();
            };
            listEl.appendChild(item);
          });
        };
        draw();
        qInp.oninput = ()=> draw(qInp.value);
        m.querySelector('[data-newchar]').onclick = ()=>{
          const c = newCharacter(); P.characters.push(c); g.members.push(c.id); g.positions[c.id] = { x:0, y:0 };
          touch(); draw(qInp.value);
        };
        m.querySelector('[data-cancel]').onclick = ()=>{ closeModal(); onDone(); };
      });
  }
  function modalNewRelationGen(g, onDone){
    const members = g.members.map(id=>P.characters.find(c=>c.id===id)).filter(Boolean);
    if(members.length < 2){ toast('Necesitas 2+ personajes'); return; }
    const opts = members.map(c=>`<option value="${c.id}">${esc(c.name||'Sin nombre')}</option>`).join('');
    openModal(`<h3>🌳 Nueva relación familiar</h3>
      <label class="field"><span>Personaje A</span><select data-a>${opts}</select></label>
      <label class="field"><span>Personaje B</span><select data-b>${opts}</select></label>
      <label class="field"><span>Tipo de relación</span><select data-t>
        <option value="parent">Padre/Madre/Tutor de (A → B)</option>
        <option value="sibling">Hermano/a de</option>
        <option value="partner">Pareja de</option>
        <option value="other">Otra</option>
      </select></label>
      <label class="field"><span>Etiqueta libre (opcional)</span><input data-l placeholder="Padre adoptivo, hermanastro..."></label>
      <div class="modal-actions">
        <button class="btn" data-no>Cancelar</button>
        <button class="btn primary" data-yes>Crear</button>
      </div>`,
      m=>{
        m.querySelector('[data-b]').selectedIndex = Math.min(1, members.length-1);
        m.querySelector('[data-no]').onclick = closeModal;
        m.querySelector('[data-yes]').onclick = ()=>{
          const a = m.querySelector('[data-a]').value;
          const b = m.querySelector('[data-b]').value;
          const type = m.querySelector('[data-t]').value;
          const label = m.querySelector('[data-l]').value;
          if(a === b){ toast('Elige dos distintos'); return; }
          g.relations.push({ id: uid(), a, b, type, label });
          closeModal(); touch(); onDone && onDone();
        };
      });
  }

  wrap.querySelector('[data-new]').onclick = ()=>{
    const ng = newGenealogy();
    ng.name = 'Genealogía ' + (P.genealogies.length + 1);
    P.genealogies.push(ng);
    ui.genealogy.sel = ng.id;
    touch(); drawList(); drawDetail(); toast('Genealogía creada ✓');
  };
  drawList(); drawDetail();
  return wrap;
}

/* ==== 8.11 Alturas ==== */
function viewHeights(){
  if(!P.heightGroups) P.heightGroups = [];
  if(!ui.heights) ui.heights = { q:'', sel:null };
  const wrap = make(`<div class="split">
    <div class="pane-list">

        <h3>Grupos</h3>
        <div class="pane-actions">
          <button class="btn small primary" data-new>+</button>
        </div>
      </div>
      <div class="list" data-list></div>
    </div>
    <div class="pane-detail" data-detail></div>
  </div>`);

  const detail = wrap.querySelector('[data-detail]');

  function drawList(){
    list.innerHTML = '';
    if(!P.heightGroups.length){ list.innerHTML = '<div class="empty">Sin grupos.</div>'; return; }
    P.heightGroups.forEach(g=>{
      const it = make(`<div class="list-item ${g.id===ui.heights.sel?'active':''}">

  }
  function drawDetail(){
    detail.innerHTML = '';
    let g = P.heightGroups.find(x=>x.id===ui.heights.sel);
    if(!g){
      if(P.heightGroups.length){ g = P.heightGroups[0]; ui.heights.sel = g.id; }
      else { detail.appendChild(make('<div class="paper empty">Crea un grupo para empezar.</div>')); return; }
    }
    g.members = g.members || [];

    const box = make('<div class="paper"></div>');
    box.appendChild(titleRow(g.name, v=>{ g.name = v; touch(); drawList(); }, [
      {label:'⧉', onClick:()=>{
        const d = dupeItem(g); d.name = (g.name||'Grupo') + ' (copia)';
        P.heightGroups.push(d); ui.heights.sel = d.id;
        touch(); drawList(); drawDetail();
      }},
      {label:'🗑', cls:'danger', onClick: async ()=>{
        if(await pedirBorrado(g.name||'este grupo')){
          P.heightGroups = P.heightGroups.filter(x=>x.id!==g.id);
          ui.heights.sel = P.heightGroups[0] ? P.heightGroups[0].id : null;
          touch(); drawList(); drawDetail();
        }
      }}
    ], 'Nombre del grupo'));

    // Miembros
    const chips = make('<div class="chips"></div>');
    function drawMembers(){
      chips.innerHTML = '';
      const memberChars = g.members.map(id=>P.characters.find(c=>c.id===id)).filter(Boolean);
      if(!memberChars.length) chips.innerHTML = '<span class="hint" style="margin:0">Sin personajes.</span>';
      memberChars.forEach(c=>{
        const h = parseNumber(c.height);
        const chip = make(`<span class="chip">🧝 ${esc(c.name||'Sin nombre')}${h?` <small style="color:var(--muted)">${h} cm</small>`:''}<span class="x">✕</span></span>`);
        chip.querySelector('.x').onclick = (e)=>{ e.stopPropagation(); g.members = g.members.filter(x=>x!==c.id); touch(); drawMembers(); drawChart(); };
        chips.appendChild(chip);
      });
    }
    drawMembers();
    box.appendChild(make('<div style="margin:14px 0 4px;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--gold-soft)">Personajes en el grupo</div>'));
    box.appendChild(chips);
    const manageBtn = make('<button class="btn small" style="margin-top:8px">👥 Gestionar personajes</button>');
    manageBtn.onclick = ()=> modalManageHeightMembers(g, ()=>{ touch(); drawMembers(); drawChart(); drawList(); });
    box.appendChild(manageBtn);

    // Chart
    const chartWrap = make('<div style="margin-top:18px"></div>');
    chartWrap.appendChild(make('<div style="font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--gold-soft);margin-bottom:8px">Representación a escala</div>'));
    const chart = make('<div class="height-chart"></div>');
    chartWrap.appendChild(chart);
    box.appendChild(chartWrap);

    function drawChart(){
      chart.innerHTML = '';
      const list = g.members.map(id=>P.characters.find(c=>c.id===id)).filter(Boolean);
      const heights = list.map(c => parseNumber(c.height)).filter(h => h !== null && h > 0);
      if(!heights.length){ chart.innerHTML = '<div class="empty">Añade altura (en cm) a los personajes para ver el gráfico.</div>'; return; }
      const min = Math.min(...heights);
      const max = Math.max(...heights);
      const padTop = 30, padBottom = 30;
      // Añadimos margen visual
      const displayMin = Math.max(0, Math.floor(min/10)*10 - 10);
      const displayMax = Math.ceil(max/10)*10 + 10;
      const range = displayMax - displayMin || 1;
      const heightPx = chart.clientHeight - padTop - padBottom;

      // Líneas horizontales
      for(let h = Math.ceil(displayMin/10)*10; h <= displayMax; h += 10){
        const y = padTop + (1 - (h - displayMin) / range) * heightPx;
        const line = make(`<div class="height-line" style="top:${y}px"><span>${h} cm</span></div>`);
        chart.appendChild(line);
      }
      // Personajes
      const total = list.length;
      const colW = 70;
      const totalW = total * colW + 40;
      const availW = Math.max(chart.clientWidth - 40, totalW);
      const offsetX = 30;
      list.forEach((c, i)=>{
        const h = parseNumber(c.height);
        if(h === null){ return; }
        const barH = ((h - displayMin) / range) * heightPx;
        const fig = make(`<div class="height-fig">
          <div class="val">${h} cm</div>
          <div class="bar" style="height:${Math.max(6, barH)}px"></div>
          <div class="name">${esc(c.name||'?')}</div>
        </div>`);
        const xPos = offsetX + (availW - offsetX*2) * (i / Math.max(1, total-1));
        fig.style.left = (i * colW + 60) + 'px';
        fig.style.bottom = padBottom + 'px';
        chart.appendChild(fig);
      });
    }
    drawChart();

    detail.appendChild(box);
    setTimeout(drawChart, 50);
  }

  function modalManageHeightMembers(g, onDone){
    openModal(`<h3>👥 Personajes del grupo</h3>
      <label class="field"><span>Buscar</span><input data-q placeholder="Filtra..." autofocus></label>
      <div class="picklist" data-list></div>
      <div class="modal-actions"><button class="btn primary" data-cancel>Cerrar</button></div>`,
      m=>{
        const listEl = m.querySelector('[data-list]');
        const qInp = m.querySelector('[data-q]');
        const draw = (q='')=>{
          listEl.innerHTML = '';
          const f = P.characters.filter(c => (c.name||'').toLowerCase().includes(q.toLowerCase()));
          if(!f.length){ listEl.innerHTML = '<div class="empty">Sin resultados.</div>'; return; }
          f.forEach(c=>{
            const h = parseNumber(c.height);
            const checked = g.members.includes(c.id);
            const item = make(`<label class="pickitem" style="cursor:pointer">
              <input type="checkbox" ${checked?'checked':''} style="accent-color:var(--gold)">
              <span>🧝 ${esc(c.name||'Sin nombre')} <small style="color:var(--muted)">${h?h+' cm':'sin altura'}</small></span>
            </label>`);
            const cb = item.querySelector('input');
            cb.onchange = ()=>{
              if(cb.checked){ if(!g.members.includes(c.id)) g.members.push(c.id); }
              else g.members = g.members.filter(x=>x!==c.id);
              touch();
            };
            listEl.appendChild(item);
          });
        };
        draw();
        qInp.oninput = ()=> draw(qInp.value);
        m.querySelector('[data-cancel]').onclick = ()=>{ closeModal(); onDone(); };
      });
  }

  wrap.querySelector('[data-new]').onclick = ()=>{
    const ng = newHeightGroup();
    ng.name = 'Grupo ' + (P.heightGroups.length + 1);

  };
  drawList(); drawDetail();
  return wrap;
}

/* ==== 8.14 Mundo (sin cambios) ==== */
function findZone(id, arr){
  arr = arr || P.world;
  for(const z of arr){
    if(z.id === id) return z;
    const r = findZone(id, z.children);
    if(r) return r;
  }
  return null;
}
function findZoneParent(id, arr, parent){
  arr = arr || P.world;
  for(const z of arr){
    if(z.id === id) return {list: arr, parent};
    const r = findZoneParent(id, z.children, z);
    if(r) return r;
  }
  return null;
}
function viewWorld(){
  const wrap = make(`<div class="split">
    <div class="pane-list">
      <div class="pane-head">
        <h3>Mundo</h3>
        <div class="pane-actions">
          <button class="btn small" data-expall title="Expandir todo">⊞</button>
          <button class="btn small" data-colall title="Contraer todo">⊟</button>
          <button class="btn small primary" data-newworld title="Nuevo mundo">+</button>
        </div>
      </div>
      <div class="pane-tools">
        <input class="pt-search" placeholder="🔍 Buscar zona...">
      </div>
      <div class="list" data-tree></div>
    </div>
    <div class="pane-detail" data-detail></div>
  </div>`);
  const tree = wrap.querySelector('[data-tree]');
  const detail = wrap.querySelector('[data-detail]');
  const searchInp = wrap.querySelector('.pt-search');
  searchInp.value = ui.world.q || '';
  searchInp.oninput = ()=>{ ui.world.q = searchInp.value; drawTree(); };
  function matchZone(z, q){
    if(!q) return true;
    if((z.name||'').toLowerCase().includes(q)) return true;
    return (z.children||[]).some(ch => matchZone(ch, q));
  }
  function drawTree(){
    tree.innerHTML = '';
    if(!P.world.length){ tree.innerHTML = '<div class="empty">Sin mundos todavía.</div>'; return; }
    const q = (ui.world.q||'').toLowerCase();
    (function walk(arr, depth){
      arr.forEach(z=>{
        if(!matchZone(z, q)) return;
        const hasChildren = z.children && z.children.length > 0;
        const isOpen = ui.worldOpen[z.id] !== false || !!q;
        const row = make(`<div class="tree-row ${z.id===worldSel?'active':''}" style="padding-left:${8+depth*14}px">
          <span class="caret">${hasChildren ? (isOpen?'▼':'▶') : '·'}</span>
          <span>${ZONE_ICON[z.type]||'📍'}</span>
          <span class="tree-name">${esc(z.name||'Sin nombre')}</span>
        </div>`);
        const caret = row.querySelector('.caret');
        if(hasChildren){
          caret.onclick = (e)=>{ e.stopPropagation(); ui.worldOpen[z.id] = !(ui.worldOpen[z.id] !== false); drawTree(); };
        }
        row.onclick = ()=>{ worldSel = z.id; render(); };
        tree.appendChild(row);
        if(hasChildren && isOpen) walk(z.children, depth+1);
      });
    })(P.world, 0);
  }
  function drawDetail(){
    detail.innerHTML = '';
    if(!worldSel || !findZone(worldSel)){
      if(P.world.length) worldSel = P.world[0].id;
      else worldSel = null;
    }

    box.appendChild(titleRow(z.name, v=>{ z.name = v; touch(); drawTree(); }, [
      {label:'📋', onClick:()=>{ clipboard = {kind:'zone', data:deepClone(z)}; toast('Copiado ✓'); }},
      {label:'⧉', onClick:()=>{
          const d = dupeItem(z); d.name = (z.name||'Zona') + ' (copia)';

        }},
      {label:'🗑', cls:'danger', onClick: async ()=>{
          if(await pedirBorrado(z.name||'esta zona')){
            const info = findZoneParent(z.id);
            info.list.splice(info.list.indexOf(z),1);
            worldSel = null; touch(); render();
          }
        }}
    ], 'Nombre de la zona'));
    box.appendChild(imagePicker(z.image, v=>{ z.image = v; touch(); drawTree(); }));
    box.appendChild(fieldInput('Ubicación / Cómo llegar', z.location, v=>{ z.location = v; touch(); }, 'Al norte del continente...'));
    box.appendChild(make('<div style="height:6px"></div>'));
    box.appendChild(createEditor(z.desc, v=>{ z.desc = v; touch(); }));
    const childType = ZONE_CHILD[z.type];
    const hijosBox = make(`<div style="margin-top:18px"></div>`);
    hijosBox.appendChild(make(`<h3 style="font-size:13px;color:var(--gold-soft);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">${ZONE_ICON[childType]} ${ZONE_LABEL[childType]}s dentro</h3>`));
    const hlist = make('<div class="list"></div>');
    (z.children||[]).forEach(ch=>{
      const it = make(`<div class="list-item"><span class="li-title">${ZONE_ICON[ch.type]} ${esc(ch.name||'Sin nombre')}</span></div>`);
      it.onclick = ()=>{ worldSel = ch.id; render(); };
      hlist.appendChild(it);
    });
    if(!z.children || !z.children.length) hlist.innerHTML = '<div class="empty">Sin subzonas.</div>';
    hijosBox.appendChild(hlist);
    const addChild = make(`<button class="btn small" style="margin-top:8px">+ Añadir ${ZONE_LABEL[childType]}</button>`);
    addChild.onclick = ()=>{
      const nz = newZone(childType);
      z.children = z.children || [];
      z.children.push(nz);
      ui.worldOpen[z.id] = true;
      worldSel = nz.id; touch(); render();
    };
    hijosBox.appendChild(addChild);
    box.appendChild(hijosBox);
    const linksBox = make('<div style="margin-top:18px"></div>');
    linksBox.appendChild(make('<h3 style="font-size:13px;color:var(--gold-soft);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">🔗 Enlaces</h3>'));
    const chips = make('<div class="chips"></div>');
    function drawChips(){
      chips.innerHTML = '';
      (z.links||[]).forEach((l, i)=>{
        const e = indexEntities().find(x=>x.id===l.targetId);
        if(!e) return;
        const chip = make(`<span class="chip">${ICON[e.type]||'•'} ${esc(e.name)}<span class="x">✕</span></span>`);
        chip.querySelector('.x').onclick = (ev)=>{ ev.stopPropagation(); z.links.splice(i,1); touch(); drawChips(); };
        chip.onclick = ()=> goTo(e.id);
        chip.style.cursor = 'pointer';
        chips.appendChild(chip);
      });
      if(!z.links || !z.links.length) chips.innerHTML = '<span class="hint" style="margin:0">Sin enlaces.</span>';
    }
    drawChips();
    linksBox.appendChild(chips);
    const addLink = make('<button class="btn small" style="margin-top:8px">+ Enlazar con...</button>');
    addLink.onclick = ()=> modalEnlazar(z, drawChips);
    linksBox.appendChild(addLink);
    box.appendChild(linksBox);

    // Personajes que viven aquí
    const charsBox = make('<div style="margin-top:18px"></div>');
    charsBox.appendChild(make('<h3 style="font-size:13px;color:var(--gold-soft);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">🧝 Personajes que viven aquí</h3>'));
    const charsChips = make('<div class="chips"></div>');
    function drawZoneChars(){
      charsChips.innerHTML = '';
      (z.characterIds||[]).forEach((id, i)=>{
        const ch = P.characters.find(x=>x.id===id);
        if(!ch) return;
        const chip = make(`<span class="chip">🧝 ${esc(ch.name||'Sin nombre')}<span class="x" title="Quitar">✕</span></span>`);
        chip.querySelector('.x').onclick = (ev)=>{ ev.stopPropagation(); z.characterIds.splice(i,1); touch(); drawZoneChars(); };
        chip.onclick = (ev)=>{ if(ev.target.classList.contains('x')) return; goTo(ch.id); };
        chip.style.cursor = 'pointer';
        charsChips.appendChild(chip);
      });
      const addChip = make('<span class="chip chip-add">+ Añadir personajes</span>');
      addChip.onclick = ()=> pickCharactersModal(z.characterIds, drawZoneChars, touch);
      charsChips.appendChild(addChip);
    }
    drawZoneChars();
    charsBox.appendChild(charsChips);
    box.appendChild(charsBox);

    const mapBox = make('<div style="margin-top:20px"></div>');
    mapBox.appendChild(make('<h3 style="font-size:13px;color:var(--gold-soft);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">🗺 Mapa</h3>'));
    const map = z.map = z.map || { image:'', pins: [] };
    const mapImgPick = make(`<div class="imgpick">
      <div class="imgprev">Sin mapa</div>
      <div class="imgbtns">
        <button class="btn small" data-up>📁 Subir</button>
        <button class="btn small danger" data-del>Quitar</button>
      </div>
    </div>`);
    const mprev = mapImgPick.querySelector('.imgprev');
    const paintMap = ()=>{ if(map.image){ mprev.style.backgroundImage = `url("${map.image}")`; mprev.textContent=''; } else { mprev.style.backgroundImage=''; mprev.textContent='Sin mapa'; } };
    paintMap();
    const mInp = document.createElement('input'); mInp.type='file'; mInp.accept='image/*';
    mInp.onchange = ()=>{
      const f = mInp.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{ map.image = r.result; touch(); paintMap(); drawMap(); };
      r.readAsDataURL(f);
    };
    mapImgPick.querySelector('[data-up]').onclick = ()=> mInp.click();
    mapImgPick.querySelector('[data-del]').onclick = ()=>{ map.image=''; touch(); paintMap(); drawMap(); };
    mapBox.appendChild(mapImgPick);
    const mapBoxEl = make('<div class="mapbox" data-map></div>');
    const pinCtrls = make('<div class="pinlist" data-pins></div>');
    mapBox.appendChild(mapBoxEl);
    mapBox.appendChild(pinCtrls);
    function drawMap(){
      mapBoxEl.style.backgroundImage = map.image ? `url("${map.image}")` : '';
      mapBoxEl.innerHTML = '';
      if(!map.image){
        mapBoxEl.appendChild(make('<div class="empty" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)">Sube un mapa</div>'));
      }
      map.pins.forEach(p=>{
        const pin = make(`<div class="pin">${esc(p.label||'•')}</div>`);
        pin.style.left = p.x + '%'; pin.style.top = p.y + '%';
        mapBoxEl.appendChild(pin);
        let dragging = false, moved = false;
        pin.addEventListener('pointerdown', e=>{ e.stopPropagation(); dragging = true; moved = false; pin.setPointerCapture(e.pointerId); });
        pin.addEventListener('pointermove', e=>{
          if(!dragging) return;
          moved = true;
          const r = mapBoxEl.getBoundingClientRect();
          p.x = Math.max(0, Math.min(100, ((e.clientX - r.left)/r.width)*100));
          p.y = Math.max(0, Math.min(100, ((e.clientY - r.top)/r.height)*100));
          pin.style.left = p.x + '%'; pin.style.top = p.y + '%';
        });
        pin.addEventListener('pointerup', ()=>{
          dragging = false;
          if(moved){ touch(); }
          else if(p.target){ goTo(p.target); }
        });
      });
      drawPins();
    }
    function drawPins(){
      pinCtrls.innerHTML = '';
      if(!map.pins.length){ pinCtrls.innerHTML = '<div class="empty" style="padding:6px">Sin marcadores.</div>'; return; }
      const ents = indexEntities();
      map.pins.forEach((p, i)=>{
        const row = make(`<div class="pinrow">
          <input data-l value="${esc(p.label||'')}" placeholder="Etiqueta">
          <select data-t>
            <option value="">— Destino —</option>
            ${ents.map(e=>`<option value="${e.id}" ${p.target===e.id?'selected':''}>${esc(ICON[e.type]||'')} ${esc(e.name)}</option>`).join('')}
          </select>
          <button class="btn small danger">✕</button>
        </div>`);
        row.querySelector('[data-l]').oninput = e => { p.label = e.target.value; touch(); };
        row.querySelector('[data-t]').onchange = e => { p.target = e.target.value || null; touch(); };
        row.querySelector('button').onclick = ()=>{ map.pins.splice(i,1); touch(); drawMap(); };
        pinCtrls.appendChild(row);
      });
    }
    const addPin = make('<button class="btn small" style="margin-top:8px">+ Añadir marcador</button>');
    addPin.onclick = ()=>{ map.pins.push({ id: uid(), x:50, y:50, label:'Nuevo', target:null }); touch(); drawMap(); };
    mapBox.appendChild(addPin);
    drawMap();
    box.appendChild(mapBox);
    detail.appendChild(box);
  }
  wrap.querySelector('[data-newworld]').onclick = ()=>{
    const z = newZone('world');
    P.world.push(z); worldSel = z.id; ui.worldOpen[z.id] = true; touch(); render();
  };
  wrap.querySelector('[data-expall]').onclick = ()=>{ (function openAll(arr){ (arr||[]).forEach(z=>{ ui.worldOpen[z.id] = true; openAll(z.children); }); })(P.world); drawTree(); };
  wrap.querySelector('[data-colall]').onclick = ()=>{ (function closeAll(arr){ (arr||[]).forEach(z=>{ ui.worldOpen[z.id] = false; closeAll(z.children); }); })(P.world); drawTree(); };
  drawTree(); drawDetail();
  return wrap;
}
function modalEnlazar(z, cb){
  const ents = indexEntities().filter(e => e.id !== z.id && !(z.links||[]).some(l=>l.targetId===e.id));
  openModal(`<h3>🔗 Enlazar con...</h3>
    <label class="field"><span>Buscar</span><input data-q placeholder="Filtra por nombre..." autofocus></label>
    <div class="picklist" data-list></div>
    <div class="modal-actions"><button class="btn" data-cancel>Cerrar</button></div>`,
    m=>{
      const list = m.querySelector('[data-list]');
      const draw = (q='')=>{
        list.innerHTML = '';
        const f = ents.filter(e => (e.name||'').toLowerCase().includes(q.toLowerCase()));
        if(!f.length){ list.innerHTML = '<div class="empty">Sin resultados</div>'; return; }
        f.forEach(e=>{
          const it = make(`<div class="pickitem">${ICON[e.type]||'•'} <span>${esc(e.name)}</span>
            <small style="color:var(--muted);margin-left:auto">${esc(LABEL[e.type]||'')}</small></div>`);
          it.onclick = ()=>{
            z.links = z.links || [];
            z.links.push({ id: uid(), targetId: e.id });
            touch(); closeModal(); cb();
          };
          list.appendChild(it);
        });
      };
      draw();
      m.querySelector('[data-q]').addEventListener('input', ev => draw(ev.target.value));
      m.querySelector('[data-cancel]').onclick = closeModal;
    });
}

/* ==== 8.15 Lore ==== */
function viewLore(){
  if(!P.lore) P.lore = [];
  if(!P.loreFolders) P.loreFolders = [];
  if(!ui.lore.sel) ui.lore.sel = [];

  const wrap = make(`<div class="split">
    <div class="pane-list">
      <div class="pane-head">
        <h3>Lore</h3>
        <div class="pane-actions">
          <button class="btn small" data-newfolder title="Nueva carpeta">📁+</button>
          <button class="btn small primary" data-new>+</button>
        </div>
      </div>
      <div data-tools></div>
      <div data-bulk></div>
      <div class="list" data-list></div>
    </div>
    <div class="pane-detail" data-detail></div>
  </div>`);
  const list = wrap.querySelector('[data-list]');
  const detail = wrap.querySelector('[data-detail]');
  const toolsBox = wrap.querySelector('[data-tools]');
  const bulkBox = wrap.querySelector('[data-bulk]');
  let drawDetailRef = null;

  const ctrl = makeFolderedList({
    listEl: list, bulkEl: bulkBox,
    getItems: () => P.lore,
    getFolders: () => P.loreFolders,
    getSel: () => ui.lore.sel,
    setSel: v => { ui.lore.sel = v; },
    foldersOpen: ui.loreFoldersOpen,
    renderItemHTML: (l) =>
      `${l.image ? `<div class="li-thumb" style="background-image:url('${esc(l.image)}')"></div>` : ''}
       <span class="li-title">${esc(l.name||'Lore sin nombre')}</span>
       <span class="li-sub">${esc([l.type, stripHtml(l.short)].filter(Boolean).join(' · ').slice(0,50) || 'Sin datos')}</span>`,
    onSelect: id => { sel.lore = id; drawDetailRef && drawDetailRef(); },
    onTouch: touch,
    emptyLabel: 'Sin entradas de lore.',
    allowMove: () => (ui.lore.sort==='custom') && !ui.lore.q,
    getSorted: () => {
      const mode = ui.lore.sort || 'custom';
      let arr = applyFilter(P.lore, ui.lore.q, [l=>l.name, l=>l.type]);
      if(mode !== 'custom') arr = applySort(arr, mode, l=>l.name);
      return arr;
    }
  });
  function drawDetail(){
    detail.innerHTML = '';
    if(!P.lore.length){ detail.appendChild(make('<div class="paper empty">Selecciona o crea una entrada.</div>')); return; }
    let l = P.lore.find(x=>x.id===sel.lore);
    if(!l){ l = P.lore[0]; sel.lore = l.id; }
    if(!Array.isArray(l.sections)) l.sections = [];

    const box = make('<div class="paper"></div>');
    box.appendChild(titleRow(l.name, v=>{ l.name = v; touch(); ctrl.drawList(); }, [
      {label:'📋', onClick:()=>{ clipboard = {kind:'lore', data:deepClone(l)}; toast('Copiado ✓'); }},
      {label:'⧉', onClick:()=>{
        const d = dupeItem(l); d.name = (l.name||'Lore') + ' (copia)';
        const i = P.lore.indexOf(l); P.lore.splice(i+1,0,d);
        sel.lore = d.id; touch(); ctrl.drawList(); drawDetail();
      }},
      {label:'🗑', cls:'danger', onClick: async ()=>{
        if(await pedirBorrado(l.name||'esta entrada')){
          P.lore = P.lore.filter(x=>x.id!==l.id);
          ui.lore.sel = ui.lore.sel.filter(x=>x!==l.id);
          sel.lore = null; touch(); ctrl.drawList(); drawDetail();
        }
      }}
    ], 'Título'));
    box.appendChild(imagePicker(l.image, v=>{ l.image = v; touch(); ctrl.drawList(); }));

    // Tipo
    const typeWrap = make(`<label class="field"><span>Tipo</span><select></select></label>`);
    const ts = typeWrap.querySelector('select');
    const oNone = document.createElement('option'); oNone.value=''; oNone.textContent='— Sin definir —'; ts.appendChild(oNone);
    LORE_TYPES.forEach(t=>{ const o = document.createElement('option'); o.value=t; o.textContent=t; ts.appendChild(o); });
    if(l.type && !LORE_TYPES.includes(l.type)){ const o = document.createElement('option'); o.value=l.type; o.textContent=l.type; ts.appendChild(o); }
    const oCustom = document.createElement('option'); oCustom.value='__custom__'; oCustom.textContent='+ Otro…'; ts.appendChild(oCustom);
    ts.value = l.type || '';
    ts.onchange = ()=>{
      if(ts.value === '__custom__'){
        pedir('Otro tipo', [{key:'v', label:'Escribe', value:'', autofocus:true}]).then(r=>{
          if(r && r.v.trim()){ l.type = r.v.trim(); touch(); ctrl.drawList(); drawDetail(); }
        });
        return;
      }
      l.type = ts.value; touch(); ctrl.drawList();
    };
    box.appendChild(typeWrap);

    const folderWrap = make(`<label class="field"><span>Carpeta</span>
      <select>
        <option value="">— Sin carpeta —</option>
        ${P.loreFolders.map(f=>`<option value="${esc(f)}" ${l.folder===f?'selected':''}>${esc(f)}</option>`).join('')}
      </select></label>`);
    folderWrap.querySelector('select').onchange = e=>{ l.folder = e.target.value; touch(); ctrl.drawList(); };
    box.appendChild(folderWrap);
    box.appendChild(fieldInput('Resumen breve', l.short, v=>{ l.short = v; touch(); ctrl.drawList(); }, 'Una frase...'));

    // Secciones
    box.appendChild(make('<div style="font-size:13px;letter-spacing:1px;color:var(--gold-soft);text-transform:uppercase;margin-top:14px">Secciones de texto</div>'));
    box.appendChild(makeSectionsUI(l, ()=>{ touch(); }));

    detail.appendChild(box);
  }
  drawDetailRef = drawDetail;
  toolsBox.appendChild(makePaneTools('lore', ctrl.drawList, '🔍 Buscar lore...'));
  wrap.querySelector('[data-new]').onclick = ()=>{ const l = newLore(); P.lore.push(l); sel.lore = l.id; touch(); ctrl.drawList(); drawDetail(); };
  wrap.querySelector('[data-newfolder]').onclick = async ()=>{
    const v = await pedir('📁 Nueva carpeta', [{key:'n', label:'Nombre', value:'', autofocus:true}]);
    if(v && v.n.trim()){
      const name = v.n.trim();
      if(P.loreFolders.includes(name)){ toast('Ya existe'); return; }
      P.loreFolders.push(name); touch(); ctrl.drawList();
    }
  };
  ctrl.drawList(); drawDetail();
  return wrap;
}
